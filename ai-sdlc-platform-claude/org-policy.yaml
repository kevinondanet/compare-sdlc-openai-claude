# AI-SDLC organization policy (the widest bounds any project may operate in).
# Projects may TIGHTEN any value below via project-config.yaml `overrides`; never loosen.
# These values are the platform defaults (aisdlc.policy.org_policy.OrgPolicy()).
version: 1
name: default

gates:
  # Gates each risk class must pass (ARCHITECTURE.md §3). Projects may only add gates.
  required_gates:
    docs_only: [G0, G2, G3]
    low: [G0, G1, G2, G3, G6]
    standard: [G0, G1, G2, G3, G4, G5, G6]
    high: [G0, G1, G2, G3, G4, G5, G6]
    critical: [G0, G1, G2, G3, G4, G5, G6]
    ai_agent: [G0, G1, G2, G3, G4, G5, G6]
  # Evaluation depth per risk class: skipped < light < standard < deep. Projects may deepen.
  depth:
    docs_only: light
    low: light
    standard: standard
    high: deep
    critical: deep
    ai_agent: deep

models:
  # fnmatch patterns over "provider/model". Projects may only narrow.
  allowlist:
    - anthropic/claude-*
    - openai/gpt-*
    - google/gemini-*
  independent_review_requires_different_family: true
  # Highest routing tier per agent role: low < standard < high < independent_review < escalation.
  max_tier_per_role:
    planner: high
    plan_checker: standard
    implementer: standard
    reviewer: independent_review
    verifier: low
    uat: standard
    security_tester: standard
  escalation_allowed: true

tool_tiers:
  # Tool risk tiers (ARCHITECTURE.md §4). Behaviour strictness:
  # automatic < automatic_audit < policy_controlled < approval < human_approval
  defaults:
    0: automatic
    1: automatic_audit
    2: policy_controlled
    3: approval
    4: human_approval
  approval_timeout_seconds: 300
  deny_on_timeout: true
  audit_from_tier: 1

cost_limits:
  budgets:
    per_change_usd: 50.0
    per_task_usd: 5.0
    per_day_usd: 500.0
    per_month_usd: 5000.0
  max_agent_turns: 40
  max_parallel_agents: 4
  max_review_rounds: 3
  max_tool_calls: 500
  context_ceiling_tokens: 200000

security_baselines:
  asr_threshold: 0.05
  max_undetermined_rate: 0.10
  coverage:
    lines: 80.0          # target
    lines_floor: 75.0    # ratchet floor
    diff_lines: 90.0
    branches: 70.0
    critical_modules: 90.0
  mutation_score: 0.60
  ambiguity_threshold: 0.20
  max_critical_vulns: 0
  max_high_vulns: 0
  require_sbom: true
  require_provenance: true
  require_secret_scan: true
  safety_asr_threshold: 0.05
  safety_trials_min: 5

evidence_standards:
  max_age_hours: 72
  require_commit_sha: true
  require_report_uri: true
  require_environment: true
  require_signatures: true
  signature_algorithms: [hmac-sha256, ed25519]
  min_signatures: 1
