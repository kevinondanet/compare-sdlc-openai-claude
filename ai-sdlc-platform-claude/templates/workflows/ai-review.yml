# Reusable organisation workflow: independent AI review of the actual diff with a governed
# model (aisdlc review). Output is bounded (max findings, 64 KiB summary) and the review
# JSON is uploaded as evidence/reviews.json input.
name: ai-review

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      model:
        description: Governed model id from the control-plane registry (empty = routed).
        type: string
        default: ""
      change-dir:
        description: Change package directory to attach review evidence to.
        type: string
        default: ""
      diff-base:
        type: string
        default: origin/main
      max-findings:
        type: string
        default: "50"
      aisdlc-spec:
        type: string
        default: "{{ aisdlc_spec }}"
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        description: API key for the governed model provider.
        required: false

permissions: {}

jobs:
  review:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install platform CLI
        env:
          AISDLC_SPEC: ${{ inputs.aisdlc-spec }}
        run: |
          [[ "$AISDLC_SPEC" =~ ^[A-Za-z0-9_.,;=<>!~@:/+\[\]-]+$ ]] || { echo "::error::invalid aisdlc-spec"; exit 1; }
          python -m pip install --disable-pip-version-check --quiet "$AISDLC_SPEC"
      - name: Independent AI review
        env:
          MODEL: ${{ inputs.model }}
          CHANGE_DIR: ${{ inputs.change-dir }}
          DIFF_BASE: ${{ inputs.diff-base }}
          MAX_FINDINGS: ${{ inputs.max-findings }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          mkdir -p reports
          if [[ "$DIFF_BASE" == */* ]]; then
            git fetch --no-tags --depth=200 "${DIFF_BASE%%/*}" "${DIFF_BASE#*/}" || echo "::warning::could not fetch $DIFF_BASE"
          fi
          args=(--diff-base "$DIFF_BASE" --max-findings "$MAX_FINDINGS" --out reports/review.json)
          if [[ -n "$MODEL" ]]; then args+=(--model "$MODEL"); fi
          if [[ -n "$CHANGE_DIR" ]]; then args+=(--package "$CHANGE_DIR"); fi
          aisdlc review run "${args[@]}"
      - name: Bound the summary
        if: always()
        run: |
          if [[ -f reports/review.json ]]; then head -c 65536 reports/review.json > reports/review-summary.json; fi
      - name: Post summary on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/review-summary.json')) { return; }
            const raw = fs.readFileSync('reports/review-summary.json', 'utf8').slice(0, 60000);
            const body = ['## AI review (aisdlc)', '', '```json', raw, '```'].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ai-review
          path: reports/
          retention-days: 30
          if-no-files-found: warn
