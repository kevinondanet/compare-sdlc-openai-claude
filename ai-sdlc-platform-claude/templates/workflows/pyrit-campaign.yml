# Reusable organisation workflow: PyRIT red-team campaign for high-risk changes
# (aisdlc security campaign run). Skipped unless risk-class is high | critical | ai_agent.
name: pyrit-campaign

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      risk-class:
        description: Change risk class; the campaign only runs for high, critical, ai_agent.
        type: string
        default: "{{ risk_class }}"
      spec:
        description: Campaign YAML path.
        type: string
        default: "{{ pyrit_spec }}"
      target:
        description: "'module:callable' application target or an http(s) URL."
        type: string
        default: "{{ pyrit_target }}"
      trials:
        description: Override the number of trials (empty = spec default).
        type: string
        default: ""
      baseline-dir:
        type: string
        default: ""
      aisdlc-spec:
        type: string
        default: "{{ aisdlc_spec }}"
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        required: false

permissions: {}

jobs:
  campaign:
    if: contains(fromJSON('["high","critical","ai_agent"]'), inputs.risk-class)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - "{{ setup_steps_fixed }}"
      - name: Install platform CLI with PyRIT
        env:
          AISDLC_SPEC: ${{ inputs.aisdlc-spec }}
        run: |
          [[ "$AISDLC_SPEC" =~ ^[A-Za-z0-9_.,;=<>!~@:/+\[\]-]+$ ]] || { echo "::error::invalid aisdlc-spec"; exit 1; }
          python -m pip install --disable-pip-version-check --quiet "$AISDLC_SPEC" "pyrit>=0.9"
      - "{{ install_steps }}"
      - name: Run campaign
        env:
          CAMPAIGN_SPEC: ${{ inputs.spec }}
          TARGET: ${{ inputs.target }}
          TRIALS: ${{ inputs.trials }}
          BASELINE_DIR: ${{ inputs.baseline-dir }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          mkdir -p reports
          if [[ -z "$TARGET" ]]; then echo "::error::no campaign target configured"; exit 1; fi
          args=(--target "$TARGET" --out reports/pyrit-result.json --evidence reports/pyrit.json)
          if [[ -n "$TRIALS" ]]; then args+=(--trials "$TRIALS"); fi
          if [[ -n "$BASELINE_DIR" ]]; then args+=(--baseline-dir "$BASELINE_DIR"); fi
          aisdlc security campaign run "$CAMPAIGN_SPEC" "${args[@]}"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pyrit-campaign
          path: reports/
          retention-days: 30
          if-no-files-found: warn
