# Reusable organisation workflow: SBOM (syft, SPDX JSON) and SLSA build provenance
# attestation (actions/attest-build-provenance, Sigstore bundle).
#
# Alternative for SLSA level 3 builds: the reusable generator
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
# must be referenced by tag (its verifier requires it); wire it from the caller if needed.
name: sbom-provenance

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      subject-path:
        description: Glob of build artifacts to attest (defaults to the SBOM itself).
        type: string
        default: reports/sbom.spdx.json
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""

permissions: {}

jobs:
  sbom:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: reports/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: ${{ inputs.subject-path }}
      - name: Record provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [[ -n "$BUNDLE_PATH" && -f "$BUNDLE_PATH" ]]; then
            cp "$BUNDLE_PATH" reports/provenance.sigstore.json
          else
            echo "::error::no provenance bundle produced"
            exit 1
          fi
      - name: Upload SBOM + provenance evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-provenance
          path: reports/
          retention-days: 90
