# Reusable organisation workflow: RAMPART-style agent safety regression suite
# (aisdlc security safety run). Incomplete runs fail closed.
name: safety-regression

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      module:
        description: Python module holding @safety_case tests ('pkg.mod' or 'pkg.mod:attr').
        type: string
        default: "{{ safety_module }}"
      aisdlc-spec:
        type: string
        default: "{{ aisdlc_spec }}"
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        required: false

permissions: {}

jobs:
  safety:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - "{{ setup_steps_fixed }}"
      - name: Install platform CLI
        env:
          AISDLC_SPEC: ${{ inputs.aisdlc-spec }}
        run: |
          [[ "$AISDLC_SPEC" =~ ^[A-Za-z0-9_.,;=<>!~@:/+\[\]-]+$ ]] || { echo "::error::invalid aisdlc-spec"; exit 1; }
          python -m pip install --disable-pip-version-check --quiet "$AISDLC_SPEC"
      - "{{ install_steps }}"
      - name: Run safety regression suite
        env:
          SAFETY_MODULE: ${{ inputs.module }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          mkdir -p reports
          if [[ -z "$SAFETY_MODULE" ]]; then echo "::error::no safety module configured"; exit 1; fi
          aisdlc security safety run "$SAFETY_MODULE" --out reports/safety-report.json --evidence reports/safety.json
      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: safety-regression
          path: reports/
          retention-days: 30
          if-no-files-found: warn
