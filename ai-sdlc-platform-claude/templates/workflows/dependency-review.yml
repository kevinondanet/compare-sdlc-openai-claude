# Reusable organisation workflow: dependency review (SCA) on pull requests with the
# vulnerable-changes output captured as JSON evidence.
name: dependency-review

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      fail-on-severity:
        description: Minimum severity that fails the check (low | moderate | high | critical).
        type: string
        default: high
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""

permissions: {}

jobs:
  review:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: never
      - name: Record vulnerable changes
        if: always()
        env:
          VULNERABLE_CHANGES: ${{ steps.review.outputs.vulnerable-changes }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          mkdir -p reports
          printf '%s' "${VULNERABLE_CHANGES:-[]}" | head -c 1048576 > reports/dependency-review.json
          echo "dependency review outcome: $REVIEW_OUTCOME"
      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dependency-review
          path: reports/dependency-review.json
          retention-days: 30
      - name: Enforce severity threshold
        if: steps.review.outcome == 'failure'
        run: |
          echo "::error::dependency review found vulnerabilities at or above the configured severity"
          exit 1
