# Reusable organisation workflow: secret scanning with gitleaks (SARIF evidence).
name: secret-scan

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""
    secrets:
      GITLEAKS_LICENSE:
        description: Optional gitleaks organisation licence.
        required: false

permissions: {}

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Collect report
        if: always()
        run: |
          mkdir -p reports
          if [[ -f results.sarif ]]; then
            head -c 4194304 results.sarif > reports/gitleaks.sarif
          else
            printf '%s' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gitleaks"}},"results":[]}]}' > reports/gitleaks.sarif
          fi
      - name: Upload secret-scan evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: secret-scan
          path: reports/gitleaks.sarif
          retention-days: 30
      - name: Enforce
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks detected secrets; see reports/gitleaks.sarif"
          exit 1
