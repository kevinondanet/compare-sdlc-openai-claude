# Reusable organisation workflow: build, lint, type-check and unit-test with JUnit +
# coverage evidence (aisdlc test run-evidence). Rendered per project by `aisdlc ci render`;
# the double-brace placeholders are filled from project-config.yaml.
#
# Hardening: SHA-pinned actions, least-privilege permissions, harden-runner egress
# control, no untrusted expressions inside run: (values go through env:).
name: build-and-test

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04
      versions:
        description: JSON list of toolchain versions for the test matrix.
        type: string
        default: "{{ matrix_versions }}"
      change-dir:
        description: Change package directory (changes/CHG-...) to record evidence into.
        type: string
        default: ""
      diff-base:
        description: Git revision to diff against for diff coverage.
        type: string
        default: origin/main
      aisdlc-spec:
        description: pip requirement specifier for the platform CLI.
        type: string
        default: "{{ aisdlc_spec }}"
      egress-policy:
        description: harden-runner egress policy (audit | block).
        type: string
        default: audit
      allowed-endpoints:
        description: Space-separated host:port list allowed when egress-policy is block.
        type: string
        default: ""

permissions: {}

jobs:
  test:
    name: test (${{ matrix.version }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - "{{ setup_steps }}"
      - name: Install platform CLI
        env:
          AISDLC_SPEC: ${{ inputs.aisdlc-spec }}
        run: |
          [[ "$AISDLC_SPEC" =~ ^[A-Za-z0-9_.,;=<>!~@:/+\[\]-]+$ ]] || { echo "::error::invalid aisdlc-spec"; exit 1; }
          python -m pip install --disable-pip-version-check --quiet "$AISDLC_SPEC"
      - "{{ install_steps }}"
      - "{{ lint_step }}"
      - "{{ types_step }}"
      - "{{ build_step }}"
      - name: Fetch diff base
        env:
          DIFF_BASE: ${{ inputs.diff-base }}
        run: |
          if [[ "$DIFF_BASE" == */* ]]; then
            git fetch --no-tags --depth=200 "${DIFF_BASE%%/*}" "${DIFF_BASE#*/}" || echo "::warning::could not fetch $DIFF_BASE"
          fi
      - name: Unit tests with evidence
        env:
          UNIT_COMMAND: "{{ unit_command }}"
          DIFF_BASE: ${{ inputs.diff-base }}
          CHANGE_DIR: ${{ inputs.change-dir }}
        run: |
          mkdir -p reports
          args=(--command "$UNIT_COMMAND" --junit reports/junit.xml --coverage-xml reports/coverage.xml
                --diff-base "$DIFF_BASE" --environment ci --out reports/tests.json)
          if [[ -n "$CHANGE_DIR" ]]; then args+=(--package "$CHANGE_DIR"); fi
          aisdlc test run-evidence "${args[@]}"
      - "{{ integration_step }}"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-evidence-${{ matrix.version }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
