# Reusable organisation workflow: architecture / dependency-rule tests (portfolio layer
# "architecture"), e.g. import-linter or pytest -m architecture.
name: architecture-tests

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""

permissions: {}

jobs:
  architecture:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - "{{ setup_steps_fixed }}"
      - "{{ install_steps }}"
      - "{{ architecture_step }}"
      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: architecture-tests
          path: reports/
          retention-days: 14
          if-no-files-found: warn
