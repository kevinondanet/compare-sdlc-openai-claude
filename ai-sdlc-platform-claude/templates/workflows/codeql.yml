# Reusable organisation workflow: CodeQL static analysis (SAST) with SARIF evidence.
name: codeql

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      languages:
        description: JSON list of CodeQL language identifiers.
        type: string
        default: "{{ codeql_languages }}"
      build-mode:
        description: CodeQL build mode (none | autobuild | manual).
        type: string
        default: "{{ codeql_build_mode }}"
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: security-extended
      - name: Autobuild
        if: inputs.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
      - name: Analyze
        uses: github/codeql-action/analyze@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          category: /language:${{ matrix.language }}
          output: reports/sarif
          upload: always
      - name: Upload SARIF evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: reports/sarif/
          retention-days: 30
          if-no-files-found: warn
