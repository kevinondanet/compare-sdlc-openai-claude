# Reusable organisation workflow: cost-ledger extract and KPI/benchmark evidence upload
# (aisdlc cost report --export, aisdlc cost kpis).
name: cost-benchmark

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      change-id:
        description: Change id (CHG-...) to extract cost evidence for.
        type: string
        default: ""
      ledger-artifact:
        description: Name of an uploaded artifact holding the usage ledger (ledger.sqlite).
        type: string
        default: ""
      aisdlc-spec:
        type: string
        default: "{{ aisdlc_spec }}"
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""

permissions: {}

jobs:
  cost:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install platform CLI
        env:
          AISDLC_SPEC: ${{ inputs.aisdlc-spec }}
        run: |
          [[ "$AISDLC_SPEC" =~ ^[A-Za-z0-9_.,;=<>!~@:/+\[\]-]+$ ]] || { echo "::error::invalid aisdlc-spec"; exit 1; }
          python -m pip install --disable-pip-version-check --quiet "$AISDLC_SPEC"
      - name: Download ledger
        if: inputs.ledger-artifact != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.ledger-artifact }}
          path: ledger/
      - name: Export cost and KPI evidence
        env:
          CHANGE_ID: ${{ inputs.change-id }}
        run: |
          mkdir -p reports
          ledger_args=()
          if [[ -f ledger/ledger.sqlite ]]; then ledger_args=(--ledger ledger/ledger.sqlite); fi
          if [[ -n "$CHANGE_ID" ]]; then
            aisdlc cost report --change "$CHANGE_ID" --export --json "${ledger_args[@]}" | head -c 1048576 > reports/cost.json
          fi
          aisdlc cost kpis --json "${ledger_args[@]}" | head -c 1048576 > reports/kpis.json
      - name: Upload cost evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cost-benchmark
          path: reports/
          retention-days: 90
          if-no-files-found: warn
