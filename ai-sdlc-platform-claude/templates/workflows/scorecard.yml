# Reusable organisation workflow: OpenSSF Scorecard supply-chain posture (SARIF evidence).
name: scorecard

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      publish-results:
        description: Publish results to the OpenSSF API (public repositories only).
        type: boolean
        default: false
      egress-policy:
        type: string
        default: audit
      allowed-endpoints:
        type: string
        default: ""

permissions: {}

jobs:
  scorecard:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}
      - name: Upload Scorecard evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: scorecard.sarif
