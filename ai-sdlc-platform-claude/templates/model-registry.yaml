# AI-SDLC model registry (consumed by aisdlc.control_plane.registry.ModelRegistry).
#
# Prices are USD per 1,000,000 tokens: price_in_per_1m (uncached prompt), price_out_per_1m
# (completion), price_cached_per_1m (prompt tokens served from cache),
# price_cache_write_per_1m (prompt tokens written to cache; defaults to input price).
#
# Entries with `price_configurable: true` carry PLACEHOLDER prices that operators MUST
# review and set for their own contracts/deployments (self-hosted open-weights models in
# particular have no list price). Anthropic first-party rates below are list prices at
# the time of writing and should be verified against https://www.anthropic.com/pricing.
#
# `family` is the model lineage. G3 independent review requires a model from a *different*
# family than the implementer (routing tier `independent_review`).
#
# `default_tier` maps the model onto the routing tiers low / standard / high.
# `approved_use_cases` lists the agent roles (ARCHITECTURE.md §6) the model may serve;
# "*" approves every role.
version: 1
pricing_note: >-
  Anthropic prices are list prices per 1M tokens. OpenAI and open-weights prices are
  placeholders (price_configurable: true) - set them for your account/deployment.

models:
  # ---------------------------------------------------------------- Anthropic (family: claude)
  - provider: anthropic
    model: claude-fable-5
    version: "5"
    family: claude
    capabilities: [code, reasoning, tools, vision, long_context, agentic, security_review]
    context_limit: 1000000
    max_output_tokens: 128000
    tool_support: true
    price_in_per_1m: 10.00
    price_out_per_1m: 50.00
    price_cached_per_1m: 1.00
    price_cache_write_per_1m: 12.50
    approved_use_cases: [planner, plan_checker, implementer, reviewer, security, escalation]
    default_tier: high
    latency_class: slow
    typical_latency_ms: 12000
    notes: Most capable; reserve for critical/escalation work. Thinking always on.

