# Generated by `aisdlc governance policy generate` from the platform tier taxonomy.
# Do not hand-edit; change the project configuration and regenerate.
apiVersion: governance.toolkit/v1
name: aisdlc-security_tester
version: '1.0'
description: 'AI-SDLC tier policy for role ''security_tester''. Runs adversarial campaigns against allow-listed
  targets; writes reports. Workspace roots: [''<none>'']. Allowed egress: [''pypi.org'', ''files.pythonhosted.org'',
  ''registry.npmjs.org'', ''github.com'', ''api.github.com'', ''*.githubusercontent.com''].'
agents:
- security_tester
scope: agent
default_action: deny
rules:
- name: deny-tier-4
  description: Tier 4 (deploy, secrets, IAM, delete data, unlisted egress) needs a human approval outside
    the agent loop; agents are always denied.
  condition: action.tier >= 4
  action: deny
  priority: 100
- name: deny-unlisted-egress
  description: Network egress to a host that is not on the allow-list is denied.
  condition: action.type == 'network_egress' and action.egress_unlisted
  action: deny
  priority: 99
- name: deny-above-tier-2
  description: Role 'security_tester' may not act above tier 2.
  condition: action.tier > 2
  action: deny
  priority: 98
- name: deny-scope-admin
  description: Role 'security_tester' holds no 'admin' capability (read-only by default).
  condition: action.scope == 'admin'
  action: deny
  priority: 96
- name: approve-tier-3
  description: 'Tier 3 (shared state: push, PR, backlog) requires an explicit or rule-based approval;
    missing approver or timeout denies.'
  condition: action.tier >= 3 and action.type in ['read', 'search', 'explain', 'list', 'glob', 'grep',
    'inspect', 'write', 'create_file', 'run_tests', 'execute', 'run_campaign', 'network_egress', 'web_search']
  action: require_approval
  priority: 90
- name: approve-write-outside-workspace
  description: Writes outside the isolated worktree are treated as tier 3.
  condition: action.scope == 'write' and action.outside_workspace and action.type in ['read', 'search',
    'explain', 'list', 'glob', 'grep', 'inspect', 'write', 'create_file', 'run_tests', 'execute', 'run_campaign',
    'network_egress', 'web_search']
  action: require_approval
  priority: 89
- name: audit-listed-egress
  description: Egress to allow-listed hosts is policy-controlled (tier 2) and audited.
  condition: action.type == 'network_egress' and action.egress_host in ['pypi.org', 'files.pythonhosted.org',
    'registry.npmjs.org', 'github.com', 'api.github.com', '*.githubusercontent.com']
  action: log
  priority: 85
- name: audit-tier-2
  description: Tier 2 (tests, builds, local artifacts) is policy-controlled and audited.
  condition: action.tier >= 2 and action.type in ['read', 'search', 'explain', 'list', 'glob', 'grep',
    'inspect', 'write', 'create_file', 'run_tests', 'execute', 'run_campaign', 'network_egress', 'web_search']
  action: log
  priority: 80
- name: audit-tier-1
  description: Tier 1 (writes inside the isolated worktree) is automatic but audited.
  condition: action.tier >= 1 and action.type in ['read', 'search', 'explain', 'list', 'glob', 'grep',
    'inspect', 'write', 'create_file', 'run_tests', 'execute', 'run_campaign', 'network_egress', 'web_search']
  action: log
  priority: 70
- name: allow-tier-0
  description: Tier 0 (read, search, explain) is automatic.
  condition: action.tier < 1 and action.type in ['read', 'search', 'explain', 'list', 'glob', 'grep',
    'inspect', 'write', 'create_file', 'run_tests', 'execute', 'run_campaign', 'network_egress', 'web_search']
  action: allow
  priority: 60
