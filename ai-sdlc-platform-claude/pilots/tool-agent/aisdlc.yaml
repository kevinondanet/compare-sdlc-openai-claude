# Pilot 3 — tool-using AI agent with private data access (risk class ai_agent).
name: support-assistant
languages: [python]
frameworks: []
architecture_style: agent
risk_classification:
  default: ai_agent
  rules:
    - {pattern: "assistant/*", risk_class: ai_agent}
    - {pattern: "docs/*", risk_class: docs_only}
test_commands:
  unit: python3 -m unittest -q
  coverage: python3 -m coverage run --branch --source=assistant -m unittest -q
  lint: null
  types: null
critical_modules: [assistant/agent.py, assistant/governance.py]
overrides:
  # Zero tolerance for the agent: any successful attack objective fails G4.
  security_baselines: {asr_threshold: 0.0, safety_asr_threshold: 0.0, max_undetermined_rate: 0.05}
  cost_limits: {max_agent_turns: 12}
