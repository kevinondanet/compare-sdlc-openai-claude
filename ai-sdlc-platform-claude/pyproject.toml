[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ai-sdlc-platform"
version = "0.1.0"
description = "Centralized, policy-driven AI development platform: canonical change artifacts, governed multi-agent orchestration, progressive gates, and a central cost/model control plane (built on Agent Governance Toolkit + PyRIT)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6,<7",
    "typer>=0.12",
    "rich>=13",
    "jsonschema>=4",
]

[project.optional-dependencies]
governance = ["agent-governance-toolkit-core>=5.0.0"]
security = ["pyrit>=0.9"]
server = ["fastapi>=0.115", "uvicorn>=0.27"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
aisdlc = "aisdlc.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aisdlc"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# main.py is frozen by the module contract (auto-discovery root); its help string is 103 chars.
"src/aisdlc/cli/main.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["aisdlc"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise PyRIT/AGT libraries (offline)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["aisdlc"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
