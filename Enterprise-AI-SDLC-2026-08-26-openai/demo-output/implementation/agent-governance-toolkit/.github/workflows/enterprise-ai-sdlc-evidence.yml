          }
          pyrit_completeness_fields = {"status", "reasons", "terminal", "has_trials"}

          def require_rate(value: object, *, name: str) -> float | None:
              if value is None:
                  return None
              require_contract(
                  type(value) in {int, float} and 0 <= value <= 1,
                  f"{name} must be a finite unit rate or null",
              )
              result = float(value)
              require_contract(math.isfinite(result), f"{name} must be finite")
              return result

          def validate_pyrit_identity(value: object, *, name: str) -> dict[str, object]:
              identity = require_exact_fields(value, pyrit_identity_fields, name=name)
              require_nonempty_string(identity["class_name"], name=f"{name}.class_name")
              require_digest(identity["content_hash"], name=f"{name}.content_hash")
              require_digest(identity["eval_hash"], name=f"{name}.eval_hash")
              return identity

          def validate_pyrit_trial_identity(
              value: object,
              *,
              name: str,
          ) -> tuple[dict[str, object], tuple[str, str, str]]:
              identity = require_exact_fields(
                  value,
                  pyrit_trial_identity_fields,
                  name=name,
              )
              atomic_name = require_nonempty_string(
                  identity["atomic_attack_name"],
                  name=f"{name}.atomic_attack_name",
              )
              display_group = require_nonempty_string(
                  identity["display_group"],
                  name=f"{name}.display_group",
              )
              objective_sha256 = require_digest(
                  identity["objective_sha256"],
                  name=f"{name}.objective_sha256",
              )
              return identity, (atomic_name, display_group, objective_sha256)

          def validate_pyrit_cached_trial(
              value: object,
              *,
              name: str,
          ) -> tuple[dict[str, object], tuple[str, str, str, str], datetime]:
              trial = require_exact_fields(
                  value,
                  pyrit_cached_trial_fields,
                  name=name,
              )
              _identity, identity_key = validate_pyrit_trial_identity(
                  trial["identity"],
                  name=f"{name}.identity",
              )
              attack_result_id = require_nonempty_string(
                  trial["attack_result_id"],
                  name=f"{name}.attack_result_id",
              )
              require_nonempty_string(
                  trial["origin_scenario_result_id"],
                  name=f"{name}.origin_scenario_result_id",
              )
              observed_at = parse_canonical_timestamp(trial["observed_at"])
              require_contract(
                  observed_at is not None and trial["cached"] is True,
                  f"{name} must be a canonical planned cached trial",
              )
              assert observed_at is not None
              return trial, (*identity_key, attack_result_id), observed_at

          def validate_pyrit_observed_trial(
              value: object,
              *,
              name: str,
          ) -> tuple[dict[str, object], tuple[str, str, str, str], datetime]:
              trial = require_exact_fields(
                  value,
                  pyrit_observed_trial_fields,
                  name=name,
              )
              _identity, identity_key = validate_pyrit_trial_identity(
                  trial["identity"],
                  name=f"{name}.identity",
              )
              attack_result_id = require_nonempty_string(
                  trial["attack_result_id"],
                  name=f"{name}.attack_result_id",
              )
              origin = trial["origin_scenario_result_id"]
              require_contract(
                  origin is None
                  or (
                      isinstance(origin, str)
                      and bool(origin)
                      and origin == origin.strip()
                  ),
                  f"{name}.origin_scenario_result_id is invalid",
              )
              observed_at = parse_canonical_timestamp(trial["observed_at"])
              require_contract(
                  observed_at is not None
                  and type(trial["cached"]) is bool
                  and trial["outcome"]
                  in {"success", "failure", "error", "undetermined"},
                  f"{name} lifecycle or outcome is invalid",
              )
              require_integer(
                  trial["execution_time_ms"],
                  name=f"{name}.execution_time_ms",
              )
              assert observed_at is not None
              return trial, (*identity_key, attack_result_id), observed_at

          def validate_pyrit_metric(
              value: object,
              *,
              name: str,
          ) -> dict[str, object]:
              metric = require_exact_fields(value, pyrit_metric_fields, name=name)
              counts = {
                  field_name: require_integer(metric[field_name], name=f"{name}.{field_name}")
                  for field_name in (
                      "trials",
                      "determinate_trials",
                      "successes",
                      "failures",
                      "errors",
                      "undetermined",
                  )
              }
              require_contract(
                  counts["determinate_trials"]
                  == counts["successes"] + counts["failures"]
                  and counts["trials"]
                  == counts["determinate_trials"]
                  + counts["errors"]
                  + counts["undetermined"],
                  f"{name} counts are inconsistent",
              )
              latency = require_exact_fields(
                  metric["latency"], pyrit_latency_fields, name=f"{name}.latency"
              )
              samples = require_integer(latency["samples"], name=f"{name}.latency.samples")
              require_contract(
                  samples == counts["trials"],
                  f"{name} latency samples do not equal trials",
              )
              if samples == 0:
                  require_contract(
                      all(
                          latency[field_name] is None
                          for field_name in ("total_ms", "mean_ms", "p95_ms", "max_ms")
                      ),
                      f"{name} empty latency summary is malformed",
                  )
              else:
                  total_ms = require_integer(
                      latency["total_ms"], name=f"{name}.latency.total_ms"
                  )
                  mean_value = latency["mean_ms"]
                  require_contract(
                      type(mean_value) in {int, float}
                      and math.isfinite(float(mean_value))
                      and float(mean_value) >= 0,
                      f"{name}.latency.mean_ms must be a finite number",
                  )
                  p95 = require_integer(latency["p95_ms"], name=f"{name}.latency.p95_ms")
                  maximum = require_integer(
                      latency["max_ms"], name=f"{name}.latency.max_ms"
                  )
                  require_contract(
                      float(mean_value) <= maximum
                      and p95 <= maximum
                      and math.isclose(
                          float(mean_value) * samples,
                          total_ms,
                          rel_tol=1e-9,
                          abs_tol=1e-6,
                      ),
                      f"{name} latency aggregates are inconsistent",
                  )
              expected_rates = {
                  "attack_success_rate": (
                      counts["successes"] / counts["determinate_trials"]
                      if counts["determinate_trials"]
                      else None
                  ),
                  "error_rate": (
                      counts["errors"] / counts["trials"] if counts["trials"] else None
                  ),
                  "undetermined_rate": (
                      counts["undetermined"] / counts["trials"]
                      if counts["trials"]
                      else None
                  ),
              }
              for field_name, expected in expected_rates.items():
                  actual = require_rate(metric[field_name], name=f"{name}.{field_name}")
                  require_contract(
                      (actual is None and expected is None)
                      or (
                          actual is not None
                          and expected is not None
                          and math.isclose(actual, expected, rel_tol=1e-12, abs_tol=1e-12)
                      ),
                      f"{name}.{field_name} is inconsistent with counts",
                  )
              return metric

          def validate_pyrit_evidence(pyrit_value: object) -> tuple[dict[str, object], str]:
              pyrit = require_exact_fields(pyrit_value, pyrit_fields, name="PyRIT evidence")
              require_contract(
                  pyrit["schema"] == "pyrit.security-evidence/v1",
                  "PyRIT evidence schema is invalid",
              )
              generated_at = parse_canonical_timestamp(pyrit["generated_at"])
              require_contract(generated_at is not None, "PyRIT generated_at is invalid")
              subject_value = pyrit["subject"]
              subject = (
                  None
                  if subject_value is None
                  else require_exact_fields(
                      subject_value,
                      pyrit_subject_fields,
                      name="PyRIT subject",
                  )
              )
              if subject is not None:
                  require_nonempty_string(
                      subject["application"],
                      name="PyRIT subject.application",
                  )
                  require_nonempty_string(
                      subject["change"],
                      name="PyRIT subject.change",
                  )
                  require_contract(
                      isinstance(subject["commit_sha"], str)
                      and re.fullmatch(r"[0-9a-f]{7,64}", subject["commit_sha"])
                      is not None,
                      "PyRIT subject.commit_sha is invalid",
                  )
              run = require_exact_fields(pyrit["run"], pyrit_run_fields, name="PyRIT run")
              scenario_result_id = require_nonempty_string(
                  run["scenario_result_id"], name="PyRIT run.scenario_result_id"
              )
              require_contract(
                  run["state"] in {"CREATED", "IN_PROGRESS", "COMPLETED", "FAILED", "CANCELLED"},
                  "PyRIT run state is invalid",
              )
              created_at = parse_canonical_timestamp(run["created_at"])
              completed_value = run["completed_at"]
              completed_at = (
                  None
                  if completed_value is None
                  else parse_canonical_timestamp(completed_value)
              )
              terminal = run["state"] in {"COMPLETED", "FAILED", "CANCELLED"}
              require_contract(
                  created_at is not None
                  and (completed_value is None or completed_at is not None)
                  and terminal is (completed_at is not None)
                  and (completed_at is None or completed_at >= created_at),
                  "PyRIT run lifecycle is invalid",
              )
              require_integer(run["number_tries"], name="PyRIT run.number_tries")
              pyrit_version = require_nonempty_string(
                  run["pyrit_version"], name="PyRIT run.pyrit_version"
              )
              trial_plan_digest_value = run["trial_plan_digest"]
              trial_plan_digest = (
                  None
                  if trial_plan_digest_value is None
                  else require_digest(
                      trial_plan_digest_value,
                      name="PyRIT run.trial_plan_digest",
                  )
              )
              inventory_value = run["expected_trial_inventory"]
              expected_inventory: list[dict[str, object]] | None = None
              expected_inventory_keys: list[tuple[str, str, str]] = []
              if inventory_value is not None:
                  require_contract(
                      isinstance(inventory_value, list)
                      and len(inventory_value) <= 100_000,
                      "PyRIT expected trial inventory must be a bounded array",
                  )
                  assert isinstance(inventory_value, list)
                  expected_inventory = []
                  expected_groups_by_atomic: dict[str, set[str]] = {}
                  for index, identity_value in enumerate(inventory_value):
                      identity, identity_key = validate_pyrit_trial_identity(
                          identity_value,
                          name=f"PyRIT expected trial {index}",
                      )
                      expected_inventory.append(identity)
                      expected_inventory_keys.append(identity_key)
                      expected_groups_by_atomic.setdefault(identity_key[0], set()).add(
                          identity_key[1]
                      )
                  require_contract(
                      expected_inventory_keys == sorted(set(expected_inventory_keys))
                      and all(
                          len(groups) == 1
                          for groups in expected_groups_by_atomic.values()
                      ),
                      "PyRIT expected trial inventory is not canonical and unambiguous",
                  )
              require_contract(
                  (trial_plan_digest is None) is (expected_inventory is None),
                  "PyRIT trial plan digest and expected inventory must appear together",
              )

              cached_value = run["planned_cached_trials"]
              require_contract(
                  isinstance(cached_value, list) and len(cached_value) <= 100_000,
                  "PyRIT planned cached trials must be a bounded array",
              )
              assert isinstance(cached_value, list)
              planned_cached: list[dict[str, object]] = []
              planned_keys: list[tuple[str, str, str, str]] = []
              planned_times: list[datetime] = []
              for index, trial_value in enumerate(cached_value):
                  trial, trial_key, observed_at = validate_pyrit_cached_trial(
                      trial_value,
                      name=f"PyRIT planned cached trial {index}",
                  )
                  planned_cached.append(trial)
                  planned_keys.append(trial_key)
                  planned_times.append(observed_at)
              planned_ids = [key[-1] for key in planned_keys]
              require_contract(
                  planned_keys == sorted(planned_keys)
                  and len(planned_ids) == len(set(planned_ids))
                  and (
                      expected_inventory is not None
                      or not planned_cached
                  )
                  and all(
                      key[:3] in set(expected_inventory_keys)
                      for key in planned_keys
                  ),
                  "PyRIT planned cached trials do not match the canonical plan",
              )
              if trial_plan_digest is not None:
                  require_contract(
                      hashlib.sha256(
                          canonical_bytes(
                              {
                                  "schema": "pyrit.security-evidence/trial-plan/v1",
                                  "expected_trials": expected_inventory,
                                  "cached_trials": planned_cached,
                              }
                          )
                      ).hexdigest()
                      == trial_plan_digest,
                      "PyRIT trial plan digest does not match its inventory",
                  )

              observed_value = run["observed_trials"]
              require_contract(
                  isinstance(observed_value, list)
                  and len(observed_value) <= 100_000,
                  "PyRIT observed trials must be a bounded array",
              )
              assert isinstance(observed_value, list)
              observed_trials: list[dict[str, object]] = []
              observed_keys: list[tuple[str, str, str, str]] = []
              observed_times: list[datetime] = []
              for index, trial_value in enumerate(observed_value):
                  trial, trial_key, observed_at = validate_pyrit_observed_trial(
                      trial_value,
                      name=f"PyRIT observed trial {index}",
                  )
                  origin = trial["origin_scenario_result_id"]
                  require_contract(
                      trial["cached"]
                      is (
                          origin is not None
                          and origin != scenario_result_id
                      ),
                      "PyRIT observed trial cached flag does not match its origin",
                  )
                  observed_trials.append(trial)
                  observed_keys.append(trial_key)
                  observed_times.append(observed_at)
              observed_ids = [key[-1] for key in observed_keys]
              require_contract(
                  observed_keys == sorted(observed_keys)
                  and len(observed_ids) == len(set(observed_ids)),
                  "PyRIT observed trials are not canonical and unique",
              )
              planned_by_id = {
                  str(trial["attack_result_id"]): trial for trial in planned_cached
              }
              observed_by_id = {
                  str(trial["attack_result_id"]): trial for trial in observed_trials
              }
              require_contract(
                  all(
                      trial["origin_scenario_result_id"] != scenario_result_id
                      for trial in planned_cached
                  )
                  and all(
                      observed_by_id[attack_result_id]["identity"]
                      == planned_by_id[attack_result_id]["identity"]
                      and observed_by_id[attack_result_id][
                          "origin_scenario_result_id"
                      ]
                      == planned_by_id[attack_result_id][
                          "origin_scenario_result_id"
                      ]
                      and observed_by_id[attack_result_id]["observed_at"]
                      == planned_by_id[attack_result_id]["observed_at"]
                      and observed_by_id[attack_result_id]["cached"] is True
                      for attack_result_id in set(observed_by_id)
                      & set(planned_by_id)
                  ),
                  "PyRIT observed cached trials do not match their immutable plan",
              )
              current_run_trial_count = require_integer(
                  run["current_run_trial_count"],
                  name="PyRIT run.current_run_trial_count",
              )
              reused_trial_count = require_integer(
                  run["reused_trial_count"],
                  name="PyRIT run.reused_trial_count",
              )
              omitted_reused_trial_count = require_integer(
                  run["omitted_reused_trial_count"],
                  name="PyRIT run.omitted_reused_trial_count",
              )
              missing_provenance_trial_count = require_integer(
                  run["missing_provenance_trial_count"],
                  name="PyRIT run.missing_provenance_trial_count",
              )
              actual_current_count = sum(
                  trial["origin_scenario_result_id"] == scenario_result_id
                  for trial in observed_trials
              )
              actual_missing_count = sum(
                  trial["origin_scenario_result_id"] is None
                  for trial in observed_trials
              )
              reused_ids = {
                  str(trial["attack_result_id"])
                  for trial in observed_trials
                  if trial["cached"] is True
              } | set(planned_by_id)
              omitted_ids = set(planned_by_id) - set(observed_by_id)
              require_contract(
                  current_run_trial_count == actual_current_count
                  and missing_provenance_trial_count == actual_missing_count
                  and reused_trial_count == len(reused_ids)
                  and omitted_reused_trial_count == len(omitted_ids),
                  "PyRIT trial provenance counts do not match retained trials",
              )
              origins_value = run["origin_scenario_result_ids"]
              require_contract(
                  isinstance(origins_value, list)
                  and len(origins_value) <= 100_000
                  and all(
                      isinstance(origin, str)
                      and bool(origin)
                      and origin == origin.strip()
                      for origin in origins_value
                  )
                  and origins_value == sorted(set(origins_value)),
                  "PyRIT origin run ids must be canonical and unique",
              )
              assert isinstance(origins_value, list)
              actual_origins = {
                  str(trial["origin_scenario_result_id"])
                  for trial in observed_trials
                  if trial["origin_scenario_result_id"] is not None
              } | {
                  str(trial["origin_scenario_result_id"])
                  for trial in planned_cached
              }
              require_contract(
                  origins_value == sorted(actual_origins),
                  "PyRIT origin run ids do not match trial provenance",
              )
              oldest_value = run["oldest_trial_at"]
              oldest_trial_at = (
                  None
                  if oldest_value is None
                  else parse_canonical_timestamp(oldest_value)
              )
              require_contract(
                  oldest_value is None or oldest_trial_at is not None,
                  "PyRIT oldest_trial_at is invalid",
              )
              all_trial_times = observed_times + planned_times
              actual_oldest = min(all_trial_times) if all_trial_times else None
              require_contract(
                  oldest_trial_at == actual_oldest
                  and len(observed_trials)
                  == current_run_trial_count
                  + reused_trial_count
                  - omitted_reused_trial_count
                  + missing_provenance_trial_count
                  and (
                      bool(observed_trials or planned_cached)
                      or (oldest_trial_at is None and not origins_value)
                  )
                  and (
                      oldest_trial_at is None
                      or completed_at is None
                      or oldest_trial_at <= completed_at
                  )
                  and not (
                      reused_trial_count == 0
                      and missing_provenance_trial_count == 0
                      and oldest_trial_at is not None
                      and created_at is not None
                      and oldest_trial_at < created_at
                  ),
                  "PyRIT oldest-trial and provenance lifecycle is invalid",
              )
              current_inventory_keys: list[tuple[str, str, str]] = []
              for trial in observed_trials:
                  if trial["origin_scenario_result_id"] != scenario_result_id:
                      continue
                  identity = trial["identity"]
                  assert isinstance(identity, dict)
                  current_inventory_keys.append(
                      (
                          str(identity["atomic_attack_name"]),
                          str(identity["display_group"]),
                          str(identity["objective_sha256"]),
                      )
                  )
              current_inventory = Counter(current_inventory_keys)
              current_inventory_exact = (
                  expected_inventory is not None
                  and current_inventory == Counter(expected_inventory_keys)
              )
              require_contract(
                  generated_at == (oldest_trial_at or completed_at or created_at),
                  "PyRIT generated_at does not match the persisted run",
              )

              configuration = require_exact_fields(
                  pyrit["configuration"],
                  pyrit_configuration_fields,
                  name="PyRIT configuration",
              )
              require_contract(
                  configuration["pyrit_version"] == pyrit_version,
                  "PyRIT run and configuration versions differ",
              )
              scenario = validate_pyrit_identity(
                  configuration["scenario"], name="PyRIT configuration.scenario"
              )
              target = (
                  None
                  if configuration["target"] is None
                  else validate_pyrit_identity(
                      configuration["target"], name="PyRIT configuration.target"
                  )
              )
              scorer = (
                  None
                  if configuration["scorer"] is None
                  else validate_pyrit_identity(
                      configuration["scorer"], name="PyRIT configuration.scorer"
                  )
              )
              require_integer(
                  configuration["scenario_version"],
                  name="PyRIT configuration.scenario_version",
              )
              techniques = require_string_list(
                  configuration["techniques"], name="PyRIT configuration.techniques"
              )
              datasets = require_string_list(
                  configuration["datasets"], name="PyRIT configuration.datasets"
              )
              objective_hashes = require_string_list(
                  configuration["objective_hashes"],
                  name="PyRIT configuration.objective_hashes",
              )
              for objective_hash in objective_hashes:
                  require_digest(
                      objective_hash, name="PyRIT configuration.objective_hash"
                  )
              if expected_inventory is not None:
                  require_contract(
                      objective_hashes
                      == sorted({key[2] for key in expected_inventory_keys}),
                      "PyRIT objective hashes do not match the bound trial inventory",
                  )
              benchmark_fingerprint = require_digest(
                  configuration["benchmark_fingerprint"],
                  name="PyRIT configuration.benchmark_fingerprint",
              )
              fingerprint_payload = {
                  "schema": "pyrit.security-evidence/benchmark/v1",
                  "pyrit_version": pyrit_version,
                  "scenario": scenario,
                  "target": target,
                  "scorer": scorer,
                  "scenario_version": configuration["scenario_version"],
                  "techniques": techniques,
                  "datasets": datasets,
                  "objective_hashes": objective_hashes,
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(fingerprint_payload)).hexdigest()
                  == benchmark_fingerprint,
                  "PyRIT benchmark fingerprint does not match configuration facts",
              )

              metrics = require_exact_fields(
                  pyrit["metrics"], pyrit_metrics_fields, name="PyRIT metrics"
              )
              overall = validate_pyrit_metric(
                  metrics["overall"], name="PyRIT metrics.overall"
              )
              groups_value = metrics["groups"]
              require_contract(
                  isinstance(groups_value, list) and len(groups_value) <= 256,
                  "PyRIT metric groups must be a bounded array",
              )
              assert isinstance(groups_value, list)
              groups: list[dict[str, object]] = []
              group_names: list[str] = []
              atomic_names: list[str] = []
              for group_value in groups_value:
                  group = require_exact_fields(
                      group_value, pyrit_group_fields, name="PyRIT metric group"
                  )
                  group_name = require_nonempty_string(
                      group["name"], name="PyRIT metric group.name"
                  )
                  attacks = require_string_list(
                      group["atomic_attack_names"],
                      name="PyRIT metric group.atomic_attack_names",
                  )
                  group["metrics"] = validate_pyrit_metric(
                      group["metrics"], name=f"PyRIT metric group {group_name}"
                  )
                  groups.append(group)
                  group_names.append(group_name)
                  atomic_names.extend(attacks)
              require_contract(
                  group_names == sorted(set(group_names))
                  and len(atomic_names) == len(set(atomic_names)),
                  "PyRIT metric groups are not canonical and disjoint",
              )
              count_fields = (
                  "trials",
                  "determinate_trials",
                  "successes",
                  "failures",
                  "errors",
                  "undetermined",
              )
              for field_name in count_fields:
                  require_contract(
                      sum(int(group["metrics"][field_name]) for group in groups)
                      == overall[field_name],
                      f"PyRIT group {field_name} does not sum to overall metrics",
                  )
              require_contract(
                  (bool(groups) or overall["trials"] == 0)
                  and sum(
                      int(group["metrics"]["latency"]["samples"])
                      for group in groups
                  )
                  == overall["latency"]["samples"]
                  and sum(
                      int(group["metrics"]["latency"]["total_ms"] or 0)
                      for group in groups
                  )
                  == (overall["latency"]["total_ms"] or 0),
                  "PyRIT group latency does not sum to overall metrics",
              )

              observed_by_atomic = Counter(
                  str(
                      require_exact_fields(
                          trial["identity"],
                          pyrit_trial_identity_fields,
                          name="PyRIT observed identity",
                      )["atomic_attack_name"]
                  )
                  for trial in observed_trials
              )
              observed_display_groups: dict[str, set[str]] = {}
              for trial in observed_trials:
                  trial_identity = trial["identity"]
                  assert isinstance(trial_identity, dict)
                  observed_display_groups.setdefault(
                      str(trial_identity["atomic_attack_name"]),
                      set(),
                  ).add(str(trial_identity["display_group"]))
              exported_group_by_atomic = {
                  atomic_name: str(group["name"])
                  for group in groups
                  for atomic_name in group["atomic_attack_names"]
              }
              require_contract(
                  all(
                      len(display_groups) == 1
                      for display_groups in observed_display_groups.values()
                  )
                  and set(exported_group_by_atomic) == set(observed_by_atomic)
                  and all(
                      exported_group_by_atomic[atomic_name]
                      == next(iter(display_groups))
                      for atomic_name, display_groups in observed_display_groups.items()
                  ),
                  "PyRIT metric groups do not exactly partition observed trial identities",
              )

              def reconcile_observed_metric(
                  metric: dict[str, object],
                  trials: list[dict[str, object]],
                  *,
                  name: str,
              ) -> None:
                  outcomes = Counter(str(trial["outcome"]) for trial in trials)
                  expected_counts = {
                      "trials": len(trials),
                      "determinate_trials": outcomes["success"]
                      + outcomes["failure"],
                      "successes": outcomes["success"],
                      "failures": outcomes["failure"],
                      "errors": outcomes["error"],
                      "undetermined": outcomes["undetermined"],
                  }
                  require_contract(
                      all(metric[field_name] == expected for field_name, expected in expected_counts.items()),
                      f"{name} outcome counts do not match observed trials",
                  )
                  latencies = sorted(int(trial["execution_time_ms"]) for trial in trials)
                  expected_total = sum(latencies) if latencies else None
                  expected_mean = (
                      expected_total / len(latencies) if latencies else None
                  )
                  expected_p95 = (
                      latencies[max(0, math.ceil(0.95 * len(latencies)) - 1)]
                      if latencies
                      else None
                  )
                  expected_max = latencies[-1] if latencies else None
                  latency = metric["latency"]
                  assert isinstance(latency, dict)
                  mean_value = latency["mean_ms"]
                  require_contract(
                      latency["samples"] == len(latencies)
                      and latency["total_ms"] == expected_total
                      and latency["p95_ms"] == expected_p95
                      and latency["max_ms"] == expected_max
                      and (
                          (mean_value is None and expected_mean is None)
                          or (
                              mean_value is not None
                              and expected_mean is not None
                              and math.isclose(
                                  float(mean_value),
                                  expected_mean,
                                  rel_tol=1e-12,
                                  abs_tol=1e-12,
                              )
                          )
                      ),
                      f"{name} latency does not match observed trials",
                  )

              for group in groups:
                  attacks = group["atomic_attack_names"]
                  assert isinstance(attacks, list)
                  group_trials = [
                      trial
                      for trial in observed_trials
                      if isinstance(trial["identity"], dict)
                      and trial["identity"]["atomic_attack_name"] in attacks
                  ]
                  group_metric = group["metrics"]
                  assert isinstance(group_metric, dict)
                  reconcile_observed_metric(
                      group_metric,
                      group_trials,
                      name=f"PyRIT group {group['name']}",
                  )
              reconcile_observed_metric(
                  overall,
                  observed_trials,
                  name="PyRIT overall",
              )

              usage = require_exact_fields(
                  pyrit["usage"], pyrit_usage_fields, name="PyRIT usage"
              )
              require_contract(
                  usage["scope"] == "linked_conversations",
                  "PyRIT usage scope is invalid",
              )
              usage_counts = {
                  field_name: require_integer(
                      usage[field_name], name=f"PyRIT usage.{field_name}"
                  )
                  for field_name in (
                      "conversation_count",
                      "observed_response_count",
                      "calls_with_token_usage",
                      "calls_with_cost",
                  )
              }
              require_contract(
                  usage_counts["calls_with_token_usage"]
                  <= usage_counts["observed_response_count"]
                  and usage_counts["calls_with_cost"]
                  <= usage_counts["observed_response_count"],
                  "PyRIT usage coverage counts are invalid",
              )
              token_fields = (
                  "input_tokens",
                  "output_tokens",
                  "reasoning_tokens",
                  "cached_tokens",
                  "total_tokens",
              )
              for field_name in token_fields:
                  value = usage[field_name]
                  if value is not None:
                      require_integer(value, name=f"PyRIT usage.{field_name}")
              token_coverage = usage["token_coverage"]
              cost_coverage = usage["cost_coverage"]
              require_contract(
                  token_coverage in {"complete", "partial", "unavailable"}
                  and cost_coverage in {"complete", "partial", "unavailable"},
                  "PyRIT usage coverage enum is invalid",
              )
              if token_coverage == "unavailable":
                  require_contract(
                      usage_counts["calls_with_token_usage"] == 0
                      and all(usage[field_name] is None for field_name in token_fields),
                      "unavailable PyRIT token coverage reports token facts",
                  )
              else:
                  require_contract(
                      usage_counts["calls_with_token_usage"] > 0
                      and any(usage[field_name] is not None for field_name in token_fields),
                      "available PyRIT token coverage lacks token facts",
                  )
                  if token_coverage == "complete":
                      require_contract(
                          usage_counts["calls_with_token_usage"]
                          == usage_counts["observed_response_count"]
                          and all(
                              usage[field_name] is not None
                              for field_name in (
                                  "input_tokens",
                                  "output_tokens",
                                  "total_tokens",
                              )
                          ),
                          "complete PyRIT token coverage is incomplete",
                      )
                  else:
                      require_contract(
                          usage_counts["calls_with_token_usage"]
                          < usage_counts["observed_response_count"]
                          or any(
                              usage[field_name] is None
                              for field_name in (
                                  "input_tokens",
                                  "output_tokens",
                                  "total_tokens",
                              )
                          ),
                          "fully reported core token usage requires complete coverage",
                      )
              if all(
                  usage[field_name] is not None
                  for field_name in ("input_tokens", "output_tokens", "total_tokens")
              ):
                  require_contract(
                      usage["total_tokens"]
                      == usage["input_tokens"] + usage["output_tokens"],
                      "PyRIT total tokens do not match input plus output",
                  )
              cost_value = usage["cost"]
              if cost_coverage == "unavailable":
                  require_contract(
                      usage_counts["calls_with_cost"] == 0 and cost_value is None,
                      "unavailable PyRIT cost coverage reports cost facts",
                  )
              else:
                  cost = require_exact_fields(
                      cost_value, {"currency", "amount"}, name="PyRIT usage cost"
                  )
                  require_contract(cost["currency"] == "USD", "PyRIT cost currency is invalid")
                  require_decimal(cost["amount"], name="PyRIT usage cost.amount")
                  require_contract(
                      usage_counts["calls_with_cost"] > 0
                      and (
                          (
                              cost_coverage == "complete"
                              and usage_counts["calls_with_cost"]
                              == usage_counts["observed_response_count"]
                          )
                          or (
                              cost_coverage == "partial"
                              and usage_counts["calls_with_cost"]
                              < usage_counts["observed_response_count"]
                          )
                      ),
                      "available PyRIT cost coverage is incomplete",
                  )

              baseline_value = pyrit["baseline"]
              if baseline_value is not None:
                  baseline = require_exact_fields(
                      baseline_value, pyrit_baseline_fields, name="PyRIT baseline"
                  )
                  require_nonempty_string(
                      baseline["scenario_result_id"],
                      name="PyRIT baseline.scenario_result_id",
                  )
                  require_contract(
                      is_canonical_timestamp(baseline["generated_at"])
                      and baseline["state"]
                      in {"CREATED", "IN_PROGRESS", "COMPLETED", "FAILED", "CANCELLED"},
                      "PyRIT baseline identity or lifecycle is invalid",
                  )
                  require_digest(
                      baseline["benchmark_fingerprint"],
                      name="PyRIT baseline.benchmark_fingerprint",
                  )
                  require_contract(
                      type(baseline["compatible"]) is bool,
                      "PyRIT baseline compatible must be boolean",
                  )
                  reasons = require_string_list(
                      baseline["incompatibility_reasons"],
                      name="PyRIT baseline.incompatibility_reasons",
                      allowed={
                          "baseline.benchmark_fingerprint_mismatch",
                          "baseline.no_trials",
                          "baseline.pyrit_version_mismatch",
                          "baseline.run_not_completed",
                          "baseline.target_missing",
                      },
                  )
                  baseline_metric = validate_pyrit_metric(
                      baseline["metrics"], name="PyRIT baseline.metrics"
                  )
                  expected_reasons: set[str] = set()
                  if baseline["state"] != "COMPLETED":
                      expected_reasons.add("baseline.run_not_completed")
                  if int(baseline_metric["trials"]) == 0:
                      expected_reasons.add("baseline.no_trials")
                  if target is None:
                      expected_reasons.add("baseline.target_missing")
                  if baseline["pyrit_version"] != pyrit_version:
                      expected_reasons.add("baseline.pyrit_version_mismatch")
                  if baseline["benchmark_fingerprint"] != benchmark_fingerprint:
                      expected_reasons.add("baseline.benchmark_fingerprint_mismatch")
                  require_contract(
                      reasons == sorted(expected_reasons),
                      "PyRIT baseline diagnostics do not match persisted facts",
                  )
                  deltas = (
                      baseline["delta_attack_success_rate"],
                      baseline["delta_error_rate"],
                      baseline["delta_undetermined_rate"],
                  )
                  for index, delta in enumerate(deltas):
                      if delta is not None:
                          require_contract(
                              type(delta) in {int, float} and math.isfinite(float(delta)),
                              f"PyRIT baseline delta {index} must be finite",
                          )
                  derived_compatible = (
                      not expected_reasons
                  )
                  require_contract(
                      baseline["compatible"] is derived_compatible
                      and (
                          (baseline["compatible"] is True and not reasons)
                      or (
                          baseline["compatible"] is False
                          and bool(reasons)
                          and all(delta is None for delta in deltas)
                          )
                      ),
                      "PyRIT baseline compatibility shape is invalid",
                  )
                  if derived_compatible:
                      for field_name, delta in zip(
                          (
                              "attack_success_rate",
                              "error_rate",
                              "undetermined_rate",
                          ),
                          deltas,
                          strict=True,
                      ):
                          current_rate = overall[field_name]
                          baseline_rate = baseline_metric[field_name]
                          expected_delta = (
                              None
                              if current_rate is None or baseline_rate is None
                              else float(current_rate) - float(baseline_rate)
                          )
                          require_contract(
                              (delta is None and expected_delta is None)
                              or (
                                  delta is not None
                                  and expected_delta is not None
                                  and math.isclose(
                                      float(delta),
                                      expected_delta,
                                      rel_tol=1e-12,
                                      abs_tol=1e-12,
                                  )
                              ),
                              f"PyRIT baseline {field_name} delta is inconsistent",
                          )
                  baseline_digest = require_digest(
                      baseline["baseline_digest"], name="PyRIT baseline.baseline_digest"
                  )
                  baseline_digest_payload = {
                      "schema": "pyrit.security-evidence/baseline/v1",
                      "scenario_result_id": baseline["scenario_result_id"],
                      "generated_at": baseline["generated_at"],
                      "state": baseline["state"],
                      "pyrit_version": baseline["pyrit_version"],
                      "benchmark_fingerprint": baseline["benchmark_fingerprint"],
                      "metrics": baseline_metric,
                  }
                  require_contract(
                      hashlib.sha256(canonical_bytes(baseline_digest_payload)).hexdigest()
                      == baseline_digest,
                      "PyRIT baseline digest does not match baseline facts",
                  )

              completeness = require_exact_fields(
                  pyrit["completeness"],
                  pyrit_completeness_fields,
                  name="PyRIT completeness",
              )
              require_contract(
                  completeness["status"] in {"complete", "incomplete", "unavailable"}
                  and type(completeness["terminal"]) is bool
                  and type(completeness["has_trials"]) is bool,
                  "PyRIT completeness shape is invalid",
              )
              completeness_reasons = require_string_list(
                  completeness["reasons"], name="PyRIT completeness.reasons"
              )
              has_trials = int(overall["trials"]) > 0
              expected_reasons: set[str] = set()
              if run["state"] != "COMPLETED":
                  expected_reasons.add("run.not_completed")
              if not has_trials:
                  expected_reasons.add("run.no_trials")
              if target is None:
                  expected_reasons.add("configuration.target_missing")
              if subject is None:
                  expected_reasons.add("subject.unbound")
              if expected_inventory is None:
                  expected_reasons.add("run.trial_inventory_unbound")
              elif not current_inventory_exact:
                  expected_reasons.add("run.trial_inventory_mismatch")
              if reused_trial_count:
                  expected_reasons.add("run.reused_trials")
              if missing_provenance_trial_count:
                  expected_reasons.add("run.trial_provenance_missing")
              if token_coverage == "unavailable":
                  expected_reasons.add("usage.unavailable")
              elif token_coverage == "partial":
                  expected_reasons.add("usage.partial")
              if cost_coverage == "unavailable":
                  expected_reasons.add("cost.unavailable")
              elif cost_coverage == "partial":
                  expected_reasons.add("cost.partial")
              expected_completeness_status = (
                  "unavailable"
                  if not terminal
                  else "complete"
                  if (
                      run["state"] == "COMPLETED"
                      and has_trials
                      and target is not None
                      and subject is not None
                      and expected_inventory is not None
                      and current_inventory_exact
                      and reused_trial_count == 0
                      and missing_provenance_trial_count == 0
                  )
                  else "incomplete"
              )
              require_contract(
                  completeness["terminal"] is terminal
                  and completeness["has_trials"] is has_trials
                  and completeness_reasons == sorted(expected_reasons)
                  and completeness["status"] == expected_completeness_status,
                  "PyRIT completeness does not match exported facts",
              )
              require_contract(
                  subject is not None
                  and subject["change"] == change_id
                  and subject["commit_sha"] == source,
                  "PyRIT evidence is not bound to the canonical change and source",
              )
              evidence_digest = require_digest(
                  pyrit["evidence_digest"], name="PyRIT evidence_digest"
              )
              unsigned_pyrit = {
                  key: value for key, value in pyrit.items() if key != "evidence_digest"
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(unsigned_pyrit)).hexdigest()
                  == evidence_digest,
                  "PyRIT evidence digest does not match its canonical payload",
              )
              return pyrit, evidence_digest

          def validate_command_evidence(record: dict[str, object]) -> bool:
              if set(record) != command_evidence_fields:
                  return False
              evidence_id = record["evidence_id"]
              digest = record["evidence_sha256"]
              kind = record["kind"]
              status = record["status"]
              test_layers = record["test_layers"]
              exit_code = record["exit_code"]
              artifacts = record["artifacts"]
              if not (
                  record["schema_version"] == "agt.execution-evidence/v1"
                  and isinstance(evidence_id, str)
                  and re.fullmatch(r"EVD-[A-Za-z0-9][A-Za-z0-9._-]{0,95}", evidence_id)
                  and record["change_id"] == change_id
                  and record["change_digest"] == change_digest
                  and record["source_revision"] == source
                  and isinstance(kind, str)
                  and kind in evidence_kinds
                  and isinstance(status, str)
                  and status in evidence_statuses
                  and is_canonical_timestamp(record["generated_at"])
                  and is_canonical_nonempty_string(record["producer"])
                  and is_canonical_nonempty_string(record["environment"])
                  and is_canonical_nonempty_string(record["command"])
                  and (exit_code is None or type(exit_code) is int)
                  and is_canonical_identifier_list(record["requirement_ids"])
                  and is_canonical_identifier_list(record["scenario_ids"])
                  and is_canonical_identifier_list(record["task_ids"])
                  and isinstance(test_layers, list)
                  and all(
                      isinstance(layer, str) and layer in verification_layers
                      for layer in test_layers
                  )
                  and test_layers == sorted(set(test_layers))
                  and isinstance(record["metrics"], dict)
                  and isinstance(artifacts, dict)
                  and all(
                      isinstance(value, str) and value == value.strip()
                      for value in artifacts.values()
                  )
                  and isinstance(digest, str)
                  and re.fullmatch(r"[0-9a-f]{64}", digest)
              ):
                  return False
              if (kind == "test") != bool(test_layers):
                  return False
              if status == "passed" and exit_code != 0:
                  return False
              unsigned = {
                  key: value for key, value in record.items() if key != "evidence_sha256"
              }
              return hashlib.sha256(canonical_bytes(unsigned)).hexdigest() == digest

          gate_result_fields = {
              "schema_version",
              "gate_id",
              "status",
              "change_id",
              "source_revision",
              "change_digest",
              "policy_digest",
              "risk_class",
              "evaluated_at",
              "checks",
              "evidence",
              "result_digest",
          }
          gate_check_fields = {
              "code",
              "passed",
              "message",
              "actual",
              "threshold",
              "evidence_ids",
          }
          gate_reference_fields = {"evidence_id", "schema_version", "digest"}
          risk_classes = {
              "documentation",
              "simple",
              "standard",
              "high",
              "tool_enabled_agent",
          }
          common_evidence_check_codes = {
              "evidence.command_succeeded",
              "evidence.environment",
              "evidence.freshness",
              "evidence.integrity",
              "evidence.report_uri",
              "evidence.source_binding",
          }
          g2_evidence_kinds = {
              "architecture",
              "build",
              "complexity",
              "contract",
              "coverage",
              "drift",
              "duplication",
              "format",
              "lint",
              "mutation",
              "test",
              "typecheck",
          }
          release_verdict_fields = {
              "schema",
              "status",
              "policy_id",
              "policy_version",
              "policy_digest",
              "evidence_digest",
              "subject",
              "evaluated_at",
              "checks",
              "reason_codes",
              "verdict_digest",
          }
          release_check_fields = {"code", "passed", "actual", "expected"}
          release_policy_fields = {
              "schema",
              "policy_id",
              "policy_version",
              "subject",
              "requirements",
              "thresholds",
              "freshness",
              "baseline",
              "policy_digest",
          }
          release_requirement_fields = {
              "allowed_benchmark_fingerprints",
              "required_scenarios",
              "required_groups",
              "minimum_trials",
              "minimum_trials_per_group",
              "require_usage_complete",
              "require_cost_complete",
          }
          release_threshold_fields = {
              "max_attack_success_rate",
              "max_undetermined_rate",
              "max_error_rate",
              "max_cost_usd",
              "max_p95_latency_ms",
          }
          release_freshness_fields = {
              "max_age_seconds",
              "max_future_skew_seconds",
          }
          release_baseline_fields = {
              "required",
              "require_compatible",
              "allowed_evidence_digests",
              "max_age_seconds",
              "max_attack_success_rate_increase",
              "max_error_rate_increase",
              "max_undetermined_rate_increase",
          }

          def validate_gate_result(
              value: object,
              *,
              gate_id: str,
          ) -> dict[str, object]:
              result = require_exact_fields(
                  value,
                  gate_result_fields,
                  name=f"{gate_id} gate result",
              )
              expected_schema = (
                  "agt.development-gate-result/v1"
                  if gate_id in {"G0", "G1", "G2", "G3"}
                  else "agt.enterprise-gate-result/v1"
              )
              evaluated_at = parse_canonical_timestamp(result["evaluated_at"])
              require_contract(
                  result["schema_version"] == expected_schema
                  and result["gate_id"] == gate_id
                  and result["status"] in {"pass", "not_applicable"}
                  and result["change_id"] == change_id
                  and result["source_revision"] == source
                  and result["change_digest"] == change_digest
                  and result["risk_class"] in risk_classes
                  and evaluated_at is not None
                  and assembly_time - timedelta(days=1)
                  <= evaluated_at
                  <= assembly_time + timedelta(minutes=5),
                  f"{gate_id} gate result is stale, unsuccessful, or source-unbound",
              )
              require_digest(result["policy_digest"], name=f"{gate_id}.policy_digest")
              checks_value = result["checks"]
              require_contract(
                  isinstance(checks_value, list)
                  and 1 <= len(checks_value) <= 512,
                  f"{gate_id} checks must be a bounded non-empty array",
              )
              assert isinstance(checks_value, list)
              checks: list[dict[str, object]] = []
              for index, check_value in enumerate(checks_value):
                  check = require_exact_fields(
                      check_value,
                      gate_check_fields,
                      name=f"{gate_id} check {index}",
                  )
                  require_nonempty_string(check["code"], name=f"{gate_id} check.code")
                  require_nonempty_string(check["message"], name=f"{gate_id} check.message")
                  evidence_ids = require_string_list(
                      check["evidence_ids"],
                      name=f"{gate_id} check.evidence_ids",
                  )
                  require_contract(
                      check["passed"] is True,
                      f"{gate_id} contains a failed or non-boolean check",
                  )
                  check["evidence_ids"] = evidence_ids
                  checks.append(check)
              require_contract(
                  checks
                  == sorted(
                      checks,
                      key=lambda check: (
                          str(check["code"]),
                          ",".join(str(item) for item in check["evidence_ids"]),
                          str(check["message"]),
                      ),
                  ),
                  f"{gate_id} checks are not canonically sorted",
              )
              references_value = result["evidence"]
              require_contract(
                  isinstance(references_value, list) and len(references_value) <= 512,
                  f"{gate_id} evidence references must be a bounded array",
              )
              assert isinstance(references_value, list)
              references: list[dict[str, object]] = []
              for index, reference_value in enumerate(references_value):
                  reference = require_exact_fields(
                      reference_value,
                      gate_reference_fields,
                      name=f"{gate_id} evidence reference {index}",
                  )
                  require_nonempty_string(
                      reference["evidence_id"],
                      name=f"{gate_id} evidence reference.evidence_id",
                  )
                  require_nonempty_string(
                      reference["schema_version"],
                      name=f"{gate_id} evidence reference.schema_version",
                  )
                  require_digest(
                      reference["digest"],
                      name=f"{gate_id} evidence reference.digest",
                  )
                  references.append(reference)
              reference_keys = [
                  (str(item["schema_version"]), str(item["evidence_id"]))
                  for item in references
              ]
              require_contract(
                  reference_keys == sorted(set(reference_keys)),
                  f"{gate_id} evidence references are not canonical and unique",
              )
              result_digest = require_digest(
                  result["result_digest"], name=f"{gate_id}.result_digest"
              )
              unsigned = {
                  key: item for key, item in result.items() if key != "result_digest"
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(unsigned)).hexdigest() == result_digest,
                  f"{gate_id} result digest does not match its canonical payload",
              )
              return result

          def gate_checks(result: dict[str, object]) -> dict[str, list[dict[str, object]]]:
              grouped: dict[str, list[dict[str, object]]] = {}
              checks = result["checks"]
              assert isinstance(checks, list)
              for check in checks:
                  assert isinstance(check, dict)
                  grouped.setdefault(str(check["code"]), []).append(check)
              return grouped

          def require_gate_code_set(
              result: dict[str, object],
              *,
              required: set[str],
              allowed: set[str],
          ) -> dict[str, list[dict[str, object]]]:
              checks = gate_checks(result)
              codes = set(checks)
              require_contract(
                  required <= codes and codes <= allowed,
                  f"{result['gate_id']} is missing mandatory checks or contains unknown checks",
              )
              require_contract(
                  all(
                      len(values) == 1 or code in common_evidence_check_codes
                      for code, values in checks.items()
                  ),
                  f"{result['gate_id']} contains duplicate semantic checks",
              )
              return checks

          def require_exact_common_evidence_checks(
              result: dict[str, object],
              records: list[dict[str, object]],
          ) -> None:
              checks_value = result["checks"]
              assert isinstance(checks_value, list)
              records_by_id = {
                  str(record["evidence_id"]): record for record in records
              }
              actual: list[tuple[str, str]] = []
              for check in checks_value:
                  assert isinstance(check, dict)
                  code = str(check["code"])
                  if code not in common_evidence_check_codes:
                      continue
                  evidence_ids = check["evidence_ids"]
                  require_contract(
                      isinstance(evidence_ids, list) and len(evidence_ids) == 1,
                      f"{result['gate_id']} common evidence checks must bind one record",
                  )
                  evidence_id = str(evidence_ids[0])
                  if code == "evidence.integrity":
                      record = records_by_id.get(evidence_id)
                      require_contract(
                          record is not None
                          and check["actual"] == record["evidence_sha256"]
                          and check["threshold"] == record["evidence_sha256"],
                          f"{result['gate_id']} evidence integrity check is not exact",
                      )
                  actual.append((code, evidence_id))
              expected = [
                  (code, str(record["evidence_id"]))
                  for record in records
                  for code in common_evidence_check_codes
              ]
              require_contract(
                  sorted(actual) == sorted(expected),
                  f"{result['gate_id']} does not contain the exact per-record evidence checks",
              )

          def exact_command_references(
              result: dict[str, object],
              records: list[dict[str, object]],
              *,
              kinds: set[str],
          ) -> None:
              expected = {
                  (
                      str(record["evidence_id"]),
                      "agt.execution-evidence/v1",
                      str(record["evidence_sha256"]),
                  )
                  for record in records
                  if record["kind"] in kinds
              }
              references = result["evidence"]
              assert isinstance(references, list)
              actual = {
                  (
                      str(reference["evidence_id"]),
                      str(reference["schema_version"]),
                      str(reference["digest"]),
                  )
                  for reference in references
                  if isinstance(reference, dict)
                  and reference["schema_version"] == "agt.execution-evidence/v1"
              }
              require_contract(
                  actual == expected,
                  f"{result['gate_id']} command-evidence references do not exactly resolve",
              )

          def passing_records(
              records: list[dict[str, object]],
              *,
              kind: str,
              evaluated_at: datetime,
          ) -> list[dict[str, object]]:
              selected: list[dict[str, object]] = []
              for record in records:
                  if record["kind"] != kind:
                      continue
                  generated_at = parse_canonical_timestamp(record["generated_at"])
                  artifacts = record["artifacts"]
                  assert isinstance(artifacts, dict)
                  require_contract(
                      record["status"] == "passed"
                      and record["exit_code"] == 0
                      and record["environment"] == "ci"
                      and generated_at is not None
                      and evaluated_at - timedelta(days=1)
                      <= generated_at
                      <= evaluated_at + timedelta(minutes=5)
                      and is_canonical_nonempty_string(artifacts.get("report_uri"))
                      and isinstance(artifacts.get("report_sha256"), str)
                      and re.fullmatch(
                          r"[0-9a-f]{64}", str(artifacts.get("report_sha256"))
                      )
                      is not None,
                      f"{kind} evidence is incomplete, stale, or lacks a content-addressed report",
                  )
                  selected.append(record)
              return selected

          def newest_record(records: list[dict[str, object]]) -> dict[str, object]:
              require_contract(bool(records), "required command evidence is missing")
              return max(records, key=lambda record: str(record["generated_at"]))

          def metric_decimal(
              record: dict[str, object],
              field_name: str,
          ) -> Decimal:
              metrics = record["metrics"]
              assert isinstance(metrics, dict)
              value = require_decimal(metrics.get(field_name), name=f"metrics.{field_name}")
              require_contract(value >= 0, f"metrics.{field_name} must be non-negative")
              return value

          def metric_integer(
              record: dict[str, object],
              field_name: str,
          ) -> int:
              metrics = record["metrics"]
              assert isinstance(metrics, dict)
              return require_integer(metrics.get(field_name), name=f"metrics.{field_name}")

          def check_decimal_threshold(
              checks: dict[str, list[dict[str, object]]],
              code: str,
              actual: Decimal,
              *,
              minimum: bool,
          ) -> None:
              check = checks[code][0]
              threshold = require_decimal(check["threshold"], name=f"{code}.threshold")
              claimed = require_decimal(check["actual"], name=f"{code}.actual")
              require_contract(
                  claimed == actual
                  and (actual >= threshold if minimum else actual <= threshold),
                  f"{code} does not match referenced evidence or policy threshold",
              )

          def validate_quality_handoff(
              value: object,
              records: list[dict[str, object]],
          ) -> tuple[list[dict[str, object]], str, str, datetime]:
              handoff = require_exact_fields(
                  value,
                  {"schema", "results"},
                  name="quality gate handoff",
              )
              require_contract(
                  handoff["schema"] == "agt.ai-sdlc-quality-gates/v1",
                  "quality gate handoff schema is invalid",
              )
              results_value = handoff["results"]
              require_contract(
                  isinstance(results_value, list) and len(results_value) == 4,
                  "quality gate handoff must contain exactly G0 through G3",
              )
              assert isinstance(results_value, list)
              results = [
                  validate_gate_result(item, gate_id=f"G{index}")
                  for index, item in enumerate(results_value)
              ]
              risk_class = str(results[0]["risk_class"])
              policy_digest = str(results[0]["policy_digest"])
              evaluated_at = parse_canonical_timestamp(results[0]["evaluated_at"])
              assert evaluated_at is not None
              require_contract(
                  all(
                      result["risk_class"] == risk_class
                      and result["policy_digest"] == policy_digest
                      and result["evaluated_at"] == results[0]["evaluated_at"]
                      for result in results
                  ),
                  "G0-G3 risk, policy, and evaluation time must be coherent",
              )
              require_contract(
                  results[2]["status"] == "pass" and results[3]["status"] == "pass",
                  "G2 and G3 must be passing gate results",
              )
              require_contract(
                  results[0]["evidence"] == [] and results[1]["evidence"] == [],
                  "G0 and G1 must not claim command evidence",
              )
              g0_required = {
                  "intent.ambiguity_score",
                  "intent.non_goals_present",
                  "intent.success_signals_present",
              }
              g0_checks = gate_checks(results[0])
              require_contract(
                  set(g0_checks) == g0_required
                  and results[0]["status"] == "pass",
                  "G0 does not contain the exact mandatory passing intent checks",
              )
              g1_material = {
                  "architecture.accepted_decision_present",
                  "architecture.all_referenced_decisions_accepted",
                  "architecture.interfaces_declared",
                  "architecture.interfaces_specified",
                  "architecture.nfrs_present",
                  "architecture.plan_acyclic",
                  "security.agent_tool_manifest_present",
                  "security.privileged_tools_have_interfaces",
                  "security.privileged_tools_require_agent_risk",
                  "security.task_scope_risk_tier",
                  "security.threat_model_complete",
              }
              g1_expected = (
                  {"architecture.not_applicable"}
                  if risk_class == "documentation"
                  else g1_material
              )
              require_contract(
                  set(gate_checks(results[1])) == g1_expected
                  and results[1]["status"]
                  == ("not_applicable" if risk_class == "documentation" else "pass"),
                  "G1 does not contain the exact mandatory architecture checks",
              )
              required_kinds = (
                  {"drift", "lint", "test"}
                  if risk_class == "documentation"
                  else {"build", "contract", "coverage", "lint", "test"}
                  if risk_class == "simple"
                  else {
                      "architecture",
                      "build",
                      "complexity",
                      "contract",
                      "coverage",
                      "drift",
                      "duplication",
                      "format",
                      "lint",
                      "test",
                      "typecheck",
                      *( {"mutation"} if risk_class in {"high", "tool_enabled_agent"} else set() ),
                  }
              )
              g2_required = {
                  *(f"quality.{kind}_evidence" for kind in required_kinds),
                  "quality.test_portfolio",
                  "quality.tests_executed",
                  "traceability.requirement_test_coverage",
                  "traceability.scenario_test_coverage",
                  "traceability.task_test_coverage",
                  *(
                      {
                          "quality.branch_coverage",
                          "quality.critical_module_coverage",
                          "quality.diff_coverage",
                          "quality.line_coverage",
                      }
                      if "coverage" in required_kinds
                      else set()
                  ),
                  *(
                      {
                          "quality.no_production_placeholders",
                          "quality.no_unresolved_spec_ambiguity",
                      }
                      if "drift" in required_kinds
                      else set()
                  ),
                  *( {"quality.cyclomatic_complexity"} if "complexity" in required_kinds else set() ),
                  *( {"quality.duplication_ratio"} if "duplication" in required_kinds else set() ),
                  *( {"quality.architecture_boundaries"} if "architecture" in required_kinds else set() ),
                  *( {"quality.api_schema_compatibility"} if "contract" in required_kinds else set() ),
                  *( {"quality.mutation_score"} if "mutation" in required_kinds else set() ),
              }
              g2_allowed = {
                  *g2_required,
                  *common_evidence_check_codes,
              }
              g2_checks = require_gate_code_set(
                  results[2], required=g2_required, allowed=g2_allowed
              )
              exact_command_references(results[2], records, kinds=g2_evidence_kinds)
              g2_selected = [
                  record for record in records if record["kind"] in g2_evidence_kinds
              ]
              require_exact_common_evidence_checks(results[2], g2_selected)
              by_kind = {
                  kind: passing_records(records, kind=kind, evaluated_at=evaluated_at)
                  for kind in g2_evidence_kinds
              }
              for kind in required_kinds:
                  require_contract(
                      bool(by_kind[kind])
                      and g2_checks[f"quality.{kind}_evidence"][0]["actual"]
                      == len(by_kind[kind])
                      and g2_checks[f"quality.{kind}_evidence"][0]["threshold"] == 1,
                      f"G2 requires passing {kind} evidence with an exact count",
                  )
              if "coverage" in required_kinds:
                  coverage = newest_record(by_kind["coverage"])
                  for metric in (
                      "line_coverage",
                      "diff_coverage",
                      "branch_coverage",
                      "critical_module_coverage",
                  ):
                      check_decimal_threshold(
                          g2_checks,
                          f"quality.{metric}",
                          metric_decimal(coverage, metric),
                          minimum=True,
                      )
              if "mutation" in required_kinds:
                  check_decimal_threshold(
                      g2_checks,
                      "quality.mutation_score",
                      metric_decimal(newest_record(by_kind["mutation"]), "mutation_score"),
                      minimum=True,
                  )
              if "complexity" in required_kinds:
                  complexity = newest_record(by_kind["complexity"])
                  actual = metric_integer(complexity, "max_cyclomatic_complexity")
                  check = g2_checks["quality.cyclomatic_complexity"][0]
                  require_contract(
                      check["actual"] == actual
                      and actual
                      <= require_integer(
                          check["threshold"],
                          name="quality.cyclomatic_complexity.threshold",
                      ),
                      "cyclomatic complexity evidence exceeds policy",
                  )
              if "duplication" in required_kinds:
                  check_decimal_threshold(
                      g2_checks,
                      "quality.duplication_ratio",
                      metric_decimal(newest_record(by_kind["duplication"]), "duplication_ratio"),
                      minimum=False,
                  )
              if "architecture" in required_kinds:
                  violations = metric_integer(
                      newest_record(by_kind["architecture"]), "boundary_violations"
                  )
                  require_contract(
                      violations == 0
                      and g2_checks["quality.architecture_boundaries"][0]["actual"]
                      == violations,
                      "architecture evidence reports boundary violations",
                  )
              if "contract" in required_kinds:
                  contract = newest_record(by_kind["contract"])
                  breaking = metric_integer(contract, "unapproved_breaking_changes")
                  check = g2_checks["quality.api_schema_compatibility"][0]
                  require_contract(
                      breaking == 0 and check["actual"] == breaking,
                      "contract evidence reports unapproved breaking changes",
                  )
              if "drift" in required_kinds:
                  drift = newest_record(by_kind["drift"])
                  require_contract(
                      metric_integer(drift, "production_placeholders") == 0
                      and metric_integer(drift, "unresolved_ambiguities") == 0
                      and g2_checks["quality.no_production_placeholders"][0][
                          "actual"
                      ]
                      == 0
                      and g2_checks["quality.no_unresolved_spec_ambiguity"][0][
                          "actual"
                      ]
                      == 0,
                      "drift evidence reports placeholders or unresolved ambiguity",
                  )
              tests = by_kind["test"]
              require_contract(bool(tests), "G2 requires passing test evidence")
              passed = sum(metric_integer(record, "passed") for record in tests)
              failed = sum(metric_integer(record, "failed") for record in tests)
              require_contract(
                  passed > 0
                  and failed == 0
                  and all(record["metrics"].get("incomplete") is False for record in tests),
                  "test evidence is empty, failed, or incomplete",
              )
              tests_check = g2_checks["quality.tests_executed"][0]
              require_contract(
                  tests_check["actual"]
                  == {"passed": passed, "failed": failed, "incomplete": False},
                  "G2 executed-test claim does not match raw test evidence",
              )
              observed_layers = sorted(
                  {
                      str(layer)
                      for record in tests
                      for layer in record["test_layers"]
                  }
              )
              minimum_layers = (
                  {"documentation"}
                  if risk_class == "documentation"
                  else {"integration", "property", "unit"}
                  | (
                      {"architecture", "end_to_end"}
                      if risk_class in {"standard", "high", "tool_enabled_agent"}
                      else set()
                  )
                  | (
                      {"performance", "security"}
                      if risk_class in {"high", "tool_enabled_agent"}
                      else set()
                  )
                  | ({"agent_safety"} if risk_class == "tool_enabled_agent" else set())
              )
              require_contract(
                  minimum_layers <= set(observed_layers),
                  "test evidence does not cover the risk-selected portfolio",
              )
              portfolio_check = g2_checks["quality.test_portfolio"][0]
              require_contract(
                  portfolio_check["actual"] == observed_layers
                  and isinstance(portfolio_check["threshold"], list)
                  and set(portfolio_check["threshold"]) <= set(observed_layers),
                  "G2 test portfolio claim does not match raw test evidence",
              )
              for code, field_name in (
                  ("traceability.requirement_test_coverage", "requirement_ids"),
                  ("traceability.scenario_test_coverage", "scenario_ids"),
                  ("traceability.task_test_coverage", "task_ids"),
              ):
                  observed = sorted(
                      {
                          str(identifier)
                          for record in tests
                          for identifier in record[field_name]
                      }
                  )
                  check = g2_checks[code][0]
                  require_contract(
                      check["actual"] == observed
                      and isinstance(check["threshold"], list)
                      and set(check["threshold"]) <= set(observed),
                      f"{code} does not match raw test traceability",
                  )
              g3_required = {
                  *common_evidence_check_codes,
                  "review.bounded_fix_loop",
                  "review.independent_review_present",
                  "review.no_blocking_findings",
                  "review.provider_diversity",
                  "review.role_independence",
                  "review.whole_change_reviewed",
              }
              g3_checks = require_gate_code_set(
                  results[3], required=g3_required, allowed=g3_required
              )
              exact_command_references(results[3], records, kinds={"review"})
              reviews = passing_records(records, kind="review", evaluated_at=evaluated_at)
              require_exact_common_evidence_checks(results[3], reviews)
              review = newest_record(reviews)
              review_metrics = review["metrics"]
              assert isinstance(review_metrics, dict)
              blockers = metric_integer(review, "blocking_findings")
              rounds = metric_integer(review, "review_rounds")
              reviewer_family = review_metrics.get("reviewer_model_family")
              require_contract(
                  review_metrics.get("independent") is True
                  and review_metrics.get("whole_change") is True
                  and blockers == 0
                  and 1 <= rounds <= 3
                  and is_canonical_nonempty_string(reviewer_family),
                  "review evidence is not independent, whole-change, resolved, and bounded",
              )
              require_contract(
                  g3_checks["review.independent_review_present"][0]["actual"]
                  == len(reviews),
                  "G3 independent-review count does not match raw review evidence",
              )
              for code, actual in (
                  ("review.role_independence", True),
                  ("review.whole_change_reviewed", True),
                  ("review.no_blocking_findings", blockers),
                  ("review.bounded_fix_loop", rounds),
                  ("review.provider_diversity", reviewer_family),
              ):
                  require_contract(
                      g3_checks[code][0]["actual"] == actual,
                      f"{code} does not match raw review evidence",
                  )
              return results, risk_class, policy_digest, evaluated_at

          def validate_release_policy(
              value: object,
              *,
              pyrit: dict[str, object],
          ) -> dict[str, object]:
              policy = require_exact_fields(
                  value,
                  release_policy_fields,
                  name="PyRIT release policy",
              )
              require_contract(
                  policy["schema"] == "agt.release-policy/v1",
                  "PyRIT release policy schema is invalid",
              )
              for field_name in ("policy_id", "policy_version"):
                  require_nonempty_string(
                      policy[field_name], name=f"PyRIT policy.{field_name}"
                  )
              subject = require_exact_fields(
                  policy["subject"],
                  {"application", "change", "commit_sha"},
                  name="PyRIT policy.subject",
              )
              require_contract(
                  subject == pyrit["subject"]
                  and subject["change"] == change_id
                  and subject["commit_sha"] == source,
                  "PyRIT release policy subject is not evidence/source bound",
              )
              requirements = require_exact_fields(
                  policy["requirements"],
                  release_requirement_fields,
                  name="PyRIT policy.requirements",
              )
              allowed_benchmarks = require_string_list(
                  requirements["allowed_benchmark_fingerprints"],
                  name="PyRIT policy allowed benchmarks",
                  nonempty=True,
              )
              require_contract(
                  all(re.fullmatch(r"[0-9a-f]{64}", item) for item in allowed_benchmarks),
                  "PyRIT policy benchmark allowlist contains an invalid digest",
              )
              required_scenarios = require_string_list(
                  requirements["required_scenarios"],
                  name="PyRIT policy required scenarios",
              )
              required_groups = require_string_list(
                  requirements["required_groups"],
                  name="PyRIT policy required groups",
              )
              minimum_trials = require_integer(
                  requirements["minimum_trials"],
                  name="PyRIT policy minimum trials",
                  minimum=1,
              )
              minimum_group_trials = require_integer(
                  requirements["minimum_trials_per_group"],
                  name="PyRIT policy minimum group trials",
                  minimum=1,
              )
              require_contract(
                  type(requirements["require_usage_complete"]) is bool
                  and type(requirements["require_cost_complete"]) is bool,
                  "PyRIT policy accounting requirements must be booleans",
              )
              thresholds = require_exact_fields(
                  policy["thresholds"],
                  release_threshold_fields,
                  name="PyRIT policy.thresholds",
              )
              for field_name in (
                  "max_attack_success_rate",
                  "max_undetermined_rate",
                  "max_error_rate",
              ):
                  rate = require_decimal(
                      thresholds[field_name], name=f"PyRIT policy {field_name}"
                  )
                  require_contract(rate <= 1, f"PyRIT policy {field_name} exceeds one")
              require_decimal(
                  thresholds["max_cost_usd"], name="PyRIT policy max cost"
              )
              latency_limit = thresholds["max_p95_latency_ms"]
              require_contract(
                  type(latency_limit) in {int, float}
                  and math.isfinite(float(latency_limit))
                  and float(latency_limit) >= 0,
                  "PyRIT policy maximum latency must be finite and non-negative",
              )
              freshness = require_exact_fields(
                  policy["freshness"],
                  release_freshness_fields,
                  name="PyRIT policy.freshness",
              )
              require_integer(
                  freshness["max_age_seconds"], name="PyRIT policy maximum age"
              )
              require_integer(
                  freshness["max_future_skew_seconds"],
                  name="PyRIT policy maximum future skew",
              )
              baseline_policy = require_exact_fields(
                  policy["baseline"],
                  release_baseline_fields,
                  name="PyRIT policy.baseline",
              )
              require_contract(
                  type(baseline_policy["required"]) is bool
                  and type(baseline_policy["require_compatible"]) is bool,
                  "PyRIT baseline requirements must be booleans",
              )
              allowed_baselines = require_string_list(
                  baseline_policy["allowed_evidence_digests"],
                  name="PyRIT policy allowed baselines",
              )
              require_contract(
                  all(re.fullmatch(r"[0-9a-f]{64}", item) for item in allowed_baselines)
                  and (not baseline_policy["required"] or bool(allowed_baselines)),
                  "PyRIT required baseline policy lacks a valid pinned digest",
              )
              require_integer(
                  baseline_policy["max_age_seconds"],
                  name="PyRIT policy baseline maximum age",
              )
              for field_name in (
                  "max_attack_success_rate_increase",
                  "max_error_rate_increase",
                  "max_undetermined_rate_increase",
              ):
                  rate = require_decimal(
                      baseline_policy[field_name],
                      name=f"PyRIT policy baseline {field_name}",
                  )
                  require_contract(
                      rate <= 1, f"PyRIT policy baseline {field_name} exceeds one"
                  )
              policy_digest = require_digest(
                  policy["policy_digest"], name="PyRIT policy.policy_digest"
              )
              unsigned = {
                  key: item for key, item in policy.items() if key != "policy_digest"
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(unsigned)).hexdigest() == policy_digest,
                  "PyRIT release policy digest does not match its canonical payload",
              )

              configuration = pyrit["configuration"]
              metrics = pyrit["metrics"]
              assert isinstance(configuration, dict)
              assert isinstance(metrics, dict)
              groups_value = metrics["groups"]
              assert isinstance(groups_value, list)
              groups = {
                  str(group["name"]): group
                  for group in groups_value
                  if isinstance(group, dict)
              }
              observed_scenarios = {
                  str(name)
                  for group in groups.values()
                  for name in group["atomic_attack_names"]
              }
              overall = metrics["overall"]
              assert isinstance(overall, dict)
              require_contract(
                  configuration["benchmark_fingerprint"] in allowed_benchmarks
                  and set(required_scenarios) <= observed_scenarios
                  and set(required_groups) <= set(groups)
                  and int(overall["trials"]) >= minimum_trials
                  and all(
                      int(groups[name]["metrics"]["trials"])
                      >= minimum_group_trials
                      for name in required_groups
                  ),
                  "raw PyRIT evidence does not satisfy policy coverage requirements",
              )
              return policy

          def validate_release_verdict(
              value: object,
              *,
              pyrit: dict[str, object],
              policy: dict[str, object],
              g4: dict[str, object],
          ) -> dict[str, object]:
              verdict = require_exact_fields(
                  value,
                  release_verdict_fields,
                  name="PyRIT release verdict",
              )
              require_contract(
                  verdict["schema"] == "agt.release-verdict/v1"
                  and verdict["status"] == "pass"
                  and verdict["policy_id"] == policy["policy_id"]
                  and verdict["policy_version"] == policy["policy_version"]
                  and verdict["policy_digest"] == policy["policy_digest"]
                  and verdict["evidence_digest"] == pyrit["evidence_digest"]
                  and verdict["evaluated_at"] == g4["evaluated_at"]
                  and verdict["reason_codes"] == [],
                  "PyRIT release verdict is failed or not evidence/time bound",
              )
              for field_name in ("policy_id", "policy_version"):
                  require_nonempty_string(
                      verdict[field_name], name=f"PyRIT verdict.{field_name}"
                  )
              require_digest(verdict["policy_digest"], name="PyRIT verdict.policy_digest")
              subject = require_exact_fields(
                  verdict["subject"],
                  {"application", "change", "commit_sha"},
                  name="PyRIT verdict.subject",
              )
              require_contract(
                  subject == pyrit["subject"] == policy["subject"]
                  and subject["change"] == change_id
                  and subject["commit_sha"] == source,
                  "PyRIT verdict subject does not match its evidence",
              )
              checks_value = verdict["checks"]
              require_contract(
                  isinstance(checks_value, list) and bool(checks_value),
                  "PyRIT verdict checks must be non-empty",
              )
              assert isinstance(checks_value, list)
              checks: dict[str, dict[str, object]] = {}
              for index, check_value in enumerate(checks_value):
                  check = require_exact_fields(
                      check_value,
                      release_check_fields,
                      name=f"PyRIT verdict check {index}",
                  )
                  code = require_nonempty_string(
                      check["code"], name="PyRIT verdict check.code"
                  )
                  require_contract(
                      check["passed"] is True and code not in checks,
                      "PyRIT verdict contains failed or duplicate checks",
                  )
                  checks[code] = check
              require_contract(
                  list(checks) == sorted(checks),
                  "PyRIT verdict checks are not canonically sorted",
              )
              required_codes = {
                  "binding.application_mismatch",
                  "binding.change_mismatch",
                  "binding.commit_mismatch",
                  "binding.subject_missing",
                  "configuration.benchmark_not_allowed",
                  "configuration.target_missing",
                  "evidence.from_future",
                  "evidence.incomplete",
                  "evidence.no_trials",
                  "evidence.not_terminal",
                  "evidence.stale",
                  "requirements.group_missing",
                  "requirements.group_trials_insufficient",
                  "requirements.scenario_missing",
                  "requirements.trials_insufficient",
                  "run.not_completed",
                  "threshold.attack_success_rate_exceeded",
                  "threshold.error_rate_exceeded",
                  "threshold.p95_latency_exceeded",
                  "threshold.undetermined_rate_exceeded",
                  "cost.exceeded",
              }
              requirements = policy["requirements"]
              thresholds = policy["thresholds"]
              freshness = policy["freshness"]
              baseline_policy = policy["baseline"]
              assert isinstance(requirements, dict)
              assert isinstance(thresholds, dict)
              assert isinstance(freshness, dict)
              assert isinstance(baseline_policy, dict)
              if requirements["require_usage_complete"]:
                  required_codes.add("usage.incomplete")
              if requirements["require_cost_complete"]:
                  required_codes.add("cost.incomplete")
              baseline = pyrit["baseline"]
              if baseline is not None:
                  required_codes.update(
                      {
                          "baseline.from_future",
                          "baseline.not_allowed",
                          "baseline.stale",
                      }
                  )
                  if baseline_policy["require_compatible"]:
                      required_codes.add("baseline.incompatible")
                  assert isinstance(baseline, dict)
                  if baseline["compatible"]:
                      required_codes.update(
                          {
                              "baseline.attack_success_regression",
                              "baseline.error_regression",
                              "baseline.undetermined_regression",
                          }
                      )
              require_contract(
                  required_codes == set(checks),
                  "PyRIT verdict does not contain the exact release-policy check set",
              )
              metrics = pyrit["metrics"]
              run = pyrit["run"]
              completeness = pyrit["completeness"]
              configuration = pyrit["configuration"]
              usage = pyrit["usage"]
              assert isinstance(metrics, dict)
              assert isinstance(run, dict)
              assert isinstance(completeness, dict)
              assert isinstance(configuration, dict)
              assert isinstance(usage, dict)
              overall = metrics["overall"]
              assert isinstance(overall, dict)
              evaluated_at = parse_canonical_timestamp(g4["evaluated_at"])
              evidence_time = parse_canonical_timestamp(pyrit["generated_at"])
              assert evaluated_at is not None
              assert evidence_time is not None
              maximum_age = require_integer(
                  freshness["max_age_seconds"], name="PyRIT policy maximum age"
              )
              future_skew = require_integer(
                  freshness["max_future_skew_seconds"],
                  name="PyRIT policy maximum future skew",
              )
              require_contract(
                  run["state"] == "COMPLETED"
                  and completeness["terminal"] is True
                  and completeness["has_trials"] is True
                  and completeness["status"] == "complete"
                  and configuration["target"] is not None
                  and evaluated_at - timedelta(seconds=maximum_age)
                  <= evidence_time
                  <= evaluated_at + timedelta(seconds=future_skew),
                  "raw PyRIT lifecycle, completeness, target, or freshness fails policy",
              )

              def numeric_decimal(value: object, *, name: str) -> Decimal:
                  require_contract(
                      type(value) in {int, float, str},
                      f"{name} must be numeric",
                  )
                  try:
                      result = Decimal(str(value))
                  except (InvalidOperation, ValueError) as exc:
                      raise ValueError(f"{name} must be numeric") from exc
                  require_contract(
                      result.is_finite() and result >= 0,
                      f"{name} must be finite and non-negative",
                  )
                  return result

              threshold_bindings = (
                  (
                      "threshold.attack_success_rate_exceeded",
                      "attack_success_rate",
                      "max_attack_success_rate",
                  ),
                  (
                      "threshold.error_rate_exceeded",
                      "error_rate",
                      "max_error_rate",
                  ),
                  (
                      "threshold.undetermined_rate_exceeded",
                      "undetermined_rate",
                      "max_undetermined_rate",
                  ),
                  (
                      "threshold.p95_latency_exceeded",
                      "p95_ms",
                      "max_p95_latency_ms",
                  ),
              )
              for code, field_name, policy_field in threshold_bindings:
                  raw_actual = (
                      overall["latency"]["p95_ms"]
                      if field_name == "p95_ms"
                      else overall[field_name]
                  )
                  check = checks[code]
                  require_contract(
                      raw_actual is not None
                      and check["actual"] is not None
                      and check["expected"] is not None,
                      f"{code} cannot be independently evaluated",
                  )
                  actual = require_decimal(check["actual"], name=f"{code}.actual")
                  raw_value = numeric_decimal(
                      raw_actual, name=f"PyRIT {field_name}"
                  )
                  policy_limit = numeric_decimal(
                      thresholds[policy_field], name=f"PyRIT policy {policy_field}"
                  )
                  expected_text = str(check["expected"])
                  require_contract(
                      expected_text.startswith("<=")
                      and actual == raw_value
                      and numeric_decimal(
                          expected_text[2:], name=f"{code}.expected"
                      )
                      == policy_limit
                      and raw_value <= policy_limit,
                      f"{code} contradicts raw PyRIT metrics or release policy",
                  )

              cost = require_exact_fields(
                  usage["cost"], {"currency", "amount"}, name="PyRIT release cost"
              )
              raw_cost = require_decimal(cost["amount"], name="PyRIT release cost.amount")
              cost_limit = require_decimal(
                  thresholds["max_cost_usd"], name="PyRIT policy max cost"
              )
              cost_check = checks["cost.exceeded"]
              require_contract(
                  cost["currency"] == "USD"
                  and usage["cost_coverage"] == "complete"
                  and raw_cost <= cost_limit
                  and require_decimal(
                      cost_check["actual"], name="cost.exceeded.actual"
                  )
                  == raw_cost
                  and str(cost_check["expected"]).endswith(" USD")
                  and require_decimal(
                      str(cost_check["expected"])[2:-4],
                      name="cost.exceeded.expected",
                  )
                  == cost_limit,
                  "PyRIT cost verdict contradicts raw usage or policy",
              )
              if requirements["require_usage_complete"]:
                  require_contract(
                      usage["token_coverage"] == "complete"
                      and all(
                          usage[field_name] is not None
                          for field_name in (
                              "input_tokens",
                              "output_tokens",
                              "total_tokens",
                          )
                      ),
                      "PyRIT policy requires complete accountable token usage",
                  )
              if requirements["require_cost_complete"]:
                  require_contract(
                      usage["cost_coverage"] == "complete",
                      "PyRIT policy requires complete cost coverage",
                  )

              if baseline is None:
                  require_contract(
                      baseline_policy["required"] is False,
                      "PyRIT release policy requires a baseline",
                  )
              else:
                  assert isinstance(baseline, dict)
                  baseline_time = parse_canonical_timestamp(baseline["generated_at"])
                  assert baseline_time is not None
                  allowed_baselines = baseline_policy["allowed_evidence_digests"]
                  assert isinstance(allowed_baselines, list)
                  baseline_age = require_integer(
                      baseline_policy["max_age_seconds"],
                      name="PyRIT baseline maximum age",
                  )
                  require_contract(
                      baseline["baseline_digest"] in allowed_baselines
                      and evaluated_at - timedelta(seconds=baseline_age)
                      <= baseline_time
                      <= evaluated_at + timedelta(seconds=future_skew)
                      and (
                          not baseline_policy["require_compatible"]
                          or baseline["compatible"] is True
                      ),
                      "PyRIT baseline is unpinned, stale, future, or incompatible",
                  )
                  if baseline["compatible"]:
                      for field_name, policy_field in (
                          (
                              "delta_attack_success_rate",
                              "max_attack_success_rate_increase",
                          ),
                          (
                              "delta_error_rate",
                              "max_error_rate_increase",
                          ),
                          (
                              "delta_undetermined_rate",
                              "max_undetermined_rate_increase",
                          ),
                      ):
                          require_contract(
                              baseline[field_name] is not None
                              and numeric_decimal(
                                  baseline[field_name], name=f"PyRIT {field_name}"
                              )
                              <= require_decimal(
                                  baseline_policy[policy_field],
                                  name=f"PyRIT policy {policy_field}",
                              ),
                              "PyRIT baseline regression exceeds release policy",
                          )
              verdict_digest = require_digest(
                  verdict["verdict_digest"], name="PyRIT verdict.verdict_digest"
              )
              unsigned = {
                  key: item for key, item in verdict.items() if key != "verdict_digest"
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(unsigned)).hexdigest() == verdict_digest,
                  "PyRIT verdict digest does not match its canonical payload",
              )
              return verdict

          def validate_rampart_report(
              record: dict[str, object],
          ) -> dict[str, object]:
              metrics = require_exact_fields(
                  record["metrics"], {"rampart_report"}, name="RAMPART evidence metrics"
              )
              report = require_exact_fields(
                  metrics["rampart_report"],
                  {
                      "schema_version",
                      "native_schema_version",
                      "report_id",
                      "subject",
                      "run_id",
                      "started_at",
                      "generated_at",
                      "rampart_version",
                      "producer",
                      "environment",
                      "command",
                      "run_attestation",
                      "campaign",
                      "campaign_digest",
                      "native_report",
                      "native_report_digest",
                      "usage",
                      "report_digest",
                  },
                  name="RAMPART safety report",
              )
              require_contract(
                  report["schema_version"] == "agt.rampart-safety-report/v1"
                  and report["native_schema_version"] == "rampart.test-run-report/v1"
                  and report["generated_at"] == record["generated_at"]
                  and report["producer"] == record["producer"]
                  and report["environment"] == record["environment"]
                  and report["command"] == record["command"],
                  "RAMPART report lifecycle or command binding is invalid",
              )
              started_at = parse_canonical_timestamp(report["started_at"])
              finished_at = parse_canonical_timestamp(report["generated_at"])
              require_contract(
                  started_at is not None
                  and finished_at is not None
                  and started_at <= finished_at,
                  "RAMPART report timestamps are invalid",
              )
              for field_name in ("report_id", "run_id", "rampart_version"):
                  require_nonempty_string(
                      report[field_name], name=f"RAMPART {field_name}"
                  )
              subject = require_exact_fields(
                  report["subject"],
                  {
                      "application",
                      "repository",
                      "change_id",
                      "source_revision",
                      "change_digest",
                  },
                  name="RAMPART report.subject",
              )
              for field_name in ("application", "repository", "change_id", "source_revision"):
                  require_nonempty_string(
                      subject[field_name], name=f"RAMPART subject.{field_name}"
                  )
              require_digest(
                  subject["change_digest"], name="RAMPART subject.change_digest"
              )
              require_contract(
                  subject["change_id"] == change_id
                  and subject["source_revision"] == source
                  and subject["change_digest"] == change_digest
                  and subject["repository"] == os.environ["SOURCE_REPOSITORY"],
                  "RAMPART report is not bound to the trusted source",
              )

              run_attestation = require_exact_fields(
                  report["run_attestation"],
                  {
                      "schema_version",
                      "attestation_id",
                      "report_id",
                      "subject",
                      "run_id",
                      "started_at",
                      "generated_at",
                      "attested_at",
                      "expires_at",
                      "rampart_version",
                      "producer",
                      "environment",
                      "command",
                      "campaign_digest",
                      "native_report_digest",
                      "usage_digest",
                      "issuer_id",
                      "issuer_public_key",
                      "attestation_signature",
                      "attestation_digest",
                  },
                  name="RAMPART run attestation",
              )
              require_contract(
                  run_attestation["schema_version"]
                  == "agt.rampart-run-attestation/v1",
                  "RAMPART run attestation schema is invalid",
              )
              for field_name in (
                  "attestation_id",
                  "report_id",
                  "run_id",
                  "rampart_version",
                  "producer",
                  "environment",
                  "command",
                  "issuer_id",
              ):
                  require_nonempty_string(
                      run_attestation[field_name],
                      name=f"RAMPART attestation.{field_name}",
                  )
              for field_name in (
                  "campaign_digest",
                  "native_report_digest",
                  "usage_digest",
                  "issuer_public_key",
                  "attestation_digest",
              ):
                  require_digest(
                      run_attestation[field_name],
                      name=f"RAMPART attestation.{field_name}",
                  )
              require_contract(
                  isinstance(run_attestation["attestation_signature"], str)
                  and re.fullmatch(
                      r"[0-9a-f]{128}",
                      str(run_attestation["attestation_signature"]),
                  )
                  is not None,
                  "RAMPART run attestation signature has an invalid encoding",
              )
              attestation_times: dict[str, datetime] = {}
              for field_name in (
                  "started_at",
                  "generated_at",
                  "attested_at",
                  "expires_at",
              ):
                  parsed_time = parse_canonical_timestamp(
                      run_attestation[field_name]
                  )
                  require_contract(
                      parsed_time is not None,
                      f"RAMPART attestation.{field_name} is not canonical UTC",
                  )
                  assert parsed_time is not None
                  attestation_times[field_name] = parsed_time
              require_contract(
                  attestation_times["started_at"]
                  <= attestation_times["generated_at"]
                  <= attestation_times["attested_at"]
                  < attestation_times["expires_at"],
                  "RAMPART run attestation timestamps are invalid",
              )
              require_contract(
                  run_attestation["report_id"] == report["report_id"]
                  and run_attestation["subject"] == subject
                  and run_attestation["run_id"] == report["run_id"]
                  and run_attestation["started_at"] == report["started_at"]
                  and run_attestation["generated_at"] == report["generated_at"]
                  and run_attestation["rampart_version"]
                  == report["rampart_version"]
                  and run_attestation["producer"] == report["producer"]
                  and run_attestation["environment"] == report["environment"]
                  and run_attestation["command"] == report["command"]
                  and run_attestation["campaign_digest"]
                  == report["campaign_digest"]
                  and run_attestation["native_report_digest"]
                  == report["native_report_digest"],
                  "RAMPART wrapper does not match its signed run attestation",
              )
              attestation_digest = str(run_attestation["attestation_digest"])
              require_contract(
                  hashlib.sha256(
                      canonical_bytes(
                          {
                              key: item
                              for key, item in run_attestation.items()
                              if key != "attestation_digest"
                          }
                      )
                  ).hexdigest()
                  == attestation_digest,
                  "RAMPART run attestation digest is invalid",
              )
              attestation_signature_payload = {
                  key: item
                  for key, item in run_attestation.items()
                  if key not in {"attestation_signature", "attestation_digest"}
              }
              for field_name, parsed_time in attestation_times.items():
                  attestation_signature_payload[field_name] = parsed_time.isoformat()
              require_contract(
                  verify_ed25519(
                      public_key=str(run_attestation["issuer_public_key"]),
                      signature=str(run_attestation["attestation_signature"]),
                      payload=canonical_bytes(attestation_signature_payload),
                  ),
                  "RAMPART run attestation signature is invalid",
              )

              campaign = require_exact_fields(
                  report["campaign"],
                  {
                      "schema_version",
                      "campaign_id",
                      "campaign_version",
                      "rampart_version",
                      "cases",
                      "campaign_digest",
                  },
                  name="RAMPART campaign",
              )
              require_contract(
                  campaign["schema_version"] == "agt.rampart-campaign/v1"
                  and campaign["rampart_version"] == report["rampart_version"],
                  "RAMPART campaign schema or version is invalid",
              )
              for field_name in ("campaign_id", "campaign_version", "rampart_version"):
                  require_nonempty_string(
                      campaign[field_name], name=f"RAMPART campaign.{field_name}"
                  )
              cases_value = campaign["cases"]
              require_contract(
                  isinstance(cases_value, list)
                  and 1 <= len(cases_value) <= 10000,
                  "RAMPART campaign cases must be bounded and non-empty",
              )
              assert isinstance(cases_value, list)
              cases: list[dict[str, object]] = []
              execution_keys: list[tuple[str, int]] = []
              definition_digests: dict[str, str] = {}
              observability_rank = {
                  "response_only": 0,
                  "tool_only": 1,
                  "tool_and_side_effects": 2,
              }
              for case_value in cases_value:
                  case = require_exact_fields(
                      case_value,
                      {
                          "scenario_id",
                          "pytest_nodeid",
                          "rampart_result_index",
                          "definition_artifacts",
                          "harm_category",
                          "strategy",
                          "required_observability_level",
                      },
                      name="RAMPART campaign case",
                  )
                  for field_name in (
                      "scenario_id",
                      "pytest_nodeid",
                      "harm_category",
                      "strategy",
                  ):
                      require_nonempty_string(
                          case[field_name], name=f"RAMPART campaign case.{field_name}"
                      )
                  result_index = require_integer(
                      case["rampart_result_index"],
                      name="RAMPART campaign result index",
                  )
                  require_contract(
                      case["required_observability_level"] in observability_rank,
                      "RAMPART campaign observability requirement is invalid",
                  )
                  artifacts_value = case["definition_artifacts"]
                  require_contract(
                      isinstance(artifacts_value, list)
                      and 1 <= len(artifacts_value) <= 256,
                      "RAMPART definition artifacts must be bounded and non-empty",
                  )
                  assert isinstance(artifacts_value, list)
                  paths: list[str] = []
                  for artifact_value in artifacts_value:
                      artifact = require_exact_fields(
                          artifact_value,
                          {"path", "sha256"},
                          name="RAMPART definition artifact",
                      )
                      relative_path = canonical_relative_path(
                          artifact["path"], name="RAMPART definition artifact path"
                      )
                      artifact_digest = require_digest(
                          artifact["sha256"],
                          name="RAMPART definition artifact digest",
                      )
                      require_contract(
                          relative_path not in definition_digests
                          or definition_digests[relative_path] == artifact_digest,
                          "RAMPART definition path has conflicting pinned digests",
                      )
                      definition_digests[relative_path] = artifact_digest
                      paths.append(relative_path)
                  require_contract(
                      paths == sorted(set(paths)),
                      "RAMPART definition artifacts must be sorted and unique",
                  )
                  source_path = str(case["pytest_nodeid"]).split("::", 1)[0]
                  canonical_relative_path(
                      source_path, name="RAMPART pytest node source path"
                  )
                  require_contract(
                      source_path in paths,
                      "RAMPART case does not pin its pytest source",
                  )
                  execution_keys.append((str(case["pytest_nodeid"]), result_index))
                  cases.append(case)
              scenario_ids = [str(case["scenario_id"]) for case in cases]
              require_contract(
                  scenario_ids == sorted(set(scenario_ids))
                  and len(execution_keys) == len(set(execution_keys)),
                  "RAMPART campaign cases or execution identities are not canonical",
              )
              campaign_digest = require_digest(
                  campaign["campaign_digest"], name="RAMPART campaign digest"
              )
              require_contract(
                  hashlib.sha256(
                      canonical_bytes(
                          {
                              key: item
                              for key, item in campaign.items()
                              if key != "campaign_digest"
                          }
                      )
                  ).hexdigest()
                  == campaign_digest
                  and report["campaign_digest"] == campaign_digest,
                  "RAMPART campaign digest is invalid",
              )
              for relative_path, expected_digest in sorted(definition_digests.items()):
                  try:
                      definition_path = (workspace / relative_path).resolve(strict=True)
                  except OSError as exc:
                      raise ValueError(
                          f"RAMPART definition artifact is missing: {relative_path}"
                      ) from exc
                  require_contract(
                      definition_path.is_relative_to(workspace)
                      and definition_path.is_file()
                      and definition_path.stat().st_size <= 8 * 1024 * 1024
                      and hashlib.sha256(definition_path.read_bytes()).hexdigest()
                      == expected_digest,
                      f"RAMPART definition artifact digest mismatch: {relative_path}",
                  )

              def json_number(
                  value: object,
                  *,
                  name: str,
                  maximum: float | None = None,
              ) -> float:
                  require_contract(
                      not isinstance(value, bool)
                      and isinstance(value, (int, float))
                      and math.isfinite(float(value))
                      and float(value) >= 0
                      and (maximum is None or float(value) <= maximum),
                      f"{name} must be a bounded finite JSON number",
                  )
                  return float(value)

              native = require_exact_fields(
                  report["native_report"],
                  {
                      "total_runs",
                      "passed",
                      "failed",
                      "undetermined",
                      "errors",
                      "duration_seconds",
                      "metadata",
                      "population_summary",
                      "by_harm_category",
                  },
                  name="native RAMPART report",
              )
              for field_name in (
                  "total_runs",
                  "passed",
                  "failed",
                  "undetermined",
                  "errors",
              ):
                  require_integer(
                      native[field_name], name=f"native RAMPART {field_name}"
                  )
              json_number(native["duration_seconds"], name="native RAMPART duration")
              native_metadata = native["metadata"]
              require_contract(
                  isinstance(native_metadata, dict),
                  "native RAMPART metadata must be an object",
              )
              assert isinstance(native_metadata, dict)
              incomplete = native_metadata.get("incomplete", False)
              incomplete_reasons = native_metadata.get("incomplete_reasons", [])
              require_contract(
                  type(incomplete) is bool
                  and isinstance(incomplete_reasons, list)
                  and all(
                      isinstance(reason, str) and bool(reason.strip())
                      for reason in incomplete_reasons
                  )
                  and incomplete is bool(incomplete_reasons),
                  "native RAMPART incomplete metadata is invalid",
              )
              by_harm_category = native["by_harm_category"]
              require_contract(
                  isinstance(by_harm_category, dict)
                  and 1 <= len(by_harm_category) <= 256
                  and list(by_harm_category) == sorted(by_harm_category),
                  "native RAMPART harm categories must be canonical and non-empty",
              )
              assert isinstance(by_harm_category, dict)
              observed: dict[tuple[str, int], tuple[str, dict[str, object]]] = {}
              statuses: list[str] = []
              observability_gaps = 0
              for category, results_value in by_harm_category.items():
                  require_nonempty_string(
                      category, name="native RAMPART harm category"
                  )
                  require_contract(
                      isinstance(results_value, list) and bool(results_value),
                      "native RAMPART harm-category buckets must not be empty",
                  )
                  assert isinstance(results_value, list)
                  for result_value in results_value:
                      result = require_exact_fields(
                          result_value,
                          {
                              "safe",
                              "status",
                              "summary",
                              "harm_category",
                              "strategy",
                              "observability_level",
                              "duration_seconds",
                              "metadata",
                              "turns",
                          },
                          name="native RAMPART result",
                      )
                      require_contract(
                          type(result["safe"]) is bool
                          and result["status"]
                          in {"safe", "unsafe", "error", "undetermined"}
                          and result["safe"] is (result["status"] == "safe")
                          and (
                              result["harm_category"] is None
                              or is_canonical_nonempty_string(
                                  result["harm_category"]
                              )
                          )
                          and (result["harm_category"] or "uncategorized")
                          == category
                          and isinstance(result["summary"], str)
                          and isinstance(result["strategy"], str)
                          and result["observability_level"] in observability_rank,
                          "native RAMPART result status or category is invalid",
                      )
                      json_number(
                          result["duration_seconds"],
                          name="native RAMPART result duration",
                      )
                      metadata = result["metadata"]
                      require_contract(
                          isinstance(metadata, dict),
                          "native RAMPART result metadata must be an object",
                      )
                      assert isinstance(metadata, dict)
                      nodeid = metadata.get("_pytest_nodeid")
                      result_index = metadata.get("_rampart_result_index")
                      require_contract(
                          isinstance(nodeid, str)
                          and bool(nodeid.strip())
                          and type(result_index) is int
                          and result_index >= 0,
                          "native RAMPART result lacks its execution identity",
                      )
                      key = (nodeid, result_index)
                      require_contract(
                          key not in observed,
                          "native RAMPART results contain a duplicate execution identity",
                      )
                      turns_value = result["turns"]
                      require_contract(
                          isinstance(turns_value, list),
                          "native RAMPART result turns must be an array",
                      )
                      assert isinstance(turns_value, list)
                      turn_numbers: list[int] = []
                      for turn_value in turns_value:
                          turn = require_exact_fields(
                              turn_value,
                              {
                                  "turn_number",
                                  "prompt",
                                  "response_text",
                                  "response_metadata",
                                  "tool_calls",
                                  "side_effects",
                                  "eval_outcome",
                                  "eval_confidence",
                                  "eval_rationale",
                                  "eval_undetermined_operands",
                                  "driver_reasoning",
                              },
                              name="native RAMPART turn",
                          )
                          turn_numbers.append(
                              require_integer(
                                  turn["turn_number"],
                                  name="native RAMPART turn number",
                              )
                          )
                          require_contract(
                              isinstance(turn["prompt"], str)
                              and isinstance(turn["response_text"], str)
                              and isinstance(turn["response_metadata"], dict)
                              and isinstance(turn["tool_calls"], list)
                              and isinstance(turn["side_effects"], list)
                              and (
                                  turn["eval_outcome"] is None
                                  or turn["eval_outcome"]
                                  in {"detected", "not_detected", "undetermined"}
                              )
                              and (
                                  turn["eval_rationale"] is None
                                  or isinstance(turn["eval_rationale"], str)
                              )
                              and (
                                  turn["driver_reasoning"] is None
                                  or isinstance(turn["driver_reasoning"], str)
                              ),
                              "native RAMPART turn fields are invalid",
                          )
                          if turn["eval_confidence"] is not None:
                              json_number(
                                  turn["eval_confidence"],
                                  name="native RAMPART evaluator confidence",
                                  maximum=1,
                              )
                          operands = turn["eval_undetermined_operands"]
                          require_contract(
                              isinstance(operands, list)
                              and all(isinstance(item, str) for item in operands),
                              "native RAMPART undetermined operands are invalid",
                          )
                          assert isinstance(operands, list)
                          observability_gaps += len(operands)
                          for tool_call_value in turn["tool_calls"]:
                              tool_call = require_exact_fields(
                                  tool_call_value,
                                  {"name", "arguments", "result"},
                                  name="native RAMPART tool call",
                              )
                              require_contract(
                                  is_canonical_nonempty_string(tool_call["name"])
                                  and isinstance(tool_call["arguments"], dict),
                                  "native RAMPART tool call is invalid",
                              )
                          for side_effect_value in turn["side_effects"]:
                              side_effect = require_exact_fields(
                                  side_effect_value,
                                  {"kind", "details"},
                                  name="native RAMPART side effect",
                              )
                              require_contract(
                                  is_canonical_nonempty_string(side_effect["kind"])
                                  and isinstance(side_effect["details"], dict),
                                  "native RAMPART side effect is invalid",
                              )
                      require_contract(
                          turn_numbers == sorted(set(turn_numbers)),
                          "native RAMPART turn numbers must be unique and increasing",
                      )
                      observed[key] = (category, result)
                      statuses.append(str(result["status"]))

              expected = {
                  (str(case["pytest_nodeid"]), int(case["rampart_result_index"])): case
                  for case in cases
              }
              dimensions = sorted(
                  {str(case["harm_category"]) for case in cases}
              )
              require_contract(
                  set(observed) == set(expected)
                  and set(by_harm_category) == set(dimensions),
                  "native RAMPART executions do not exactly match the campaign",
              )
              for key, case in expected.items():
                  category, result = observed[key]
                  require_contract(
                      category == case["harm_category"]
                      and result["strategy"] == case["strategy"]
                      and observability_rank[str(result["observability_level"])]
                      >= observability_rank[
                          str(case["required_observability_level"])
                      ]
                      and (
                          result["status"] not in {"safe", "unsafe"}
                          or bool(result["turns"])
                      ),
                      "native RAMPART result violates its campaign case",
                  )

              safe_count = statuses.count("safe")
              unsafe_count = statuses.count("unsafe")
              undetermined_count = statuses.count("undetermined")
              error_count = statuses.count("error")
              total_runs = len(statuses)
              require_contract(
                  (
                      native["total_runs"],
                      native["passed"],
                      native["failed"],
                      native["undetermined"],
                      native["errors"],
                  )
                  == (
                      total_runs,
                      safe_count,
                      unsafe_count,
                      undetermined_count,
                      error_count,
                  ),
                  "native RAMPART counts do not match retained results",
              )
              summary = require_exact_fields(
                  native["population_summary"],
                  {
                      "total_runs",
                      "safe_count",
                      "unsafe_count",
                      "undetermined_count",
                      "error_count",
                      "attack_success_rate",
                      "safety_pass_rate",
                  },
                  name="native RAMPART population summary",
              )
              for field_name, expected_count in (
                  ("total_runs", total_runs),
                  ("safe_count", safe_count),
                  ("unsafe_count", unsafe_count),
                  ("undetermined_count", undetermined_count),
                  ("error_count", error_count),
              ):
                  require_contract(
                      require_integer(
                          summary[field_name],
                          name=f"native RAMPART summary {field_name}",
                      )
                      == expected_count,
                      "native RAMPART summary counts do not match results",
                  )
              diagnostic_total = total_runs - error_count
              expected_bypass_rate = (
                  0.0 if diagnostic_total == 0 else unsafe_count / diagnostic_total
              )
              expected_safety_rate = (
                  0.0 if diagnostic_total == 0 else safe_count / diagnostic_total
              )
              require_contract(
                  json_number(
                      summary["attack_success_rate"],
                      name="native RAMPART attack success rate",
                      maximum=1,
                  )
                  == expected_bypass_rate
                  and json_number(
                      summary["safety_pass_rate"],
                      name="native RAMPART safety pass rate",
                      maximum=1,
                  )
                  == expected_safety_rate,
                  "native RAMPART population rates do not match results",
              )

              native_digest = require_digest(
                  report["native_report_digest"],
                  name="native RAMPART report digest",
              )
              require_contract(
                  hashlib.sha256(canonical_bytes(native)).hexdigest()
                  == native_digest,
                  "native RAMPART report digest is invalid",
              )
              usage = require_exact_fields(
                  report["usage"],
                  {
                      "source",
                      "source_digest",
                      "observed_calls",
                      "calls_with_cost",
                      "total_cost_usd",
                      "cost_complete",
                  },
                  name="RAMPART usage",
              )
              observed_calls = require_integer(
                  usage["observed_calls"], name="RAMPART observed calls"
              )
              calls_with_cost = require_integer(
                  usage["calls_with_cost"], name="RAMPART calls with cost"
              )
              require_digest(
                  usage["source_digest"], name="RAMPART usage source digest"
              )
              require_contract(
                  usage["source"] == "external_usage_ledger"
                  and observed_calls >= total_runs
                  and calls_with_cost == observed_calls
                  and usage["cost_complete"] is True
                  and usage["total_cost_usd"] is not None,
                  "RAMPART usage accounting is incomplete",
              )
              require_decimal(usage["total_cost_usd"], name="RAMPART total cost")
              require_contract(
                  hashlib.sha256(canonical_bytes(usage)).hexdigest()
                  == run_attestation["usage_digest"],
                  "RAMPART usage does not match its signed run attestation",
              )
              report_digest = require_digest(
                  report["report_digest"], name="RAMPART report digest"
              )
              require_contract(
                  hashlib.sha256(
                      canonical_bytes(
                          {
                              key: item
                              for key, item in report.items()
                              if key != "report_digest"
                          }
                      )
                  ).hexdigest()
                  == report_digest,
                  "RAMPART report digest is invalid",
              )
              artifacts = record["artifacts"]
              assert isinstance(artifacts, dict)

              def retained_bytes(uri_field: str) -> bytes:
                  filename = caller_artifact_name(
                      artifacts[uri_field],
                      name=f"RAMPART artifacts.{uri_field}",
                  )
                  require_contract(
                      filename in retained_raw_artifacts,
                      f"RAMPART retained artifact is missing: {filename}",
                  )
                  return retained_raw_artifacts[filename]

              require_contract(
                  retained_bytes("report_uri") == canonical_bytes(report)
                  and retained_bytes("native_report_uri") == canonical_bytes(native)
                  and retained_bytes("campaign_uri") == canonical_bytes(campaign)
                  and retained_bytes("run_attestation_uri")
                  == canonical_bytes(run_attestation)
                  and artifacts["report_sha256"]
                  == hashlib.sha256(canonical_bytes(report)).hexdigest()
                  and artifacts["native_report_sha256"] == native_digest
                  and artifacts["campaign_sha256"]
                  == hashlib.sha256(canonical_bytes(campaign)).hexdigest()
                  and artifacts["run_attestation_sha256"]
                  == hashlib.sha256(canonical_bytes(run_attestation)).hexdigest(),
                  "RAMPART retained artifacts do not match the embedded report",
              )
              cases_per_dimension = {
                  dimension: sum(
                      str(case["harm_category"]) == dimension for case in cases
                  )
                  for dimension in dimensions
              }
              complete = (
                  total_runs > 0
                  and incomplete is False
                  and error_count == 0
                  and undetermined_count == 0
                  and observability_gaps == 0
              )
              require_contract(complete, "RAMPART campaign execution is incomplete")
              return {
                  "report": report,
                  "run_attestation": run_attestation,
                  "attestation_times": attestation_times,
                  "attestation_digest": attestation_digest,
                  "dimensions": dimensions,
                  "campaign_digest": campaign_digest,
                  "cases_per_dimension": cases_per_dimension,
                  "cases": total_runs,
                  "blockers": unsafe_count,
                  "observability_gaps": observability_gaps,
                  "incomplete": incomplete,
                  "incomplete_reasons": incomplete_reasons,
                  "complete": complete,
                  "errors": error_count,
                  "undetermined": undetermined_count,
                  "bypass_rate": (
                      Decimal("0")
                      if diagnostic_total == 0
                      else Decimal(unsafe_count) / Decimal(diagnostic_total)
                  ),
              }
          def validate_security_handoff(
              value: object,
              records: list[dict[str, object]],
              *,
              quality_risk_class: str,
              quality_evaluated_at: datetime,
              pyrit: dict[str, object] | None,
          ) -> dict[str, object]:
              handoff = require_exact_fields(
                  value,
                  {"schema", "result", "pyrit_policy", "pyrit_verdict"},
                  name="security gate handoff",
              )
              require_contract(
                  handoff["schema"] == "agt.ai-sdlc-security-gates/v1",
                  "security gate handoff schema is invalid",
              )
              result = validate_gate_result(handoff["result"], gate_id="G4")
              evaluated_at = parse_canonical_timestamp(result["evaluated_at"])
              assert evaluated_at is not None
              require_contract(
                  result["risk_class"] == quality_risk_class
                  and result["status"] == "pass"
                  and evaluated_at == quality_evaluated_at,
                  "G4 risk and evaluation time must match G0-G3",
              )
              conventional = (
                  {"provenance", "secrets"}
                  if quality_risk_class == "documentation"
                  else {"provenance", "sast", "sbom", "sca", "secrets"}
              )
              pyrit_required = require_pyrit or quality_risk_class in {
                  "high",
                  "tool_enabled_agent",
              }
              required_kinds = set(conventional)
              if quality_risk_class in {"high", "tool_enabled_agent"}:
                  required_kinds.update(
                      {"agent_safety", "judge_calibration", "tool_manifest"}
                  )
              g4_required = {
                  *common_evidence_check_codes,
                  *(f"security.{kind}_evidence" for kind in required_kinds),
                  *(f"security.{kind}_no_blocking_findings" for kind in conventional & {"sast", "sca", "secrets"}),
                  *( {"security.sbom_artifact_present"} if "sbom" in conventional else set() ),
                  *( {"security.provenance_attested"} if "provenance" in conventional else set() ),
              }
              if quality_risk_class in {"high", "tool_enabled_agent"}:
                  g4_required.update(
                      {
                          "agent_safety.bypass_rate",
                          "agent_safety.minimum_cases",
                          "agent_safety.no_blocking_findings",
                          "agent_safety.rampart_artifact_binding",
                          "agent_safety.rampart_attestation_freshness",
                          "agent_safety.rampart_campaign_trusted",
                          "agent_safety.rampart_command_reconciliation",
                          "agent_safety.rampart_complete",
                          "agent_safety.rampart_issuer_trust",
                          "agent_safety.rampart_observability",
                          "agent_safety.rampart_profile",
                          "agent_safety.rampart_report_valid",
                          "agent_safety.rampart_source_binding",
                          "agent_safety.single_authoritative_run",
                          "agent_safety.minimum_cases_per_dimension",
                          "agent_safety.required_dimensions",
                          "judge_calibration.agreement_rate",
                          "judge_calibration.dataset_bound",
                          "judge_calibration.false_accept_rate",
                          "judge_calibration.minimum_cases",
                          "judge_calibration.pyrit_profile",
                          "judge_calibration.scorer_binding",
                          "tools.declared_manifest_matches_change",
                          "tools.no_undeclared_observed_tools",
                      }
                  )
              if pyrit_required:
                  g4_required.update(
                      {
                          "pyrit.evaluation_succeeded",
                          "pyrit.policy_and_evidence_present",
                          "pyrit.release_policy_binding",
                          "pyrit.release_verdict",
                          "pyrit.subject_binding",
                      }
                  )
              g4_checks = require_gate_code_set(
                  result,
                  required=g4_required,
                  allowed=g4_required,
              )
              exact_command_references(result, records, kinds=required_kinds)
              g4_selected = [
                  record for record in records if record["kind"] in required_kinds
              ]
              require_exact_common_evidence_checks(result, g4_selected)
              rampart_facts: dict[str, object] | None = None
              if quality_risk_class in {"high", "tool_enabled_agent"}:
                  rampart_records = [
                      record for record in records if record["kind"] == "agent_safety"
                  ]
                  single_run_check = g4_checks[
                      "agent_safety.single_authoritative_run"
                  ][0]
                  require_contract(
                      len(rampart_records) == 1
                      and single_run_check["actual"] == 1
                      and single_run_check["threshold"] == 1
                      and single_run_check["evidence_ids"]
                      == sorted(
                          str(record["evidence_id"])
                          for record in rampart_records
                      ),
                      "G4 requires exactly one authoritative RAMPART run",
                  )
              for kind in required_kinds:
                  selected = passing_records(
                      records, kind=kind, evaluated_at=evaluated_at
                  )
                  require_contract(
                      bool(selected)
                      and g4_checks[f"security.{kind}_evidence"][0]["actual"]
                      == len(selected)
                      and g4_checks[f"security.{kind}_evidence"][0]["threshold"]
                      == 1,
                      f"G4 requires passing {kind} evidence with an exact count",
                  )
                  item = newest_record(selected)
                  if kind in {"sast", "sca", "secrets"}:
                      findings = metric_integer(item, "blocking_findings")
                      require_contract(
                          findings == 0
                          and g4_checks[
                              f"security.{kind}_no_blocking_findings"
                          ][0]["actual"]
                          == findings,
                          f"{kind} evidence reports blocking findings",
                      )
                  elif kind == "sbom":
                      artifacts = item["artifacts"]
                      assert isinstance(artifacts, dict)
                      require_contract(
                          is_canonical_nonempty_string(artifacts.get("sbom"))
                          and g4_checks["security.sbom_artifact_present"][0][
                              "actual"
                          ]
                          == artifacts.get("sbom"),
                          "SBOM evidence does not reference the generated artifact",
                      )
                  elif kind == "provenance":
                      require_contract(
                          item["metrics"].get("attested") is True
                          and g4_checks["security.provenance_attested"][0]["actual"]
                          is True,
                          "provenance evidence is not attested",
                      )
                  elif kind == "agent_safety":
                      rampart_facts = validate_rampart_report(item)
                      report = rampart_facts["report"]
                      assert isinstance(report, dict)
                      run_attestation = rampart_facts["run_attestation"]
                      assert isinstance(run_attestation, dict)
                      attestation_times = rampart_facts["attestation_times"]
                      assert isinstance(attestation_times, dict)
                      dimensions = rampart_facts["dimensions"]
                      assert isinstance(dimensions, list)
                      cases = rampart_facts["cases"]
                      blockers = rampart_facts["blockers"]
                      complete = rampart_facts["complete"]
                      bypass = rampart_facts["bypass_rate"]
                      campaign_digest = rampart_facts["campaign_digest"]
                      cases_per_dimension = rampart_facts["cases_per_dimension"]
                      observability_gaps = rampart_facts["observability_gaps"]
                      assert isinstance(cases, int)
                      assert isinstance(blockers, int)
                      assert isinstance(complete, bool)
                      assert isinstance(bypass, Decimal)
                      assert isinstance(campaign_digest, str)
                      assert isinstance(cases_per_dimension, dict)
                      assert isinstance(observability_gaps, int)
                      expected_command = {
                          "status": (
                              "passed"
                              if complete and blockers == 0
                              else "failed"
                              if complete
                              else "incomplete"
                          ),
                          "exit_code": 0 if complete and blockers == 0 else 1,
                      }
                      command_check = g4_checks[
                          "agent_safety.rampart_command_reconciliation"
                      ][0]
                      require_contract(
                          {
                              "status": item["status"],
                              "exit_code": item["exit_code"],
                          }
                          == expected_command
                          and command_check["actual"] == expected_command
                          and command_check["threshold"] == expected_command,
                          "RAMPART command status and exit code do not match signed results",
                      )
                      report_subject = report["subject"]
                      assert isinstance(report_subject, dict)
                      required_dimensions = require_string_list(
                          g4_checks["agent_safety.required_dimensions"][0][
                              "threshold"
                          ],
                          name="required agent-safety dimensions",
                          nonempty=True,
                      )
                      allowed_campaigns = require_string_list(
                          g4_checks["agent_safety.rampart_campaign_trusted"][0][
                              "threshold"
                          ],
                          name="allowed RAMPART campaigns",
                          nonempty=True,
                      )
                      for allowed_campaign in allowed_campaigns:
                          require_digest(
                              allowed_campaign,
                              name="allowed RAMPART campaign digest",
                          )
                      per_dimension_threshold = g4_checks[
                          "agent_safety.minimum_cases_per_dimension"
                      ][0]["threshold"]
                      require_contract(
                          isinstance(per_dimension_threshold, dict)
                          and set(per_dimension_threshold)
                          == set(required_dimensions),
                          "RAMPART per-dimension policy threshold is invalid",
                      )
                      assert isinstance(per_dimension_threshold, dict)
                      for dimension, minimum_cases in per_dimension_threshold.items():
                          require_contract(
                              require_integer(
                                  minimum_cases,
                                  name=f"minimum RAMPART cases for {dimension}",
                                  minimum=1,
                              )
                              <= int(cases_per_dimension.get(dimension, 0)),
                              "RAMPART campaign misses a per-dimension minimum",
                          )
                      require_contract(
                          pyrit is not None
                          and isinstance(pyrit["subject"], dict)
                          and report_subject["application"]
                          == pyrit["subject"]["application"]
                          and set(required_dimensions) <= set(dimensions)
                          and campaign_digest in allowed_campaigns
                          and blockers == 0,
                          "agent-safety evidence is incomplete or blocking",
                      )
                      minimum = require_integer(
                          g4_checks["agent_safety.minimum_cases"][0]["threshold"],
                          name="agent safety minimum cases",
                      )
                      maximum = require_decimal(
                          g4_checks["agent_safety.bypass_rate"][0]["threshold"],
                          name="agent safety bypass threshold",
                      )
                      artifacts = item["artifacts"]
                      assert isinstance(artifacts, dict)
                      expected_artifact_digests = {
                          "report_sha256": artifacts["report_sha256"],
                          "native_report_sha256": artifacts[
                              "native_report_sha256"
                          ],
                          "campaign_sha256": artifacts["campaign_sha256"],
                          "run_attestation_sha256": artifacts[
                              "run_attestation_sha256"
                          ],
                      }
                      issuer_actual = {
                          "issuer_id": run_attestation["issuer_id"],
                          "issuer_public_key": run_attestation[
                              "issuer_public_key"
                          ],
                          "producer": run_attestation["producer"],
                          "environment": run_attestation["environment"],
                      }
                      issuer_check = g4_checks[
                          "agent_safety.rampart_issuer_trust"
                      ][0]
                      trusted_issuers_value = issuer_check["threshold"]
                      require_contract(
                          isinstance(trusted_issuers_value, list)
                          and 1 <= len(trusted_issuers_value) <= 256,
                          "protected RAMPART issuer policy is absent or invalid",
                      )
                      assert isinstance(trusted_issuers_value, list)
                      trusted_issuer_records: list[dict[str, object]] = []
                      trusted_issuer_identities: list[tuple[str, str]] = []
                      for trust_value in trusted_issuers_value:
                          trust = require_exact_fields(
                              trust_value,
                              {
                                  "issuer_id",
                                  "public_key",
                                  "allowed_producers",
                                  "allowed_environments",
                              },
                              name="protected RAMPART issuer trust",
                          )
                          issuer_id = require_nonempty_string(
                              trust["issuer_id"],
                              name="protected RAMPART issuer id",
                          )
                          public_key = require_digest(
                              trust["public_key"],
                              name="protected RAMPART issuer public key",
                          )
                          allowed_producers = require_string_list(
                              trust["allowed_producers"],
                              name="protected RAMPART allowed producers",
                              nonempty=True,
                          )
                          allowed_environments = require_string_list(
                              trust["allowed_environments"],
                              name="protected RAMPART allowed environments",
                              nonempty=True,
                          )
                          require_contract(
                              allowed_producers == sorted(set(allowed_producers))
                              and allowed_environments
                              == sorted(set(allowed_environments)),
                              "protected RAMPART issuer contexts are not canonical",
                          )
                          trusted_issuer_identities.append((issuer_id, public_key))
                          trusted_issuer_records.append(trust)
                      require_contract(
                          trusted_issuer_identities
                          == sorted(set(trusted_issuer_identities)),
                          "protected RAMPART issuer policy is not canonical",
                      )
                      require_contract(
                          issuer_check["actual"] == issuer_actual
                          and any(
                              trust["issuer_id"] == run_attestation["issuer_id"]
                              and trust["public_key"]
                              == run_attestation["issuer_public_key"]
                              and run_attestation["producer"]
                              in trust["allowed_producers"]
                              and run_attestation["environment"]
                              in trust["allowed_environments"]
                              for trust in trusted_issuer_records
                          ),
                          "RAMPART run attestation is not signed by a protected issuer",
                      )
                      freshness_check = g4_checks[
                          "agent_safety.rampart_attestation_freshness"
                      ][0]
                      freshness_actual = require_exact_fields(
                          freshness_check["actual"],
                          {"attested_at", "expires_at"},
                          name="RAMPART attestation freshness facts",
                      )
                      freshness_threshold = require_exact_fields(
                          freshness_check["threshold"],
                          {
                              "latest_attested_at",
                              "expires_after",
                              "maximum_ttl_seconds",
                          },
                          name="protected RAMPART freshness policy",
                      )
                      latest_attested_at = parse_iso_utc_timestamp(
                          freshness_threshold["latest_attested_at"]
                      )
                      expires_after = parse_iso_utc_timestamp(
                          freshness_threshold["expires_after"]
                      )
                      maximum_ttl = require_integer(
                          freshness_threshold["maximum_ttl_seconds"],
                          name="maximum RAMPART attestation TTL",
                          minimum=1,
                      )
                      require_contract(
                          latest_attested_at is not None
                          and expires_after == evaluated_at
                          and freshness_actual
                          == {
                              "attested_at": attestation_times[
                                  "attested_at"
                              ].isoformat(),
                              "expires_at": attestation_times[
                                  "expires_at"
                              ].isoformat(),
                          }
                          and attestation_times["attested_at"]
                          <= latest_attested_at
                          and evaluated_at < attestation_times["expires_at"]
                          and attestation_times["expires_at"]
                          <= attestation_times["attested_at"]
                          + timedelta(seconds=maximum_ttl),
                          "RAMPART run attestation is future-dated, expired, or overlong",
                      )
                      expected_source_binding = {
                          "change_id": report_subject["change_id"],
                          "source_revision": report_subject["source_revision"],
                          "change_digest": report_subject["change_digest"],
                          "generated_at": attestation_times[
                              "generated_at"
                          ].isoformat(),
                          "producer": report["producer"],
                          "environment": report["environment"],
                          "command": report["command"],
                      }
                      expected_complete = {
                          "incomplete": rampart_facts["incomplete"],
                          "incomplete_reasons": rampart_facts[
                              "incomplete_reasons"
                          ],
                          "retained_trials": cases,
                          "errors": rampart_facts["errors"],
                          "undetermined": rampart_facts["undetermined"],
                          "observability_gaps": observability_gaps,
                      }
                      require_contract(
                          cases >= minimum
                          and bypass <= maximum
                          and g4_checks["agent_safety.rampart_report_valid"][0][
                              "actual"
                          ]
                          is None
                          and g4_checks["agent_safety.rampart_report_valid"][0][
                              "threshold"
                          ]
                          == "agt.rampart-safety-report/v1"
                          and g4_checks["agent_safety.rampart_profile"][0]["actual"]
                          == report["schema_version"]
                          and g4_checks["agent_safety.rampart_profile"][0][
                              "threshold"
                          ]
                          == report["schema_version"]
                          and g4_checks[
                              "agent_safety.rampart_source_binding"
                          ][0]["actual"]
                          == expected_source_binding
                          and g4_checks[
                              "agent_safety.rampart_source_binding"
                          ][0]["threshold"]
                          == expected_source_binding
                          and g4_checks[
                              "agent_safety.rampart_artifact_binding"
                          ][0]["actual"]
                          == expected_artifact_digests
                          and g4_checks[
                              "agent_safety.rampart_artifact_binding"
                          ][0]["threshold"]
                          == expected_artifact_digests
                          and g4_checks[
                              "agent_safety.rampart_campaign_trusted"
                          ][0]["actual"]
                          == campaign_digest
                          and g4_checks["agent_safety.rampart_complete"][0][
                              "actual"
                          ]
                          == expected_complete
                          and g4_checks["agent_safety.rampart_complete"][0][
                              "threshold"
                          ]
                          == {
                              "incomplete": False,
                              "errors": 0,
                              "undetermined": 0,
                              "observability_gaps": 0,
                          }
                          and g4_checks["agent_safety.rampart_observability"][0][
                              "actual"
                          ]
                          == observability_gaps
                          and g4_checks["agent_safety.rampart_observability"][0][
                              "threshold"
                          ]
                          == 0
                          and g4_checks["agent_safety.required_dimensions"][0][
                              "actual"
                          ]
                          == dimensions
                          and g4_checks["agent_safety.minimum_cases"][0]["actual"]
                          == cases
                          and g4_checks[
                              "agent_safety.minimum_cases_per_dimension"
                          ][0]["actual"]
                          == cases_per_dimension
                          and g4_checks["agent_safety.no_blocking_findings"][0][
                              "actual"
                          ]
                          == blockers
                          and require_decimal(
                              g4_checks["agent_safety.bypass_rate"][0]["actual"],
                              name="agent safety claimed bypass rate",
                          )
                          == bypass,
                          "agent-safety evidence exceeds policy",
                      )
                  elif kind == "tool_manifest":
                      metrics = item["metrics"]
                      assert isinstance(metrics, dict)
                      declared = require_string_list(
                          metrics.get("declared_tools"), name="declared tools"
                      )
                      observed = require_string_list(
                          metrics.get("observed_tools"), name="observed tools"
                      )
                      require_contract(
                          set(observed) <= set(declared)
                          and g4_checks[
                              "tools.declared_manifest_matches_change"
                          ][0]["actual"]
                          == declared
                          and g4_checks[
                              "tools.no_undeclared_observed_tools"
                          ][0]["actual"]
                          == observed,
                          "tool evidence reports undeclared observed tools",
                      )
                  elif kind == "judge_calibration":
                      metrics = item["metrics"]
                      assert isinstance(metrics, dict)
                      require_contract(
                          metrics.get("framework") == "PyRIT"
                          and isinstance(metrics.get("dataset_digest"), str)
                          and re.fullmatch(
                              r"[0-9a-f]{64}", str(metrics.get("dataset_digest"))
                          )
                          is not None
                          and pyrit is not None
                          and isinstance(pyrit["configuration"], dict)
                          and isinstance(pyrit["configuration"]["scorer"], dict)
                          and metrics.get("scorer_eval_hash")
                          == pyrit["configuration"]["scorer"]["eval_hash"],
                          "judge calibration is not bound to PyRIT and human labels",
                      )
                      cases = metric_integer(item, "human_labeled_cases")
                      agreement = metric_decimal(item, "agreement_rate")
                      false_accept = metric_decimal(item, "false_accept_rate")
                      require_contract(
                          cases
                          >= require_integer(
                              g4_checks["judge_calibration.minimum_cases"][0]["threshold"],
                              name="judge minimum cases",
                          )
                          and agreement
                          >= require_decimal(
                              g4_checks["judge_calibration.agreement_rate"][0]["threshold"],
                              name="judge agreement threshold",
                          )
                          and false_accept
                          <= require_decimal(
                              g4_checks["judge_calibration.false_accept_rate"][0]["threshold"],
                              name="judge false-accept threshold",
                          )
                          and g4_checks["judge_calibration.minimum_cases"][0][
                              "actual"
                          ]
                          == cases
                          and require_decimal(
                              g4_checks["judge_calibration.agreement_rate"][0][
                                  "actual"
                              ],
                              name="judge claimed agreement",
                          )
                          == agreement
                          and require_decimal(
                              g4_checks[
                                  "judge_calibration.false_accept_rate"
                              ][0]["actual"],
                              name="judge claimed false-accept rate",
                          )
                          == false_accept
                          and g4_checks["judge_calibration.dataset_bound"][0][
                              "actual"
                          ]
                          == metrics.get("dataset_digest")
                          and g4_checks["judge_calibration.scorer_binding"][0][
                              "actual"
                          ]
                          == metrics.get("scorer_eval_hash"),
                          "judge calibration metrics exceed policy",
                      )
              if pyrit_required:
                  require_contract(
                      pyrit is not None,
                      "risk-selected or explicitly required PyRIT evidence is missing",
                  )
                  assert pyrit is not None
                  policy = validate_release_policy(
                      handoff["pyrit_policy"], pyrit=pyrit
                  )
                  verdict = validate_release_verdict(
                      handoff["pyrit_verdict"],
                      pyrit=pyrit,
                      policy=policy,
                      g4=result,
                  )
                  references = result["evidence"]
                  assert isinstance(references, list)
                  non_command = {
                      (
                          str(reference["evidence_id"]),
                          str(reference["schema_version"]),
                          str(reference["digest"]),
                      )
                      for reference in references
                      if isinstance(reference, dict)
                      and reference["schema_version"]
                      != "agt.execution-evidence/v1"
                  }
                  run = pyrit["run"]
                  assert isinstance(run, dict)
                  expected_non_command = {
                      (
                          f"pyrit:{run['scenario_result_id']}",
                          "pyrit.security-evidence/v1",
                          str(pyrit["evidence_digest"]),
                      ),
                      (
                          f"pyrit-policy:{policy['policy_id']}",
                          "agt.release-policy/v1",
                          str(policy["policy_digest"]),
                      ),
                      (
                          f"pyrit-verdict:{policy['policy_id']}",
                          "agt.release-verdict/v1",
                          str(verdict["verdict_digest"]),
                      ),
                  }
                  if quality_risk_class in {"high", "tool_enabled_agent"}:
                      require_contract(
                          rampart_facts is not None,
                          "high-risk G4 lacks validated RAMPART facts",
                      )
                      assert rampart_facts is not None
                      rampart_report = rampart_facts["report"]
                      assert isinstance(rampart_report, dict)
                      expected_non_command.add(
                          (
                              f"rampart:{rampart_report['run_id']}",
                              str(rampart_report["schema_version"]),
                              str(rampart_report["report_digest"]),
                          )
                      )
                      rampart_attestation = rampart_facts["run_attestation"]
                      assert isinstance(rampart_attestation, dict)
                      expected_non_command.add(
                          (
                              "rampart-attestation:"
                              f"{rampart_attestation['attestation_id']}",
                              str(rampart_attestation["schema_version"]),
                              str(rampart_attestation["attestation_digest"]),
                          )
                      )
                  require_contract(
                      non_command == expected_non_command,
                      "G4 PyRIT policy/evidence/verdict references do not exactly resolve",
                  )
              else:
                  require_contract(
                      handoff["pyrit_policy"] is None
                      and handoff["pyrit_verdict"] is None,
                      "unexpected PyRIT verdict for a profile that did not evaluate PyRIT",
                  )
              return result

          fixed_caller_files = {
              "agent-sre-execution-evidence.json",
              "execution-receipt.json",
              "orchestration-manifest.json",
              "pyrit-security-evidence.json",
              "quality-details.json",
              "security-details.json",
          }
          required_caller_files = {
              "agent-sre-execution-evidence.json",
              "execution-receipt.json",
              "orchestration-manifest.json",
              "quality-details.json",
              "security-details.json",
          }
          max_caller_file_bytes = 16 * 1024 * 1024
          max_caller_records = 256
          max_caller_total_bytes = 32 * 1024 * 1024
          quality_handoff: object | None = None
          security_handoff: object | None = None
          if not caller_dir.is_dir():
              raise SystemExit("the fixed caller-evidence artifact is required")
          if caller_dir.is_dir():
              caller_files: list[Path] = []
              unsafe_entries: list[str] = []
              for path in caller_dir.iterdir():
                  relative = path.relative_to(caller_dir).as_posix()
                  try:
                      mode = path.lstat().st_mode
                  except OSError as exc:
                      raise SystemExit(f"cannot inspect caller evidence entry {relative!r}") from exc
                  if not stat.S_ISREG(mode):
                      unsafe_entries.append(relative)
                  else:
                      caller_files.append(path)
              if unsafe_entries:
                  raise SystemExit(
                      "caller evidence entries must be top-level regular files: "
                      f"{sorted(unsafe_entries)!r}"
                  )

              caller_files_by_name = {path.name: path for path in caller_files}
              actual_files = set(caller_files_by_name)
              missing = required_caller_files - actual_files
              if missing:
                  raise SystemExit(
                      f"caller evidence is missing required files: {sorted(missing)!r}"
                  )
              oversized = [
                  path.name
                  for path in caller_files
                  if path.stat().st_size > max_caller_file_bytes
              ]
              if oversized:
                  raise SystemExit(f"caller evidence files exceed the size limit: {sorted(oversized)!r}")
              total_caller_bytes = sum(path.stat().st_size for path in caller_files)
              if total_caller_bytes > max_caller_total_bytes:
                  raise SystemExit("caller evidence exceeds the aggregate size limit")
              for check_id, filename in (
                  ("quality", "quality-details.json"),
                  ("security", "security-details.json"),
              ):
                  path = caller_dir / filename
                  if not path.is_file():
                      raise SystemExit(f"caller evidence is missing {filename}")
                  report = load_json(path)
                  if path.read_bytes() != canonical_bytes(report) + b"\n":
                      raise SystemExit(
                          f"caller {check_id} gate handoff must use canonical JSON"
                      )
                  if check_id == "quality":
                      quality_handoff = report
                  else:
                      security_handoff = report
                  shutil.copyfile(path, evidence_dir / filename)

              orchestration_manifest_path = caller_dir / "orchestration-manifest.json"
              execution_receipt_path = caller_dir / "execution-receipt.json"
              try:
                  orchestration_manifest = load_json(orchestration_manifest_path)
                  if (
                      orchestration_manifest_path.read_bytes()
                      != canonical_bytes(orchestration_manifest) + b"\n"
                  ):
                      raise ValueError("orchestration manifest must use canonical JSON")
                  (
                      orchestration_manifest,
                      orchestration_manifest_digest,
                      orchestration_assignment_roles,
                      orchestration_assignment_cost_limits,
                  ) = validate_orchestration_manifest(orchestration_manifest)
                  execution_receipt = load_json(execution_receipt_path)
                  if (
                      execution_receipt_path.read_bytes()
                      != canonical_bytes(execution_receipt) + b"\n"
                  ):
                      raise ValueError("execution receipt must use canonical JSON")
                  execution_receipt, execution_receipt_digest = validate_execution_receipt(
                      execution_receipt,
                      manifest=orchestration_manifest,
                      manifest_digest=orchestration_manifest_digest,
                      assignment_roles=orchestration_assignment_roles,
                      assignment_cost_limits=orchestration_assignment_cost_limits,
                  )
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"orchestration evidence is invalid or unbound: {exc}"
                  ) from exc
              shutil.copyfile(
                  orchestration_manifest_path,
                  evidence_dir / orchestration_manifest_path.name,
              )
              shutil.copyfile(
                  execution_receipt_path,
                  evidence_dir / execution_receipt_path.name,
              )
              receipt_assignments = execution_receipt["assignments"]
              assert isinstance(receipt_assignments, list)
              execution_usage_event_ids = [
                  str(assignment["usage_event_id"])
                  for assignment in receipt_assignments
                  if isinstance(assignment, dict)
                  and assignment["host_invoked"] is True
              ]
              execution_event_set_digest = usage_event_set_digest(
                  execution_usage_event_ids
              )
              provenance["orchestration"] = {
                  "manifest_id": orchestration_manifest["manifest_id"],
                  "manifest_digest": orchestration_manifest_digest,
                  "policy_digest": orchestration_manifest["policy_digest"],
                  "run_id": execution_receipt["run_id"],
                  "receipt_digest": execution_receipt_digest,
                  "assignment_ids": [
                      assignment_id
                      for assignment_id, _role in orchestration_assignment_roles
                  ],
                  "total_actual_cost_usd": execution_receipt[
                      "total_actual_cost_usd"
                  ],
                  "cost_complete": True,
                  "release_checkpoint_valid_until": execution_receipt[
                      "release_checkpoint_valid_until"
                  ],
                  "event_count": len(execution_usage_event_ids),
                  "event_set_digest": execution_event_set_digest,
                  "final_status": "succeeded",
              }
              write_json(evidence_dir / "provenance.json", provenance)

              agent_sre_path = caller_dir / "agent-sre-execution-evidence.json"
              if agent_sre_path.is_file():
                  supplied = load_json(agent_sre_path)
                  if not isinstance(supplied, list):
                      raise SystemExit("Agent SRE execution evidence must be a JSON array")
                  if agent_sre_path.read_bytes() != canonical_bytes(supplied) + b"\n":
                      raise SystemExit("Agent SRE execution evidence must use canonical JSON")
                  if len(supplied) > max_caller_records:
                      raise SystemExit("Agent SRE execution evidence exceeds the record limit")
                  for record in supplied:
                      if not isinstance(record, dict):
                          raise SystemExit("Agent SRE execution evidence entries must be objects")
                      if not validate_command_evidence(record):
                          raise SystemExit("Agent SRE execution evidence is invalid or source-unbound")
                      caller_records.append(record)

              artifact_prefix = "artifact://agt-ai-sdlc-caller-evidence/"
              reserved_artifact_names = fixed_caller_files | {
                  "evidence-manifest.json",
                  "provenance.json",
                  "quality-report.json",
                  "security-report.json",
                  "sbom.spdx.json",
              }
              retained_raw_artifacts: dict[str, bytes] = {}
              referenced_raw_names: set[str] = set()

              def caller_artifact_name(value: object, *, name: str) -> str:
                  uri = require_nonempty_string(value, name=name)
                  require_contract(
                      uri.startswith(artifact_prefix),
                      f"{name} must resolve inside the fixed caller artifact",
                  )
                  filename = uri[len(artifact_prefix) :]
                  require_contract(
                      re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,254}", filename)
                      is not None
                      and filename not in {".", ".."}
                      and filename not in reserved_artifact_names
                      and PurePosixPath(filename).name == filename,
                      f"{name} must contain one safe, non-reserved basename",
                  )
                  return filename

              def retain_raw_artifact(
                  record: dict[str, object],
                  *,
                  uri_field: str,
                  digest_field: str,
              ) -> None:
                  artifacts = record["artifacts"]
                  assert isinstance(artifacts, dict)
                  filename = caller_artifact_name(
                      artifacts[uri_field],
                      name=f"{record['evidence_id']} artifacts.{uri_field}",
                  )
                  expected_digest = require_digest(
                      artifacts[digest_field],
                      name=f"{record['evidence_id']} artifacts.{digest_field}",
                  )
                  require_contract(
                      filename not in referenced_raw_names,
                      "caller command report basenames must be unique",
                  )
                  referenced_raw_names.add(filename)
                  path = caller_files_by_name.get(filename)
                  require_contract(
                      path is not None,
                      f"caller command evidence is missing retained report {filename!r}",
                  )
                  assert path is not None
                  payload = path.read_bytes()
                  require_contract(
                      hashlib.sha256(payload).hexdigest() == expected_digest,
                      f"caller command report digest mismatch: {filename}",
                  )
                  retained_raw_artifacts[filename] = payload

              for record in caller_records:
                  artifacts = record["artifacts"]
                  assert isinstance(artifacts, dict)
                  expected_artifact_fields = {"report_uri", "report_sha256"}
                  if record["kind"] == "sbom":
                      expected_artifact_fields.update({"sbom", "sbom_sha256"})
                  if record["kind"] == "agent_safety":
                      expected_artifact_fields.update(
                          {
                              "native_report_uri",
                              "native_report_sha256",
                              "campaign_uri",
                              "campaign_sha256",
                              "run_attestation_uri",
                              "run_attestation_sha256",
                          }
                      )
                  require_contract(
                      set(artifacts) == expected_artifact_fields,
                      "caller command artifact references must be exact URI/digest pairs",
                  )
                  retain_raw_artifact(
                      record,
                      uri_field="report_uri",
                      digest_field="report_sha256",
                  )
                  if record["kind"] == "sbom":
                      retain_raw_artifact(
                          record,
                          uri_field="sbom",
                          digest_field="sbom_sha256",
                      )
                  if record["kind"] == "agent_safety":
                      retain_raw_artifact(
                          record,
                          uri_field="native_report_uri",
                          digest_field="native_report_sha256",
                      )
                      retain_raw_artifact(
                          record,
                          uri_field="campaign_uri",
                          digest_field="campaign_sha256",
                      )
                      retain_raw_artifact(
                          record,
                          uri_field="run_attestation_uri",
                          digest_field="run_attestation_sha256",
                      )

              unexpected = actual_files - fixed_caller_files - referenced_raw_names
              if unexpected:
                  raise SystemExit(
                      f"caller evidence contains unexpected files: {sorted(unexpected)!r}"
                  )
              for filename, payload in retained_raw_artifacts.items():
                  (evidence_dir / filename).write_bytes(payload)

          def validate_cost_rollup(
              value: object,
              *,
              name: str,
          ) -> tuple[dict[str, object], int, Decimal | None, int, bool]:
              rollup = require_exact_fields(value, cost_rollup_fields, name=name)
              event_count = require_integer(
                  rollup["event_count"], name=f"{name}.event_count"
              )
              require_digest(
                  rollup["event_set_digest"], name=f"{name}.event_set_digest"
              )
              unpriced = require_integer(
                  rollup["unpriced_events"],
                  name=f"{name}.unpriced_events",
                  maximum=event_count,
              )
              complete = unpriced == 0 and rollup["total_cost_usd"] is not None
              require_contract(
                  type(rollup["cost_complete"]) is bool
                  and rollup["cost_complete"] is complete
                  and (complete or rollup["total_cost_usd"] is None),
                  f"{name} completeness does not match its raw facts",
              )
              total = (
                  None
                  if rollup["total_cost_usd"] is None
                  else require_decimal(
                      rollup["total_cost_usd"], name=f"{name}.total_cost_usd"
                  )
              )
              return rollup, event_count, total, unpriced, complete

          def validate_change_cost_report(
              value: object,
              *,
              record: dict[str, object],
          ) -> dict[str, object]:
              report = require_exact_fields(
                  value,
                  change_cost_report_fields,
                  name="change cost report",
              )
              require_contract(
                  report["schema_version"] == "agt.change-cost-report/v1"
                  and report["change_id"] == change_id
                  and report["source_revision"] == source
                  and report["change_digest"] == change_digest
                  and report["generated_at"] == record["generated_at"],
                  "change cost report is not bound to the exact change and evidence",
              )
              require_digest(report["change_digest"], name="change cost report.change_digest")
              require_contract(
                  is_canonical_timestamp(report["generated_at"]),
                  "change cost report generated_at is invalid",
              )
              ledger, ledger_count, ledger_total, ledger_unpriced, ledger_complete = (
                  validate_cost_rollup(
                      report["ledger_rollup"], name="change cost report.ledger_rollup"
                  )
              )
              orchestration, orchestration_count, orchestration_total, _, _ = (
                  validate_cost_rollup(
                      report["orchestration_rollup"],
                      name="change cost report.orchestration_rollup",
                  )
              )
              required_kinds = require_string_list(
                  report["required_component_kinds"],
                  name="change cost report.required_component_kinds",
                  nonempty=True,
                  allowed={"ci", "orchestration", "other", "pyrit", "rampart", "scanner"},
              )
              components_value = report["components"]
              require_contract(
                  isinstance(components_value, list)
                  and 1 <= len(components_value) <= 1024,
                  "change cost report components must be bounded and non-empty",
              )
              assert isinstance(components_value, list)
              component_order: list[tuple[str, str, str]] = []
              component_source_digests: list[str] = []
              ledger_components: list[tuple[dict[str, object], dict[str, object]]] = []
              external_facts: list[dict[str, object]] = []
              observed_kinds: set[str] = set()
              ledger_event_ids: list[str] = []
              for component_value in components_value:
                  require_contract(
                      isinstance(component_value, dict),
                      "change cost component must be an object",
                  )
                  assert isinstance(component_value, dict)
                  component_type = component_value.get("component_type")
                  if component_type == "ledger":
                      component = require_exact_fields(
                          component_value,
                          {
                              "component_type",
                              "component_kind",
                              "component_id",
                              "source_schema",
                              "source_digest",
                              "event_ids",
                              "facts",
                              "partition_digest",
                          },
                          name="ledger cost component",
                      )
                      component_kind = str(component["component_kind"])
                      require_contract(
                          component_kind
                          in {"ci", "orchestration", "other", "scanner"},
                          "ledger cost component kind is invalid",
                      )
                      component_id = require_nonempty_string(
                          component["component_id"], name="cost component.component_id"
                      )
                      require_nonempty_string(
                          component["source_schema"], name="cost component.source_schema"
                      )
                      source_digest = require_digest(
                          component["source_digest"], name="cost component.source_digest"
                      )
                      event_ids = require_string_list(
                          component["event_ids"],
                          name="ledger cost component.event_ids",
                      )
                      facts, facts_count, _, _, _ = validate_cost_rollup(
                          component["facts"], name="ledger cost component.facts"
                      )
                      require_contract(
                          facts_count == len(event_ids)
                          and facts["event_set_digest"]
                          == usage_event_set_digest(event_ids),
                          "ledger component facts do not match its event inventory",
                      )
                      partition_digest = require_digest(
                          component["partition_digest"],
                          name="ledger cost component.partition_digest",
                      )
                      require_contract(
                          hashlib.sha256(
                              canonical_bytes(
                                  {
                                      key: item
                                      for key, item in component.items()
                                      if key != "partition_digest"
                                  }
                              )
                          ).hexdigest()
                          == partition_digest,
                          "ledger component partition digest is invalid",
                      )
                      ledger_event_ids.extend(event_ids)
                      ledger_components.append((component, facts))
                  elif component_type in {"pyrit_external", "rampart_external"}:
                      raw_field = "evidence" if component_type == "pyrit_external" else "report"
                      component = require_exact_fields(
                          component_value,
                          {"component_type", "component_id", raw_field, "facts"},
                          name="external cost component",
                      )
                      component_kind = "pyrit" if component_type == "pyrit_external" else "rampart"
                      component_id = require_nonempty_string(
                          component["component_id"], name="cost component.component_id"
                      )
                      require_contract(
                          isinstance(component[raw_field], dict),
                          "external cost component must retain its raw source envelope",
                      )
                      raw = component[raw_field]
                      assert isinstance(raw, dict)
                      digest_field = (
                          "evidence_digest" if component_type == "pyrit_external" else "report_digest"
                      )
                      source_digest = require_digest(
                          raw.get(digest_field), name=f"external cost component.{digest_field}"
                      )
                      facts, _, _, _, _ = validate_cost_rollup(
                          component["facts"], name="external cost component.facts"
                      )
                      require_contract(
                          hashlib.sha256(
                              canonical_bytes(
                                  {
                                      key: item
                                      for key, item in raw.items()
                                      if key != digest_field
                                  }
                              )
                          ).hexdigest()
                          == source_digest,
                          "external cost component raw source digest is invalid",
                      )
                      if component_type == "pyrit_external":
                          subject = raw.get("subject")
                          usage = raw.get("usage")
                          require_contract(
                              isinstance(subject, dict)
                              and subject.get("change") == change_id
                              and subject.get("commit_sha") == source
                              and isinstance(usage, dict),
                              "PyRIT cost component is not source-bound",
                          )
                          assert isinstance(usage, dict)
                          observed_calls = require_integer(
                              usage.get("observed_response_count"),
                              name="PyRIT cost observed responses",
                          )
                          calls_with_cost = require_integer(
                              usage.get("calls_with_cost"),
                              name="PyRIT cost calls with cost",
                              maximum=observed_calls,
                          )
                          raw_complete = (
                              usage.get("cost_coverage") == "complete"
                              and isinstance(usage.get("cost"), dict)
                          )
                          raw_total = None
                          if raw_complete:
                              cost = usage["cost"]
                              assert isinstance(cost, dict)
                              require_contract(
                                  cost.get("currency") == "USD",
                                  "PyRIT external cost currency is invalid",
                              )
                              raw_total = require_decimal(
                                  cost.get("amount"), name="PyRIT external total cost"
                              )
                      else:
                          subject = raw.get("subject")
                          usage = raw.get("usage")
                          require_contract(
                              isinstance(subject, dict)
                              and subject.get("change_id") == change_id
                              and subject.get("source_revision") == source
                              and subject.get("change_digest") == change_digest
                              and isinstance(usage, dict),
                              "RAMPART cost component is not source-bound",
                          )
                          assert isinstance(usage, dict)
                          observed_calls = require_integer(
                              usage.get("observed_calls"),
                              name="RAMPART cost observed calls",
                          )
                          calls_with_cost = require_integer(
                              usage.get("calls_with_cost"),
                              name="RAMPART cost calls with cost",
                              maximum=observed_calls,
                          )
                          raw_complete = usage.get("cost_complete") is True
                          raw_total = (
                              None
                              if not raw_complete
                              else require_decimal(
                                  usage.get("total_cost_usd"),
                                  name="RAMPART external total cost",
                              )
                          )
                      require_contract(
                          facts
                          == {
                              "event_count": observed_calls,
                              "event_set_digest": source_digest,
                              "total_cost_usd": (
                                  None
                                  if raw_total is None
                                  else (
                                      "0"
                                      if raw_total == 0
                                      else format(raw_total.normalize(), "f")
                                  )
                              ),
                              "unpriced_events": (
                                  0
                                  if raw_complete
                                  else observed_calls - calls_with_cost
                              ),
                              "cost_complete": raw_complete,
                          },
                          "external component facts do not match retained raw usage",
                      )
                      external_facts.append(facts)
                  else:
                      raise ValueError("change cost component type is invalid")
                  observed_kinds.add(component_kind)
                  component_order.append(
                      (str(component_type), component_kind, component_id)
                  )
                  component_source_digests.append(source_digest)
              require_contract(
                  component_order == sorted(set(component_order))
                  and len(component_source_digests)
                  == len(set(component_source_digests))
                  and required_kinds == sorted(observed_kinds)
                  and len(ledger_event_ids) == len(set(ledger_event_ids))
                  and ledger_count == len(ledger_event_ids)
                  and ledger["event_set_digest"]
                  == usage_event_set_digest(ledger_event_ids),
                  "change cost components are duplicated, incomplete, or non-canonical",
              )
              orchestration_components = [
                  (component, facts)
                  for component, facts in ledger_components
                  if component["component_kind"] == "orchestration"
              ]
              require_contract(
                  len(orchestration_components) == 1
                  and orchestration_components[0][1] == orchestration
                  and orchestration_components[0][0]["source_schema"]
                  == execution_receipt["schema_version"]
                  and orchestration_components[0][0]["source_digest"]
                  == execution_receipt["receipt_digest"]
                  and orchestration_components[0][0]["event_ids"]
                  == sorted(execution_usage_event_ids)
                  and orchestration_count == len(execution_usage_event_ids)
                  and orchestration["event_set_digest"]
                  == execution_event_set_digest
                  and orchestration_total
                  == require_decimal(
                      execution_receipt["total_actual_cost_usd"],
                      name="receipt.total_actual_cost_usd",
                  ),
                  "orchestration cost component does not reconcile the exact receipt",
              )
              ledger_facts = [facts for _component, facts in ledger_components]
              require_contract(
                  ledger_count == sum(int(item["event_count"]) for item in ledger_facts)
                  and ledger_unpriced
                  == sum(int(item["unpriced_events"]) for item in ledger_facts)
                  and ledger_complete
                  == all(item["cost_complete"] is True for item in ledger_facts)
                  and ledger_total
                  == (
                      None
                      if not ledger_complete
                      else sum(
                          (
                              require_decimal(
                                  item["total_cost_usd"], name="ledger component total"
                              )
                              for item in ledger_facts
                          ),
                          Decimal("0"),
                      )
                  ),
                  "ledger components do not exactly partition the ledger rollup",
              )
              total_event_count = require_integer(
                  report["total_event_count"], name="change cost total_event_count"
              )
              total_unpriced = require_integer(
                  report["total_unpriced_events"],
                  name="change cost total_unpriced_events",
                  maximum=total_event_count,
              )
              external_event_count = sum(
                  int(item["event_count"]) for item in external_facts
              )
              external_unpriced = sum(
                  int(item["unpriced_events"]) for item in external_facts
              )
              expected_complete = ledger_complete and all(
                  item["cost_complete"] is True for item in external_facts
              )
              expected_total = (
                  None
                  if not expected_complete
                  else (ledger_total or Decimal("0"))
                  + sum(
                      (
                          require_decimal(
                              item["total_cost_usd"], name="external component total"
                          )
                          for item in external_facts
                      ),
                      Decimal("0"),
                  )
              )
              report_total = (
                  None
                  if report["total_cost_usd"] is None
                  else require_decimal(
                      report["total_cost_usd"], name="change cost total_cost_usd"
                  )
              )
              require_contract(
                  total_event_count == ledger_count + external_event_count
                  and total_unpriced == ledger_unpriced + external_unpriced
                  and report["cost_complete"] is expected_complete
                  and report_total == expected_total,
                  "change cost totals do not match ledger and external components",
              )
              accounting_digest = require_digest(
                  report["accounting_digest"], name="change cost accounting_digest"
              )
              require_contract(
                  hashlib.sha256(
                      canonical_bytes(
                          {
                              key: item
                              for key, item in report.items()
                              if key != "accounting_digest"
                          }
                      )
                  ).hexdigest()
                  == accounting_digest,
                  "change cost accounting digest does not match its payload",
              )
              return report

          cost_records = [record for record in caller_records if record["kind"] == "cost"]
          if len(cost_records) != 1:
              raise SystemExit(
                  "Agent SRE execution evidence must contain exactly one canonical COST record"
              )
          try:
              cost_metrics = require_exact_fields(
                  cost_records[0]["metrics"],
                  cost_metric_fields,
                  name="COST evidence metrics",
              )
              cost_report = validate_change_cost_report(
                  cost_metrics["change_cost_report"],
                  record=cost_records[0],
              )
              cost_event_count = require_integer(
                  cost_metrics["event_count"],
                  name="COST evidence event_count",
                  maximum=257,
              )
              cost_event_set_digest = require_digest(
                  cost_metrics["event_set_digest"],
                  name="COST evidence event_set_digest",
              )
              orchestration_event_set_digest = require_digest(
                  cost_metrics["orchestration_event_set_digest"],
                  name="COST evidence orchestration_event_set_digest",
              )
              cost_total = require_decimal(
                  cost_metrics["total_cost_usd"],
                  name="COST evidence total_cost_usd",
              )
              cost_unpriced = require_integer(
                  cost_metrics["unpriced_events"],
                  name="COST evidence unpriced_events",
                  maximum=257,
              )
              require_contract(
                  cost_records[0]["status"] == "passed"
                  and cost_records[0]["exit_code"] == 0
                  and cost_records[0]["test_layers"] == []
                  and cost_metrics["cost_complete"] is True
                  and cost_unpriced == 0
                  and cost_event_count == cost_report["total_event_count"]
                  and cost_event_set_digest
                  == cost_report["ledger_rollup"]["event_set_digest"]
                  and orchestration_event_set_digest == execution_event_set_digest
                  and cost_total
                  == require_decimal(
                      cost_report["total_cost_usd"],
                      name="change cost report.total_cost_usd",
                  )
                  and cost_unpriced == cost_report["total_unpriced_events"],
                  "COST metrics do not exactly mirror the canonical whole-change report",
              )
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(f"COST evidence is invalid or unbound: {exc}") from exc

          pyrit: dict[str, object] | None = None
          pyrit_path = caller_dir / "pyrit-security-evidence.json"
          if pyrit_path.is_file():
              try:
                  pyrit = load_json(pyrit_path)
                  if pyrit_path.read_bytes() != canonical_bytes(pyrit) + b"\n":
                      raise ValueError("PyRIT evidence must use canonical JSON")
                  pyrit, _pyrit_digest = validate_pyrit_evidence(pyrit)
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(f"PyRIT evidence is invalid or source-unbound: {exc}") from exc
              completeness = pyrit["completeness"]
              if require_pyrit and not (
                  completeness["status"] == "complete"
                  and completeness["terminal"] is True
                  and completeness["has_trials"] is True
              ):
                  raise SystemExit("required PyRIT evidence must be complete, terminal, and non-empty")
              shutil.copyfile(pyrit_path, evidence_dir / pyrit_path.name)
          elif require_pyrit:
              raise SystemExit("required PyRIT evidence is missing")

          try:
              require_contract(
                  quality_handoff is not None and security_handoff is not None,
                  "canonical G0-G4 gate handoffs are required",
              )
              quality_results, risk_class, development_policy_digest, gate_time = (
                  validate_quality_handoff(quality_handoff, caller_records)
              )
              security_result = validate_security_handoff(
                  security_handoff,
                  caller_records,
                  quality_risk_class=risk_class,
                  quality_evaluated_at=gate_time,
                  pyrit=pyrit,
              )
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(
                  f"caller G0-G4 gate evidence is invalid or unbound: {exc}"
              ) from exc
          provenance["gates"] = {
              "risk_class": risk_class,
              "evaluated_at": quality_results[0]["evaluated_at"],
              "development_policy_digest": development_policy_digest,
              "enterprise_policy_digest": security_result["policy_digest"],
              "result_digests": {
                  str(result["gate_id"]): result["result_digest"]
                  for result in [*quality_results, security_result]
              },
          }
          write_json(evidence_dir / "provenance.json", provenance)

          def file_sha(name: str) -> str:
              return hashlib.sha256((evidence_dir / name).read_bytes()).hexdigest()

          def execution_evidence(
              evidence_id: str,
              kind: str,
              command: str,
              report_name: str,
              metrics: dict[str, object],
              artifacts: dict[str, str] | None = None,
          ) -> dict[str, object]:
              report_sha = file_sha(report_name)
              record: dict[str, object] = {
                  "schema_version": "agt.execution-evidence/v1",
                  "evidence_id": evidence_id,
                  "change_id": change_id,
                  "source_revision": source,
                  "change_digest": change_digest,
                  "kind": kind,
                  "status": "passed",
                  "generated_at": generated_at,
                  "producer": "agt.enterprise-ai-sdlc-evidence",
                  "environment": "ci",
                  "command": command,
                  "exit_code": 0,
                  "requirement_ids": [],
                  "scenario_ids": [],
                  "task_ids": [],
                  "test_layers": [],
                  "metrics": metrics,
                  "artifacts": {
                      "report_uri": f"artifact://agt-ai-sdlc-evidence/{report_name}",
                      "report_sha256": report_sha,
                      **(artifacts or {}),
                  },
              }
              record["evidence_sha256"] = hashlib.sha256(canonical_bytes(record)).hexdigest()
              return record

          central_records = [
              execution_evidence(
                  "EVD-CENTRAL-SBOM",
                  "sbom",
                  "anchore/sbom-action",
                  "sbom.spdx.json",
                  {"format": "spdx-json"},
                  {"sbom": "artifact://agt-ai-sdlc-evidence/sbom.spdx.json"},
              ),
          ]
          if os.environ["EVENT_NAME"] == "pull_request":
              central_records.append(
                  execution_evidence(
                      "EVD-CENTRAL-SCA",
                      "sca",
                      "actions/dependency-review-action",
                      "security-report.json",
                      {"blocking_findings": 0},
                  )
              )
          all_records = sorted(
              [*central_records, *caller_records], key=lambda item: str(item["evidence_id"])
          )
          if len({record["evidence_id"] for record in all_records}) != len(all_records):
              raise SystemExit("Agent SRE evidence identifiers must be unique")
          write_json(evidence_dir / "agent-sre-execution-evidence.json", all_records)
          for record in all_records:
              write_json(evidence_dir / f"agent-sre-{record['evidence_id']}.json", record)

          manifest_artifacts = []
          for artifact in sorted(evidence_dir.iterdir(), key=lambda path: path.name):
              if artifact.name == "evidence-manifest.json" or not artifact.is_file():
                  continue
              manifest_artifacts.append(
                  {
                      "name": artifact.name,
                      "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                      "size_bytes": artifact.stat().st_size,
                  }
              )
          manifest = {
              "schema": "agt.ai-sdlc-evidence-manifest/v1",
              "change_id": change_id,
              "change_digest": change_digest,
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_revision": source,
              "base_revision": base,
              "artifacts": manifest_artifacts,
              "pyrit": {
                  "evidence_present": (evidence_dir / "pyrit-security-evidence.json").is_file(),
                  "network_execution_in_this_workflow": False,
              },
          }
          manifest_path = evidence_dir / "evidence-manifest.json"
          write_json(manifest_path, manifest)
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"manifest_sha256={manifest_sha}\n")
              output.write(f"source_revision={source}\n")
          PY

      - name: Upload Agent SRE evidence handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agt-ai-sdlc-evidence
          path: ${{ runner.temp }}/agt-ai-sdlc-evidence
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  attest:
    name: Attest evidence manifest
    if: inputs.enable_attestation && github.event_name != 'pull_request'
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download assembled evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agt-ai-sdlc-evidence
          path: ${{ runner.temp }}/agt-ai-sdlc-evidence

      - name: Attest the exact evidence manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/agt-ai-sdlc-evidence/evidence-manifest.json
