name: Enterprise AI-SDLC evidence

on:
  workflow_call:
    inputs:
      base_revision:
        description: Trusted full Git commit SHA used as the base of the reviewed change
        required: true
        type: string
      change_id:
        description: Canonical agt.change/v1 identifier to bind into Agent SRE evidence
        required: true
        type: string
      change_digest:
        description: Lowercase SHA-256 digest of the protected canonical change
        required: true
        type: string
      require_pyrit_evidence:
        description: Fail unless the caller artifact contains source-bound PyRIT evidence
        required: false
        default: false
        type: boolean
      enable_attestation:
        description: Attest the final manifest on non-PR protected runs
        required: false
        default: false
        type: boolean
      retention_days:
        description: Evidence artifact retention, from 1 through 30 days
        required: false
        default: 14
        type: number
    outputs:
      artifact_name:
        description: Fixed artifact name containing the Agent SRE handoff
        value: ${{ jobs.evidence.outputs.artifact_name }}
      manifest_sha256:
        description: SHA-256 of the canonical evidence manifest
        value: ${{ jobs.evidence.outputs.manifest_sha256 }}
      source_revision:
        description: Exact caller revision bound into every generated record
        value: ${{ jobs.evidence.outputs.source_revision }}

permissions:
  actions: read
  contents: read

jobs:
  evidence:
    name: Deterministic evidence assembly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: agt-ai-sdlc-evidence
      manifest_sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
      source_revision: ${{ steps.assemble.outputs.source_revision }}
    steps:
      - name: Check out the exact caller revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Prepare fixed evidence directories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agt-ai-sdlc-evidence"
          mkdir -p "$RUNNER_TEMP/agt-ai-sdlc-caller-evidence"

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/agt-ai-sdlc-evidence/sbom.spdx.json
          artifact-name: agt-ai-sdlc-sbom

      - name: Download fixed-name caller evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agt-ai-sdlc-caller-evidence
          path: ${{ runner.temp }}/agt-ai-sdlc-caller-evidence

      - name: Validate, bind, and assemble evidence
        id: assemble
        env:
          ATTESTATION_EXPECTED: ${{ inputs.enable_attestation && github.event_name != 'pull_request' }}
          BASE_REVISION: ${{ inputs.base_revision }}
          CALLER_EVIDENCE_DIR: ${{ runner.temp }}/agt-ai-sdlc-caller-evidence
          CHANGE_DIGEST: ${{ inputs.change_digest }}
          CHANGE_ID: ${{ inputs.change_id }}
          EVIDENCE_DIR: ${{ runner.temp }}/agt-ai-sdlc-evidence
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_PYRIT_EVIDENCE: ${{ inputs.require_pyrit_evidence }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import re
          import shutil
          import stat
          import subprocess
          import tempfile
          from collections import Counter
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal, InvalidOperation
          from pathlib import Path, PurePosixPath

          source = os.environ["SOURCE_REVISION"]
          supplied_base = os.environ["BASE_REVISION"]
          if not re.fullmatch(r"[0-9A-Fa-f]{40}", supplied_base):
              raise SystemExit("base_revision must be a full Git commit SHA")
          base = supplied_base.lower()
          change_id = os.environ["CHANGE_ID"].strip()
          change_digest = os.environ["CHANGE_DIGEST"]
          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          caller_dir = Path(os.environ["CALLER_EVIDENCE_DIR"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          require_pyrit = os.environ["REQUIRE_PYRIT_EVIDENCE"] == "true"
          attestation_expected = os.environ["ATTESTATION_EXPECTED"] == "true"

          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("source revision must be a full lowercase Git commit SHA")
          if not change_id or len(change_id) > 256 or any(ord(char) < 32 for char in change_id):
              raise SystemExit("change_id must be a bounded printable identifier")
          if not re.fullmatch(r"[0-9a-f]{64}", change_digest):
              raise SystemExit("change_digest must be a lowercase SHA-256 value")
          try:
              retention = int(os.environ["RETENTION_DAYS"])
          except ValueError as exc:
              raise SystemExit("retention_days must be an integer") from exc
          if not 1 <= retention <= 30:
              raise SystemExit("retention_days must be between 1 and 30")
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              cwd=workspace,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if head != source:
              raise SystemExit("checkout does not match the source revision")
          resolved_base = subprocess.run(
              ["git", "rev-parse", "--verify", f"{base}^{{commit}}"],
              cwd=workspace,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if resolved_base != base:
              raise SystemExit("base_revision does not resolve to the supplied commit")
          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", base, source],
              cwd=workspace,
              capture_output=True,
              text=True,
          )
          if ancestor.returncode != 0:
              raise SystemExit("base_revision must be an ancestor of source_revision")
          quality = subprocess.run(
              ["git", "diff", "--check", f"{base}...{source}"],
              cwd=workspace,
              capture_output=True,
              text=True,
          )
          if quality.returncode != 0 or quality.stdout.strip() or quality.stderr.strip():
              raise SystemExit("deterministic source quality check failed")

          escaping_links: list[str] = []
          for candidate in workspace.rglob("*"):
              if not candidate.is_symlink():
                  continue
              try:
                  candidate.resolve(strict=False).relative_to(workspace)
              except ValueError:
                  escaping_links.append(candidate.relative_to(workspace).as_posix())
          if escaping_links:
              raise SystemExit(f"repository contains escaping symlinks: {sorted(escaping_links)!r}")

          uses_pattern = re.compile(
              r"^\s*(?:-\s*)?uses:\s*['\"]?([^'\"\s#]+)", re.MULTILINE
          )
          unpinned: list[str] = []
          workflow_roots = (workspace / ".github" / "workflows", workspace / ".github" / "actions")
          for root in workflow_roots:
              if not root.exists():
                  continue
              for workflow in sorted((*root.rglob("*.yml"), *root.rglob("*.yaml"))):
                  for reference in uses_pattern.findall(workflow.read_text(encoding="utf-8")):
                      if reference.startswith("./"):
                          continue
                      if reference.startswith("docker://"):
                          if re.fullmatch(
                              r"docker://[^@\s]+@sha256:[0-9a-f]{64}", reference
                          ) is None:
                              unpinned.append(f"{workflow.relative_to(workspace)}:{reference}")
                          continue
                      if re.fullmatch(r"[^@\s]+@[0-9a-f]{40}", reference) is None:
                          unpinned.append(f"{workflow.relative_to(workspace)}:{reference}")
          if unpinned:
              raise SystemExit(
                  "remote GitHub Actions must use full commit SHAs and docker actions must "
                  f"use sha256 digests: {unpinned!r}"
              )

          def canonical_bytes(value: object) -> bytes:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode("utf-8")

          def usage_event_set_digest(event_ids: list[str]) -> str:
              normalized = sorted(event_ids)
              return hashlib.sha256(
                  json.dumps(
                      {
                          "event_ids": normalized,
                          "schema": "agt.usage-ledger/event-set/v1",
                      },
                      sort_keys=True,
                      separators=(",", ":"),
                      ensure_ascii=True,
                      allow_nan=False,
                  ).encode("utf-8")
              ).hexdigest()

          def write_json(path: Path, value: object) -> None:
              path.write_bytes(canonical_bytes(value) + b"\n")

          assembly_time = datetime.now(UTC)
          generated_at = assembly_time.isoformat().replace("+00:00", "Z")
          quality_report = {
              "schema": "agt.ci-quality-metadata/v1",
              "metadata_id": "central-source-quality",
              "classification": "central_quality_metadata",
              "source_revision": source,
              "base_revision": base,
              "gate_result": False,
              "observations": {
                  "checkout_binding": True,
                  "base_binding": True,
                  "patch_whitespace_errors": 0,
              },
          }
          security_report = {
              "schema": "agt.ci-check-result/v1",
              "check_id": "central-source-security",
              "source_revision": source,
              "base_revision": base,
              "status": "passed",
              "checks": {
                  "dependency_review": (
                      "passed" if os.environ["EVENT_NAME"] == "pull_request" else "not_applicable"
                  ),
                  "escaping_symlinks": 0,
                  "unpinned_remote_actions": 0,
              },
          }
          provenance = {
              "schema": "agt.ci-provenance/v1",
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_revision": source,
              "base_revision": base,
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "attestation_expected": attestation_expected,
              "attested": False,
              "network_pyrit_executed": False,
          }
          write_json(evidence_dir / "quality-report.json", quality_report)
          write_json(evidence_dir / "security-report.json", security_report)

          def load_json(path: Path) -> object:
              def unique_object(pairs: list[tuple[str, object]]) -> dict[str, object]:
                  result: dict[str, object] = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(f"duplicate JSON key {key!r}")
                      result[key] = value
                  return result

              return json.loads(
                  path.read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite number {value}")
                  ),
              )

          caller_records: list[dict[str, object]] = []
          command_evidence_fields = {
