              "architecture",
              "contract",
              "documentation",
              "end_to_end",
              "integration",
              "performance",
              "property",
              "security",
              "unit",
          }

          def is_canonical_nonempty_string(value: object) -> bool:
              return isinstance(value, str) and bool(value) and value == value.strip()

          def is_canonical_identifier_list(value: object) -> bool:
              return (
                  isinstance(value, list)
                  and all(
                      isinstance(item, str) and item == item.strip()
                      for item in value
                  )
                  and value == sorted(set(value))
              )

          def parse_canonical_timestamp(value: object) -> datetime | None:
              if not isinstance(value, str) or not value.endswith("Z"):
                  return None
              try:
                  timestamp = datetime.fromisoformat(value[:-1] + "+00:00")
              except ValueError:
                  return None
              if timestamp.utcoffset() is None:
                  return None
              normalized = timestamp.astimezone(UTC).isoformat().replace("+00:00", "Z")
              return timestamp if value == normalized else None

          def is_canonical_timestamp(value: object) -> bool:
              return parse_canonical_timestamp(value) is not None

          def parse_iso_utc_timestamp(value: object) -> datetime | None:
              if not isinstance(value, str):
                  return None
              try:
                  timestamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if timestamp.utcoffset() != timedelta(0):
                  return None
              normalized = timestamp.astimezone(UTC).isoformat()
              return timestamp if value == normalized else None

          def require_contract(condition: bool, message: str) -> None:
              if not condition:
                  raise ValueError(message)

          def require_exact_fields(
              value: object,
              fields: set[str],
              *,
              name: str,
          ) -> dict[str, object]:
              require_contract(
                  isinstance(value, dict) and set(value) == fields,
                  f"{name} must contain exactly the required fields",
              )
              assert isinstance(value, dict)
              return value

          def require_nonempty_string(value: object, *, name: str) -> str:
              require_contract(
                  isinstance(value, str)
                  and bool(value)
                  and value == value.strip()
                  and len(value) <= 256,
                  f"{name} must be a bounded canonical string",
              )
              assert isinstance(value, str)
              return value

          def require_safe_id(value: object, *, name: str, run_id: bool = False) -> str:
              result = require_nonempty_string(value, name=name)
              pattern = (
                  r"RUN-[A-Za-z0-9][A-Za-z0-9._-]{0,95}"
                  if run_id
                  else r"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}"
              )
              require_contract(re.fullmatch(pattern, result) is not None, f"{name} is invalid")
              return result

          def require_digest(value: object, *, name: str) -> str:
              require_contract(
                  isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value) is not None,
                  f"{name} must be a lowercase SHA-256 digest",
              )
              assert isinstance(value, str)
              return value

          def require_integer(
              value: object,
              *,
              name: str,
              minimum: int = 0,
              maximum: int | None = None,
          ) -> int:
              require_contract(
                  type(value) is int
                  and value >= minimum
                  and (maximum is None or value <= maximum),
                  f"{name} must be a bounded integer",
              )
              assert isinstance(value, int)
              return value

          def require_decimal(value: object, *, name: str) -> Decimal:
              require_contract(isinstance(value, str), f"{name} must be a decimal JSON string")
              try:
                  result = Decimal(value)
              except (InvalidOperation, ValueError) as exc:
                  raise ValueError(f"{name} must be a decimal JSON string") from exc
              require_contract(
                  result.is_finite() and result >= 0,
                  f"{name} must be finite and non-negative",
              )
              return result

          def require_string_list(
              value: object,
              *,
              name: str,
              nonempty: bool = False,
              allowed: set[str] | None = None,
          ) -> list[str]:
              require_contract(isinstance(value, list), f"{name} must be an array")
              assert isinstance(value, list)
              require_contract(
                  (not nonempty or bool(value))
                  and len(value) <= 256
                  and all(
                      isinstance(item, str)
                      and bool(item)
                      and item == item.strip()
                      and len(item) <= 256
                      for item in value
                  )
                  and value == sorted(set(value))
                  and (allowed is None or set(value) <= allowed),
                  f"{name} must be bounded, sorted, and unique",
              )
              return value

          manifest_fields = {
