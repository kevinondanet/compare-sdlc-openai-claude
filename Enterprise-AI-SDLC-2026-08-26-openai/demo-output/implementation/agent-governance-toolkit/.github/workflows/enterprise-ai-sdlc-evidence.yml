              "finding_set",
              "report_digest",
              "manifest_id",
              "manifest_digest",
              "run_id",
              "change_digest",
              "policy_digest",
              "review_assignment_id",
              "context_id",
              "workspace_key",
              "reviewer_model_id",
              "reviewer_model_family",
              "review_round_number",
              "request_digest",
              "issued_at",
              "expires_at",
              "attester_id",
              "attester_public_key",
              "attestation_signature",
              "semantic_digest",
          }
          review_finding_set_fields = {
              "schema_version",
              "findings",
              "finding_set_digest",
          }
          review_finding_fields = {
              "finding_id",
              "task_id",
              "path",
              "rule_id",
              "description_digest",
          }
          remediation_history_fields = {
              "schema_version",
              "assignment_id",
              "context_id",
              "workspace_key",
              "outcome_digest",
              "output_digest",
              "binding",
              "history_digest",
          }
          remediation_binding_fields = {
              "schema_version",
              "prior_review_assignment_id",
              "prior_review_outcome_digest",
              "finding_set",
              "task_ids",
              "paths",
              "binding_digest",
          }
          tool_scopes = {
              "administrative",
              "execute",
              "network",
              "read",
              "workspace_write",
          }
          prompt_fields = {"prompt_id", "version", "digest", "provenance"}

          def validate_prompt(value: object, *, name: str) -> dict[str, object]:
              prompt = require_exact_fields(value, prompt_fields, name=name)
              for field_name in ("prompt_id", "version", "provenance"):
                  require_nonempty_string(prompt[field_name], name=f"{name}.{field_name}")
              require_digest(prompt["digest"], name=f"{name}.digest")
              return prompt

          def canonical_relative_path(
              value: object,
              *,
              name: str,
              allow_root: bool = False,
          ) -> str:
              require_contract(
                  isinstance(value, str)
                  and bool(value)
                  and value == value.strip()
                  and len(value) <= 4096
                  and "\\" not in value
                  and "\x00" not in value,
                  f"{name} must be a canonical relative path",
              )
              assert isinstance(value, str)
              candidate = PurePosixPath(value)
              normalized = candidate.as_posix()
              require_contract(
                  not candidate.is_absolute()
                  and ".." not in candidate.parts
                  and normalized == value
                  and (allow_root or normalized != "."),
                  f"{name} must remain within the workspace",
              )
              return normalized

          def path_is_within_scope(path: str, scope: str) -> bool:
              path = canonical_relative_path(path, name="finding path")
              scope = canonical_relative_path(
                  scope,
                  name="remediation path scope",
                  allow_root=True,
              )
              if scope == ".":
                  return True
              path_parts = PurePosixPath(path).parts
              scope_parts = PurePosixPath(scope).parts
              return path_parts[: len(scope_parts)] == scope_parts

          def validate_route_profile(
              value: object,
              *,
              expected_use_case: str,
          ) -> dict[str, object]:
              profile = require_exact_fields(
                  value,
                  route_profile_fields,
                  name=f"{expected_use_case} route profile",
              )
              require_nonempty_string(profile["task_type"], name="route profile.task_type")
              require_contract(
                  profile["use_case"] == expected_use_case,
                  "route profile use_case does not match its protected role",
              )
              require_integer(
                  profile["context_tokens"],
                  name="route profile.context_tokens",
                  minimum=1,
              )
              usage = require_exact_fields(
                  profile["estimated_usage"],
                  token_estimate_fields,
                  name="route profile.estimated_usage",
              )
              token_total = sum(
                  require_integer(usage[field], name=f"estimated usage.{field}")
                  for field in sorted(token_estimate_fields)
              )
              require_contract(token_total > 0, "estimated token usage must be non-zero")
              require_integer(
                  profile["max_benchmark_age_seconds"],
                  name="route profile.max_benchmark_age_seconds",
                  minimum=1,
              )
              require_integer(
                  profile["max_tier"],
                  name="route profile.max_tier",
                  maximum=2,
              )
              require_string_list(
                  profile["required_capabilities"],
                  name="route profile.required_capabilities",
              )
              min_quality = require_decimal(
                  profile["min_quality"], name="route profile.min_quality"
              )
              require_contract(min_quality <= 1, "route profile minimum quality exceeds one")
              if profile["max_latency_ms"] is not None:
                  require_decimal(
                      profile["max_latency_ms"],
                      name="route profile.max_latency_ms",
                  )
              return profile

          def estimated_route_cost(
              route: dict[str, object],
              profile: dict[str, object],
          ) -> Decimal:
              usage = profile["estimated_usage"]
              assert isinstance(usage, dict)
              rates = (
                  ("input_tokens", "price_input_per_million"),
                  ("output_tokens", "price_output_per_million"),
                  ("cached_input_tokens", "price_cached_input_per_million"),
                  ("reasoning_tokens", "price_reasoning_per_million"),
              )
              total = Decimal("0")
              for token_field, rate_field in rates:
                  tokens = require_integer(
                      usage[token_field], name=f"estimated usage.{token_field}"
                  )
                  if tokens == 0:
                      continue
                  require_contract(
                      route[rate_field] is not None,
                      f"route lacks a price for non-zero {token_field}",
                  )
                  total += (
                      Decimal(tokens)
                      * require_decimal(route[rate_field], name=f"route.{rate_field}")
                      / Decimal(1_000_000)
                  )
              return total

          def verify_ed25519(
              *,
              public_key: str,
              signature: str,
              payload: bytes,
          ) -> bool:
              if (
                  re.fullmatch(r"[0-9a-f]{64}", public_key) is None
                  or re.fullmatch(r"[0-9a-f]{128}", signature) is None
              ):
                  return False
              public_der = bytes.fromhex("302a300506032b6570032100" + public_key)
              with tempfile.TemporaryDirectory(prefix="agt-review-attestation-") as directory:
                  root = Path(directory)
                  public_path = root / "public.der"
                  payload_path = root / "payload.bin"
                  signature_path = root / "signature.bin"
                  public_path.write_bytes(public_der)
                  payload_path.write_bytes(payload)
                  signature_path.write_bytes(bytes.fromhex(signature))
                  verification = subprocess.run(
                      [
                          "openssl",
                          "pkeyutl",
                          "-verify",
                          "-pubin",
                          "-keyform",
                          "DER",
                          "-inkey",
                          str(public_path),
                          "-rawin",
                          "-in",
                          str(payload_path),
                          "-sigfile",
                          str(signature_path),
                      ],
                      check=False,
                      capture_output=True,
                  )
              return verification.returncode == 0

          def validate_route(route_value: object) -> tuple[Decimal, str]:
              route = require_exact_fields(route_value, route_fields, name="route")
              for field_name in (
                  "provider",
                  "provider_family",
                  "model",
                  "version",
                  "deployment",
                  "benchmark_id",
                  "benchmark_provenance",
                  "price_provenance",
              ):
                  require_nonempty_string(route[field_name], name=f"route.{field_name}")
              require_integer(route["model_tier"], name="route.model_tier", maximum=2)
              registry_record = require_exact_fields(
                  route["registry_record"],
                  registry_record_fields,
                  name="route.registry_record",
              )
              for field_name in (
                  "provider",
                  "provider_family",
                  "model",
                  "version",
                  "deployment",
              ):
                  require_nonempty_string(
                      registry_record[field_name],
                      name=f"route.registry_record.{field_name}",
                  )
                  require_contract(
                      registry_record[field_name] == route[field_name],
                      f"route.registry_record.{field_name} does not match the route",
                  )
              registry_tier = require_integer(
                  registry_record["model_tier"],
                  name="route.registry_record.model_tier",
                  maximum=2,
              )
              require_contract(
                  registry_tier == route["model_tier"],
                  "route.registry_record.model_tier does not match the route",
              )
              require_integer(
                  registry_record["max_context_tokens"],
                  name="route.registry_record.max_context_tokens",
                  minimum=1,
              )
              for field_name in (
                  "capabilities",
                  "allowed_tools",
                  "allowed_risk_levels",
                  "allowed_use_cases",
              ):
                  require_string_list(
                      registry_record[field_name],
                      name=f"route.registry_record.{field_name}",
                      nonempty=field_name in {"allowed_risk_levels", "allowed_use_cases"},
                  )
              require_contract(
                  registry_record["enabled"] is True,
                  "route.registry_record must be enabled",
              )
              benchmark_quality = require_decimal(
                  route["benchmark_quality"], name="route.benchmark_quality"
              )
              require_contract(
                  benchmark_quality <= 1,
                  "route.benchmark_quality must not exceed one",
              )
              require_decimal(route["benchmark_latency_ms"], name="route.benchmark_latency_ms")
              measured_at = parse_canonical_timestamp(route["benchmark_measured_at"])
              require_contract(measured_at is not None, "route benchmark time is invalid")
              valid_until_value = route["benchmark_valid_until"]
              valid_until = (
                  None
                  if valid_until_value is None
                  else parse_canonical_timestamp(valid_until_value)
              )
              require_contract(
                  valid_until_value is None
                  or (valid_until is not None and valid_until > measured_at),
                  "route benchmark validity window is invalid",
              )
              require_integer(
                  route["benchmark_sample_size"],
                  name="route.benchmark_sample_size",
                  minimum=1,
              )
              effective_from = parse_canonical_timestamp(route["price_effective_from"])
              require_contract(effective_from is not None, "route price time is invalid")
              effective_to_value = route["price_effective_to"]
              effective_to = (
                  None
                  if effective_to_value is None
                  else parse_canonical_timestamp(effective_to_value)
              )
              require_contract(
                  effective_to_value is None
                  or (effective_to is not None and effective_to > effective_from),
                  "route price validity window is invalid",
              )
              input_rate = require_decimal(
                  route["price_input_per_million"], name="route.price_input_per_million"
              )
              output_rate = require_decimal(
                  route["price_output_per_million"], name="route.price_output_per_million"
              )
              optional_rates: list[Decimal | None] = []
              for field_name in (
                  "price_cached_input_per_million",
                  "price_reasoning_per_million",
              ):
                  value = route[field_name]
                  optional_rates.append(
                      None if value is None else require_decimal(value, name=f"route.{field_name}")
                  )
              price_digest = require_digest(
                  route["price_record_digest"], name="route.price_record_digest"
              )

              def rate_text(value: Decimal | None) -> str | None:
                  if value is None:
                      return None
                  return "0" if value == 0 else format(value.normalize(), "f")

              assert measured_at is not None
              assert effective_from is not None
              price_payload = {
                  "schema": "agt.model-price-record/v1",
                  "identity": {
                      "provider": route["provider"],
                      "provider_family": route["provider_family"],
                      "model": route["model"],
                      "version": route["version"],
                      "deployment": route["deployment"],
                  },
                  "effective_from": effective_from.isoformat(timespec="microseconds"),
                  "effective_to": (
                      None
                      if effective_to is None
                      else effective_to.isoformat(timespec="microseconds")
                  ),
                  "input_per_million": rate_text(input_rate),
                  "output_per_million": rate_text(output_rate),
                  "cached_input_per_million": rate_text(optional_rates[0]),
                  "reasoning_per_million": rate_text(optional_rates[1]),
                  "provenance": route["price_provenance"],
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(price_payload)).hexdigest() == price_digest,
                  "route.price_record_digest does not match the selected price facts",
              )
              estimated_cost = require_decimal(
                  route["estimated_cost_usd"], name="route.estimated_cost_usd"
              )
              require_integer(
                  route["qualifying_models"], name="route.qualifying_models", minimum=1
              )
              return estimated_cost, str(route["provider_family"])

          def validate_tool_governance(
              value: object,
              *,
              manifest_allowed_scopes: list[str],
          ) -> dict[str, dict[str, list[str]]]:
              policy = require_exact_fields(
                  value, tool_governance_fields, name="manifest.tool_governance"
              )
              role_values = policy["role_policies"]
              require_contract(
                  isinstance(role_values, list) and len(role_values) == 2,
                  "tool governance must define exactly two role policies",
              )
              assert isinstance(role_values, list)
              role_capabilities: dict[str, dict[str, list[str]]] = {}
              for index, role_value in enumerate(role_values):
                  role_policy = require_exact_fields(
                      role_value,
                      role_tool_policy_fields,
                      name=f"tool governance role {index}",
                  )
                  role = role_policy["role"]
                  require_contract(
                      role
                      == ("independent_review" if index == 0 else "implementation"),
                      "tool governance roles are missing or non-canonical",
                  )
                  tools = require_string_list(
                      role_policy["allowed_tools"],
                      name=f"tool governance {role} tools",
                      nonempty=True,
                  )
                  require_contract(
                      all(
                          re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}", tool)
                          is not None
                          for tool in tools
                      ),
                      "tool governance contains an invalid tool name",
                  )
                  actions = require_string_list(
                      role_policy["allowed_actions"],
                      name=f"tool governance {role} actions",
                      nonempty=True,
                      allowed={
                          "administrative",
                          "execute",
                          "network",
                          "read",
                          "secret_access",
                          "write",
                      },
                  )
                  scopes = require_string_list(
                      role_policy["allowed_scopes"],
                      name=f"tool governance {role} scopes",
                      nonempty=True,
                      allowed=tool_scopes,
                  )
                  require_contract(
                      set(scopes) <= set(manifest_allowed_scopes),
                      "role tool scopes exceed the manifest scope allowlist",
                  )
                  role_capabilities[str(role)] = {
                      "tools": tools,
                      "actions": actions,
                      "scopes": scopes,
                  }

              command_prefixes = policy["allowed_command_prefixes"]
              require_contract(
                  isinstance(command_prefixes, list)
                  and len(command_prefixes) <= 256,
                  "allowed command prefixes must be a bounded array",
              )
              assert isinstance(command_prefixes, list)
              normalized_prefixes: list[tuple[str, ...]] = []
              for prefix in command_prefixes:
                  require_contract(
                      isinstance(prefix, list)
                      and bool(prefix)
                      and all(
                          isinstance(token, str)
                          and bool(token)
                          and token == token.strip()
                          and all(ord(char) >= 32 for char in token)
                          for token in prefix
                      ),
                      "allowed command prefix contains an invalid argv token",
                  )
                  normalized_prefixes.append(tuple(str(token) for token in prefix))
              require_contract(
                  normalized_prefixes == sorted(set(normalized_prefixes)),
                  "allowed command prefixes are not sorted and unique",
              )
              network_hosts = require_string_list(
                  policy["allowed_network_hosts"],
                  name="tool governance network hosts",
              )
              require_contract(
                  all(
                      host == host.lower()
                      and re.fullmatch(
                          r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)"
                          r"(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))*",
                          host,
                      )
                      is not None
                      for host in network_hosts
                  ),
                  "tool governance contains an invalid network hostname",
              )
              secret_references = require_string_list(
                  policy["allowed_secret_references"],
                  name="tool governance secret references",
              )
              for reference in secret_references:
                  require_safe_id(reference, name="tool governance secret reference")
              action_values = {
                  "administrative",
                  "execute",
                  "network",
                  "read",
                  "secret_access",
                  "write",
              }
              approval_actions = require_string_list(
                  policy["approval_required_actions"],
                  name="tool governance approval actions",
                  allowed=action_values,
              )
              privileged_actions = require_string_list(
                  policy["privileged_actions"],
                  name="tool governance privileged actions",
                  allowed=action_values,
              )
              mandatory_privileged = {
                  "administrative",
                  "execute",
                  "network",
                  "secret_access",
              }
              require_contract(
                  mandatory_privileged <= set(privileged_actions)
                  and set(privileged_actions) <= set(approval_actions),
                  "privileged tool actions must be audited and approval-gated",
              )
              require_integer(
                  policy["max_result_bytes"],
                  name="tool governance maximum result bytes",
                  minimum=1,
                  maximum=16 * 1024 * 1024,
              )
              blocked = require_string_list(
                  policy["blocked_result_substrings"],
                  name="tool governance blocked result substrings",
              )
              require_contract(
                  all(
                      item == item.lower()
                      and len(item.encode("utf-8")) <= 512
                      for item in blocked
                  )
                  and policy["require_relative_workspace_paths"] is True
                  and policy["require_https_network"] is True,
                  "tool result screening or path/network invariants are invalid",
              )
              return role_capabilities

          def validate_assignment(
              assignment_value: object,
              *,
              expected_role: str,
              route_profile: dict[str, object],
              planned_at: datetime,
              reservation_ttl_seconds: int,
              manifest_change_id: str,
              limits: dict[str, object],
              manifest_allowed_scopes: list[str],
              role_allowed_scopes: list[str],
          ) -> tuple[dict[str, object], Decimal, Decimal]:
              assignment = require_exact_fields(
                  assignment_value, assignment_fields, name="assignment"
              )
              assignment_id = require_safe_id(
                  assignment["assignment_id"], name="assignment.assignment_id"
              )
              require_contract(
                  assignment["role"] == expected_role,
                  "assignment role does not match its manifest position",
              )
              contract_tasks = require_string_list(
                  assignment["contract_task_ids"],
                  name="assignment.contract_task_ids",
                  nonempty=True,
              )
              if expected_role == "implementation":
                  require_contract(
                      len(contract_tasks) == 1,
                      "implementation assignment must bind one contract task",
                  )
              dependencies = require_string_list(
                  assignment["depends_on_assignment_ids"],
                  name="assignment.depends_on_assignment_ids",
              )
              del dependencies
              require_integer(assignment["schedule_index"], name="assignment.schedule_index")
              require_integer(
                  assignment["dependency_wave_index"],
                  name="assignment.dependency_wave_index",
              )
              require_safe_id(assignment["context_id"], name="assignment.context_id")
              require_safe_id(assignment["workspace_key"], name="assignment.workspace_key")
              require_contract(
                  assignment["fresh_context"] is True
                  and assignment["isolated_workspace"] is True,
                  "assignments must require fresh context and isolated workspace",
              )
              scopes = require_string_list(
                  assignment["tool_scopes"],
                  name="assignment.tool_scopes",
                  allowed=tool_scopes,
              )
              require_contract(
                  set(scopes) <= set(manifest_allowed_scopes)
                  and set(scopes) <= set(role_allowed_scopes),
                  "assignment tool scopes exceed manifest or role tool policy",
              )
              if expected_role == "independent_review":
                  require_contract(scopes == ["read"], "review assignment must be read-only")
              remediation_scopes = require_string_list(
                  assignment["remediation_path_scopes"],
                  name="assignment.remediation_path_scopes",
                  nonempty=expected_role == "remediation",
              )
              for path_scope in remediation_scopes:
                  canonical_relative_path(
                      path_scope,
                      name="assignment remediation path scope",
                      allow_root=True,
                  )
              if expected_role == "remediation":
                  require_contract(
                      scopes == ["read", "workspace_write"],
                      "remediation assignment must have exact read/write workspace scope",
                  )
              else:
                  require_contract(
                      remediation_scopes == [],
                      "non-remediation assignment cannot carry remediation path authority",
                  )
              require_integer(
                  assignment["risk_tier"], name="assignment.risk_tier", maximum=4
              )
              max_turns = require_integer(
                  assignment["max_turns"], name="assignment.max_turns", minimum=1
              )
              max_tool_calls = require_integer(
                  assignment["max_tool_calls"], name="assignment.max_tool_calls"
              )
              max_cost = require_decimal(
                  assignment["max_cost_usd"], name="assignment.max_cost_usd"
              )
              validate_prompt(assignment["prompt"], name="assignment.prompt")
              require_contract(
                  max_turns == limits["max_turns_per_assignment"]
                  and max_tool_calls == limits["max_tool_calls_per_assignment"]
                  and max_cost == require_decimal(
                      limits["max_cost_per_assignment_usd"],
                      name="limits.max_cost_per_assignment_usd",
                  ),
                  "assignment ceilings do not match manifest limits",
              )
              estimated_cost, _provider_family = validate_route(assignment["route"])
              route = assignment["route"]
              assert isinstance(route, dict)
              benchmark_measured_at = parse_canonical_timestamp(
                  route["benchmark_measured_at"]
              )
              benchmark_valid_until = (
                  None
                  if route["benchmark_valid_until"] is None
                  else parse_canonical_timestamp(route["benchmark_valid_until"])
              )
              price_effective_from = parse_canonical_timestamp(
                  route["price_effective_from"]
              )
              price_effective_to = (
                  None
                  if route["price_effective_to"] is None
                  else parse_canonical_timestamp(route["price_effective_to"])
              )
              require_contract(
                  benchmark_measured_at is not None
                  and benchmark_measured_at <= planned_at
                  and planned_at - benchmark_measured_at
                  <= timedelta(
                      seconds=int(route_profile["max_benchmark_age_seconds"])
                  )
                  and (
                      benchmark_valid_until is None
                      or planned_at < benchmark_valid_until
                  )
                  and price_effective_from is not None
                  and price_effective_from <= planned_at
                  and (price_effective_to is None or planned_at < price_effective_to),
                  "assignment route evidence is not effective at manifest planning time",
              )
              registry = route["registry_record"]
              assert isinstance(registry, dict)
              require_contract(
                  int(route["model_tier"]) <= int(route_profile["max_tier"])
                  and int(route_profile["context_tokens"])
                  <= int(registry["max_context_tokens"])
                  and set(route_profile["required_capabilities"])
                  <= set(registry["capabilities"])
                  and set(scopes) <= set(registry["allowed_tools"])
                  and f"tier-{assignment['risk_tier']}"
                  in registry["allowed_risk_levels"]
                  and route_profile["use_case"] in registry["allowed_use_cases"]
                  and require_decimal(
                      route["benchmark_quality"], name="route.benchmark_quality"
                  )
                  >= require_decimal(
                      route_profile["min_quality"],
                      name="route profile.min_quality",
                  )
                  and (
                      route_profile["max_latency_ms"] is None
                      or require_decimal(
                          route["benchmark_latency_ms"],
                          name="route.benchmark_latency_ms",
                      )
                      <= require_decimal(
                          route_profile["max_latency_ms"],
                          name="route profile.max_latency_ms",
                      )
                  ),
                  "assignment route violates its protected route profile",
              )
              require_contract(
                  estimated_cost == estimated_route_cost(route, route_profile),
                  "assignment route estimate does not match protected usage and price",
              )
              require_contract(
                  estimated_cost <= max_cost,
                  "assignment route exceeds its cost ceiling",
              )
              reservation = require_exact_fields(
                  assignment["reservation"], reservation_fields, name="assignment.reservation"
              )
              require_contract(
                  reservation["schema_version"] == "agt.usage-reservation-plan/v1",
                  "reservation schema is invalid",
              )
              require_safe_id(
                  reservation["reservation_id"], name="assignment.reservation.reservation_id"
              )
              attribution = require_exact_fields(
                  reservation["attribution"], attribution_fields, name="reservation.attribution"
              )
              for field_name in attribution_fields:
                  require_nonempty_string(
                      attribution[field_name], name=f"reservation.attribution.{field_name}"
                  )
              require_contract(
                  attribution["change_id"] == manifest_change_id
                  and attribution["task_id"] == assignment_id,
                  "reservation attribution is not assignment/change bound",
              )
              amount = require_decimal(
                  reservation["amount_usd"], name="assignment.reservation.amount_usd"
              )
              require_contract(
                  amount == estimated_cost,
                  "reservation amount does not match route estimate",
              )
              reserved_at = parse_canonical_timestamp(reservation["reserved_at"])
              expires_at = parse_canonical_timestamp(reservation["expires_at"])
              require_contract(
                  reserved_at == planned_at
                  and expires_at is not None
                  and int((expires_at - planned_at).total_seconds())
                  == reservation_ttl_seconds,
                  "reservation window does not match manifest planning policy",
              )
              require_string_list(
                  assignment["checkpoint_ids"], name="assignment.checkpoint_ids"
              )
              return assignment, estimated_cost, max_cost

          def validate_orchestration_manifest(
              manifest_value: object,
          ) -> tuple[dict[str, object], str, list[tuple[str, str]], dict[str, Decimal]]:
              manifest = require_exact_fields(
                  manifest_value, manifest_fields, name="orchestration manifest"
              )
              require_contract(
                  manifest["schema_version"] == "agt.orchestration-manifest/v1",
                  "orchestration manifest schema is invalid",
              )
              require_safe_id(manifest["manifest_id"], name="manifest.manifest_id")
              require_safe_id(manifest["run_id"], name="manifest.run_id", run_id=True)
              planned_at = parse_canonical_timestamp(manifest["planned_at"])
              require_contract(planned_at is not None, "manifest.planned_at is invalid")
              assert planned_at is not None
              require_safe_id(manifest["policy_id"], name="manifest.policy_id")
              require_digest(manifest["policy_digest"], name="manifest.policy_digest")
              require_contract(
                  manifest["change_id"] == change_id
                  and manifest["change_digest"] == change_digest
                  and manifest["source_revision"] == source,
                  "orchestration manifest is not bound to the canonical change and source",
              )
              require_digest(manifest["change_digest"], name="manifest.change_digest")
              limits = require_exact_fields(manifest["limits"], limit_fields, name="limits")
              require_integer(
                  limits["max_turns_per_assignment"],
                  name="limits.max_turns_per_assignment",
                  minimum=1,
              )
              require_integer(
                  limits["max_tool_calls_per_assignment"],
                  name="limits.max_tool_calls_per_assignment",
              )
              max_parallel = require_integer(
                  limits["max_parallel_agents"],
                  name="limits.max_parallel_agents",
                  minimum=1,
                  maximum=256,
              )
              require_integer(
                  limits["max_assignment_duration_seconds"],
                  name="limits.max_assignment_duration_seconds",
                  minimum=1,
                  maximum=86_400,
              )
              max_review_rounds = require_integer(
                  limits["max_review_rounds"],
                  name="limits.max_review_rounds",
                  minimum=1,
                  maximum=32,
              )
              max_assignment_cost = require_decimal(
                  limits["max_cost_per_assignment_usd"],
                  name="limits.max_cost_per_assignment_usd",
              )
              max_total_cost = require_decimal(
                  limits["max_total_cost_usd"], name="limits.max_total_cost_usd"
              )
              require_contract(
                  max_assignment_cost <= max_total_cost,
                  "manifest assignment cost ceiling exceeds total ceiling",
              )
              implementation_profile = validate_route_profile(
                  manifest["implementation_route"],
                  expected_use_case="implementation",
              )
              review_profile = validate_route_profile(
                  manifest["review_route"],
                  expected_use_case="independent_review",
              )
              allowed_scopes = require_string_list(
                  manifest["allowed_tool_scopes"],
                  name="manifest.allowed_tool_scopes",
                  allowed=tool_scopes,
              )
              checkpoint_scopes = require_string_list(
                  manifest["checkpoint_tool_scopes"],
                  name="manifest.checkpoint_tool_scopes",
                  allowed=tool_scopes,
              )
              require_contract(
                  "read" in allowed_scopes
                  and set(checkpoint_scopes) <= set(allowed_scopes)
                  and ({"administrative", "network"} & set(allowed_scopes))
                  <= set(checkpoint_scopes),
                  "manifest tool scope policy is invalid",
              )
              role_tool_scopes = validate_tool_governance(
                  manifest["tool_governance"],
                  manifest_allowed_scopes=allowed_scopes,
              )
              require_integer(
                  manifest["checkpoint_min_risk_tier"],
                  name="manifest.checkpoint_min_risk_tier",
                  maximum=3,
              )
              reservation_ttl = require_integer(
                  manifest["reservation_ttl_seconds"],
                  name="manifest.reservation_ttl_seconds",
                  minimum=1,
                  maximum=86_400,
              )
              review_attestation_ttl = require_integer(
                  manifest["review_attestation_ttl_seconds"],
                  name="manifest.review_attestation_ttl_seconds",
                  minimum=1,
                  maximum=3_600,
              )
              del review_attestation_ttl
              remediation_path_scopes = require_string_list(
                  manifest["remediation_path_scopes"],
                  name="manifest.remediation_path_scopes",
                  nonempty=True,
              )
              for path_scope in remediation_path_scopes:
                  canonical_relative_path(
                      path_scope,
                      name="manifest remediation path scope",
                      allow_root=True,
                  )
              attesters_value = manifest["trusted_review_attesters"]
              require_contract(
                  isinstance(attesters_value, list)
                  and 1 <= len(attesters_value) <= 64,
                  "manifest must pin a bounded non-empty review attester set",
              )
              assert isinstance(attesters_value, list)
              attester_identities: list[tuple[str, str]] = []
              for attester_value in attesters_value:
                  attester = require_exact_fields(
                      attester_value,
                      review_attester_fields,
                      name="trusted review attester",
                  )
                  attester_id = require_nonempty_string(
                      attester["attester_id"], name="review attester.attester_id"
                  )
                  public_key = require_digest(
                      attester["public_key"], name="review attester.public_key"
                  )
                  attester_identities.append((attester_id, public_key))
              require_contract(
                  attester_identities == sorted(set(attester_identities))
                  and len({item[0] for item in attester_identities})
                  == len(attester_identities),
                  "trusted review attesters must be ordered with unique ids",
              )
              waves = manifest["execution_waves"]
              require_contract(
                  isinstance(waves, list) and 1 <= len(waves) <= 256,
                  "manifest.execution_waves must be a bounded non-empty array",
              )
              assert isinstance(waves, list)
              implementation_assignments: list[dict[str, object]] = []
              assignment_roles: list[tuple[str, str]] = []
              assignment_cost_limits: dict[str, Decimal] = {}
              estimated_costs: list[Decimal] = []
              wave_keys: list[tuple[int, int]] = []
              for expected_schedule, wave_value in enumerate(waves):
                  wave = require_exact_fields(wave_value, wave_fields, name="execution wave")
                  schedule_index = require_integer(
                      wave["schedule_index"], name="wave.schedule_index"
                  )
                  dependency_index = require_integer(
                      wave["dependency_wave_index"],
                      name="wave.dependency_wave_index",
                  )
                  batch_index = require_integer(wave["batch_index"], name="wave.batch_index")
                  require_contract(
                      schedule_index == expected_schedule,
                      "execution wave schedule indexes must be contiguous",
                  )
                  wave_keys.append((dependency_index, batch_index))
                  assignments = wave["assignments"]
                  require_contract(
                      isinstance(assignments, list)
                      and 1 <= len(assignments) <= max_parallel,
                      "execution wave exceeds the parallel assignment ceiling",
                  )
                  assert isinstance(assignments, list)
                  wave_assignment_ids: list[str] = []
                  for assignment_value in assignments:
                      assignment, estimated_cost, max_cost = validate_assignment(
                          assignment_value,
                          expected_role="implementation",
                          route_profile=implementation_profile,
                          planned_at=planned_at,
                          reservation_ttl_seconds=reservation_ttl,
                          manifest_change_id=change_id,
                          limits=limits,
                          manifest_allowed_scopes=allowed_scopes,
                          role_allowed_scopes=role_tool_scopes["implementation"][
                              "scopes"
                          ],
                      )
                      require_contract(
                          assignment["schedule_index"] == schedule_index
                          and assignment["dependency_wave_index"] == dependency_index,
                          "assignment indexes do not match the execution wave",
                      )
                      assignment_id = str(assignment["assignment_id"])
                      implementation_assignments.append(assignment)
                      wave_assignment_ids.append(assignment_id)
                      assignment_roles.append((assignment_id, "implementation"))
                      assignment_cost_limits[assignment_id] = max_cost
                      estimated_costs.append(estimated_cost)
                  require_contract(
                      wave_assignment_ids == sorted(wave_assignment_ids),
                      "wave assignments must be ordered by assignment_id",
                  )
              require_contract(
                  len(implementation_assignments) <= 256
                  and wave_keys == sorted(wave_keys),
                  "manifest dependency waves are not canonically bounded",
              )
              dependency_wave_ids = sorted({key[0] for key in wave_keys})
              require_contract(
                  dependency_wave_ids == list(range(len(dependency_wave_ids))),
                  "dependency wave indexes must be contiguous",
              )
              for dependency_index in dependency_wave_ids:
                  batches = [key[1] for key in wave_keys if key[0] == dependency_index]
                  require_contract(
                      batches == list(range(len(batches))),
                      "batch indexes must be contiguous within dependency waves",
                  )
              implementation_ids = [
                  str(assignment["assignment_id"])
                  for assignment in implementation_assignments
              ]
              require_contract(
                  len(implementation_ids) == len(set(implementation_ids)),
                  "implementation assignment ids must be unique",
              )
              seen: set[str] = set()
              for assignment in implementation_assignments:
                  dependencies = set(assignment["depends_on_assignment_ids"])
                  require_contract(
                      dependencies <= seen,
                      "assignment dependency is not in an earlier execution wave",
                  )
                  seen.add(str(assignment["assignment_id"]))

              review, review_estimated_cost, review_max_cost = validate_assignment(
                  manifest["review_assignment"],
                  expected_role="independent_review",
                  route_profile=review_profile,
                  planned_at=planned_at,
                  reservation_ttl_seconds=reservation_ttl,
                  manifest_change_id=change_id,
                  limits=limits,
                  manifest_allowed_scopes=allowed_scopes,
                  role_allowed_scopes=role_tool_scopes["independent_review"][
                      "scopes"
                  ],
              )
              review_id = str(review["assignment_id"])
              require_contract(
                  review_id not in set(implementation_ids)
                  and review["schedule_index"] == len(waves)
                  and review["dependency_wave_index"] == max(dependency_wave_ids) + 1
                  and review["depends_on_assignment_ids"] == sorted(implementation_ids),
                  "review assignment is not bound after all implementation assignments",
              )
              implementation_families = {
                  str(assignment["route"]["provider_family"])
                  for assignment in implementation_assignments
              }
              require_contract(
                  review["route"]["provider_family"] not in implementation_families,
                  "review provider family is not independent of implementation",
              )
              task_ids = sorted(
                  str(task_id)
                  for assignment in implementation_assignments
                  for task_id in assignment["contract_task_ids"]
              )
              require_contract(
                  len(task_ids) == len(set(task_ids))
                  and review["contract_task_ids"] == task_ids,
                  "review assignment does not cover the exact implementation task set",
              )
              assignment_roles.append((review_id, "independent_review"))
              assignment_cost_limits[review_id] = review_max_cost
              estimated_costs.append(review_estimated_cost)
              conditional_value = manifest["conditional_review_rounds"]
              require_contract(
                  isinstance(conditional_value, list)
                  and len(conditional_value) == max_review_rounds - 1,
                  "manifest must predeclare every allowed conditional review round",
              )
              assert isinstance(conditional_value, list)
              conditional_rounds: list[dict[str, object]] = []
              conditional_assignments: list[dict[str, object]] = []
              review_ids = [review_id]
              prior_review = review
              for conditional_offset, conditional_round_value in enumerate(
                  conditional_value
              ):
                  conditional = require_exact_fields(
                      conditional_round_value,
                      conditional_review_round_fields,
                      name="conditional review round",
                  )
                  round_number = require_integer(
                      conditional["round_number"],
                      name="conditional review round number",
                      minimum=2,
                      maximum=32,
                  )
                  require_contract(
                      round_number == conditional_offset + 2,
                      "conditional review round numbers must be contiguous",
                  )
                  remediation, remediation_estimated, remediation_max = validate_assignment(
                      conditional["remediation_assignment"],
                      expected_role="remediation",
                      route_profile=implementation_profile,
                      planned_at=planned_at,
                      reservation_ttl_seconds=reservation_ttl,
                      manifest_change_id=change_id,
                      limits=limits,
                      manifest_allowed_scopes=allowed_scopes,
                      role_allowed_scopes=role_tool_scopes["implementation"]["scopes"],
                  )
                  rereview, rereview_estimated, rereview_max = validate_assignment(
                      conditional["review_assignment"],
                      expected_role="independent_review",
                      route_profile=review_profile,
                      planned_at=planned_at,
                      reservation_ttl_seconds=reservation_ttl,
                      manifest_change_id=change_id,
                      limits=limits,
                      manifest_allowed_scopes=allowed_scopes,
                      role_allowed_scopes=role_tool_scopes["independent_review"][
                          "scopes"
                      ],
                  )
                  expected_fix_schedule = len(waves) + conditional_offset * 2 + 1
                  require_contract(
                      remediation["schedule_index"] == expected_fix_schedule
                      and rereview["schedule_index"] == expected_fix_schedule + 1
                      and remediation["dependency_wave_index"]
                      == int(prior_review["dependency_wave_index"]) + 1
                      and rereview["dependency_wave_index"]
                      == int(remediation["dependency_wave_index"]) + 1
                      and remediation["depends_on_assignment_ids"]
                      == [prior_review["assignment_id"]]
                      and rereview["depends_on_assignment_ids"]
                      == [remediation["assignment_id"]]
                      and remediation["contract_task_ids"] == task_ids
                      and rereview["contract_task_ids"] == task_ids
                      and remediation["remediation_path_scopes"]
                      == remediation_path_scopes,
                      "conditional remediation/re-review route is not canonical",
                  )
                  remediation_id = str(remediation["assignment_id"])
                  rereview_id = str(rereview["assignment_id"])
                  assignment_roles.extend(
                      (
                          (remediation_id, "remediation"),
                          (rereview_id, "independent_review"),
                      )
                  )
                  assignment_cost_limits[remediation_id] = remediation_max
                  assignment_cost_limits[rereview_id] = rereview_max
                  estimated_costs.extend((remediation_estimated, rereview_estimated))
                  conditional_assignments.extend((remediation, rereview))
                  conditional_rounds.append(conditional)
                  review_ids.append(rereview_id)
                  prior_review = rereview
              all_assignments = [
                  *implementation_assignments,
                  review,
                  *conditional_assignments,
              ]
              require_contract(
                  len({str(item["context_id"]) for item in all_assignments})
                  == len(all_assignments)
                  and len({str(item["workspace_key"]) for item in all_assignments})
                  == len(all_assignments),
                  "manifest assignments do not use unique contexts and workspaces",
              )
              all_assignment_ids = [str(item["assignment_id"]) for item in all_assignments]
              require_contract(
                  len(all_assignment_ids) == len(set(all_assignment_ids)),
                  "every planned assignment id must be unique",
              )
              implementation_families.update(
                  str(item["route"]["provider_family"])
                  for item in conditional_assignments
                  if item["role"] == "remediation"
              )
              require_contract(
                  all(
                      str(item["route"]["provider_family"])
                      not in implementation_families
                      for item in [
                          review,
                          *(
                              item["review_assignment"]
                              for item in conditional_rounds
                          ),
                      ]
                  ),
                  "review provider family is not independent of implementation",
              )

              checkpoints_value = manifest["human_checkpoints"]
              require_contract(
                  isinstance(checkpoints_value, list)
                  and 1 <= len(checkpoints_value) <= 256,
                  "manifest human checkpoints must be a bounded non-empty array",
              )
              assert isinstance(checkpoints_value, list)
              checkpoints: list[dict[str, object]] = []
              checkpoint_ids: list[str] = []
              known_assignments = set(all_assignment_ids)
              for checkpoint_value in checkpoints_value:
                  checkpoint = require_exact_fields(
                      checkpoint_value, checkpoint_fields, name="human checkpoint"
                  )
                  checkpoint_id = require_safe_id(
                      checkpoint["checkpoint_id"], name="checkpoint.checkpoint_id"
                  )
                  require_contract(
                      checkpoint["phase"] in {"before_assignment", "before_release"}
                      and checkpoint["required"] is True,
                      "human checkpoint phase or requirement is invalid",
                  )
                  checkpoint_assignment_ids = require_string_list(
                      checkpoint["assignment_ids"],
                      name="checkpoint.assignment_ids",
                      nonempty=True,
                  )
                  require_contract(
                      set(checkpoint_assignment_ids) <= known_assignments,
                      "human checkpoint references an unknown assignment",
                  )
                  require_nonempty_string(
                      checkpoint["approver_role"], name="checkpoint.approver_role"
                  )
                  require_string_list(
                      checkpoint["reason_codes"],
                      name="checkpoint.reason_codes",
                      nonempty=True,
                  )
                  checkpoint_ids.append(checkpoint_id)
                  checkpoints.append(checkpoint)
              require_contract(
                  checkpoint_ids == sorted(set(checkpoint_ids)),
                  "human checkpoints must be ordered and unique",
              )
              checkpoint_by_id = {
                  str(checkpoint["checkpoint_id"]): checkpoint for checkpoint in checkpoints
              }
              for assignment in [
                  *implementation_assignments,
                  *(
                      item
                      for item in conditional_assignments
                      if item["role"] == "remediation"
                  ),
              ]:
                  assignment_id = str(assignment["assignment_id"])
                  bound_checkpoint_ids = assignment["checkpoint_ids"]
                  needs_checkpoint = (
                      int(assignment["risk_tier"])
                      >= int(manifest["checkpoint_min_risk_tier"])
                      or bool(set(assignment["tool_scopes"]) & set(checkpoint_scopes))
                  )
                  require_contract(
                      not needs_checkpoint or bool(bound_checkpoint_ids),
                      "risk or checkpointed tool scope lacks a human checkpoint",
                  )
                  for checkpoint_id in bound_checkpoint_ids:
                      require_contract(
                          checkpoint_id in checkpoint_by_id
                          and checkpoint_by_id[str(checkpoint_id)]["phase"]
                          == "before_assignment"
                          and checkpoint_by_id[str(checkpoint_id)]["assignment_ids"]
                          == [assignment_id],
                          "assignment checkpoint is not exactly assignment-bound",
                      )
              releases = [
                  checkpoint
                  for checkpoint in checkpoints
                  if checkpoint["phase"] == "before_release"
              ]
              require_contract(
                  len(releases) == 1
                  and releases[0]["assignment_ids"] == review_ids
                  and releases[0]["reason_codes"] == ["release_approval"],
                  "manifest must have one checkpoint bound to every planned review",
              )
              require_contract(
                  sum(estimated_costs, Decimal("0"))
                  == require_decimal(
                      manifest["total_estimated_cost_usd"],
                      name="manifest.total_estimated_cost_usd",
                  )
                  <= max_total_cost,
                  "manifest total estimated cost is invalid",
              )
              reservation_ids = [
                  str(assignment["reservation"]["reservation_id"])
                  for assignment in all_assignments
              ]
              require_contract(
                  len(reservation_ids) == len(set(reservation_ids)),
                  "manifest reservation ids must be unique",
              )
              manifest_digest = hashlib.sha256(canonical_bytes(manifest)).hexdigest()
              return manifest, manifest_digest, assignment_roles, assignment_cost_limits

          def validate_review_history(
              history_value: object,
              *,
              manifest: dict[str, object],
              manifest_digest: str,
              receipts_by_id: dict[str, dict[str, object]],
              started_at: datetime,
              evaluated_at: datetime,
              release_valid_until: datetime,
          ) -> tuple[set[str], set[str], str]:
              max_rounds = int(manifest["limits"]["max_review_rounds"])
              require_contract(
                  isinstance(history_value, list)
                  and 1 <= len(history_value) <= max_rounds,
                  "review_history must be bounded by the protected review-round limit",
              )
              assert isinstance(history_value, list)
              conditional_rounds = manifest["conditional_review_rounds"]
              assert isinstance(conditional_rounds, list)
              planned_reviews = [
                  manifest["review_assignment"],
                  *(
                      item["review_assignment"]
                      for item in conditional_rounds
                      if isinstance(item, dict)
                  ),
              ]
              all_task_ids = sorted(
                  {
                      str(task_id)
                      for wave in manifest["execution_waves"]
                      if isinstance(wave, dict)
                      for assignment in wave["assignments"]
                      if isinstance(assignment, dict)
                      for task_id in assignment["contract_task_ids"]
                  }
              )
              remediation_scopes = manifest["remediation_path_scopes"]
              assert isinstance(remediation_scopes, list)
              trusted_attesters = {
                  (str(item["attester_id"]), str(item["public_key"]))
                  for item in manifest["trusted_review_attesters"]
                  if isinstance(item, dict)
              }
              selected_reviews: set[str] = set()
              selected_remediations: set[str] = set()
              attestation_expiries: list[datetime] = []
              for index, history_item_value in enumerate(history_value):
                  history = require_exact_fields(
                      history_item_value,
                      review_round_history_fields,
                      name="review round history",
                  )
                  round_number = require_integer(
                      history["round_number"],
                      name="review history.round_number",
                      minimum=1,
                      maximum=32,
                  )
                  require_contract(
                      history["schema_version"] == "agt.review-round-history/v1"
                      and round_number == index + 1,
                      "review_history schema and round numbers must be canonical",
                  )
                  planned_review = planned_reviews[index]
                  assert isinstance(planned_review, dict)
                  review_id = str(planned_review["assignment_id"])
                  review_receipt = receipts_by_id.get(review_id)
                  require_contract(
                      review_receipt is not None,
                      "review_history references a review absent from the receipt",
                  )
                  assert review_receipt is not None
                  route = planned_review["route"]
                  assert isinstance(route, dict)
                  expected_model_id = "/".join(
                      str(route[field])
                      for field in (
                          "provider",
                          "provider_family",
                          "model",
                          "version",
                          "deployment",
                      )
                  )
                  for field_name in (
                      "outcome_digest",
                      "output_digest",
                      "history_digest",
                  ):
                      require_digest(
                          history[field_name],
                          name=f"review history.{field_name}",
                      )
                  require_contract(
                      history["review_assignment_id"] == review_id
                      and history["context_id"] == planned_review["context_id"]
                      and history["workspace_key"] == planned_review["workspace_key"]
                      and history["reviewer_model_family"] == route["provider_family"]
                      and history["outcome_digest"] == review_receipt["outcome_digest"]
                      and history["output_digest"] == review_receipt["output_digest"],
                      "review history is not exactly bound to its planned execution",
                  )
                  review_requested_at = parse_canonical_timestamp(
                      review_receipt["requested_at"]
                  )
                  review_finished_at = parse_canonical_timestamp(
                      review_receipt["finished_at"]
                  )
                  review_request_digest = require_digest(
                      review_receipt["request_digest"],
                      name="review assignment request digest",
                  )
                  semantic = require_exact_fields(
                      history["semantic_outcome"],
                      review_semantic_fields,
                      name="authenticated review semantic outcome",
                  )
                  finding_set = require_exact_fields(
                      semantic["finding_set"],
                      review_finding_set_fields,
                      name="review finding set",
                  )
                  require_contract(
                      finding_set["schema_version"] == "agt.review-finding-set/v1",
                      "review finding-set schema is invalid",
                  )
                  findings_value = finding_set["findings"]
                  require_contract(
                      isinstance(findings_value, list) and len(findings_value) <= 256,
                      "review finding set must be a bounded array",
                  )
                  assert isinstance(findings_value, list)
                  finding_ids: list[str] = []
                  semantic_keys: list[tuple[str, str, str]] = []
                  for finding_value in findings_value:
                      finding = require_exact_fields(
                          finding_value,
                          review_finding_fields,
                          name="review finding",
                      )
                      finding_id = require_nonempty_string(
                          finding["finding_id"], name="review finding.finding_id"
                      )
                      task_id = require_nonempty_string(
                          finding["task_id"], name="review finding.task_id"
                      )
                      path = canonical_relative_path(
                          finding["path"], name="review finding.path"
                      )
                      rule_id = require_nonempty_string(
                          finding["rule_id"], name="review finding.rule_id"
                      )
                      require_digest(
                          finding["description_digest"],
                          name="review finding.description_digest",
                      )
                      require_contract(
                          task_id in all_task_ids
                          and any(
                              path_is_within_scope(path, str(scope))
                              for scope in remediation_scopes
                          ),
                          "review finding exceeds the canonical task or path scope",
                      )
                      finding_ids.append(finding_id)
                      semantic_keys.append((task_id, path, rule_id))
                  require_contract(
                      finding_ids == sorted(set(finding_ids))
                      and len(semantic_keys) == len(set(semantic_keys)),
                      "review findings must be canonical and unique",
                  )
                  finding_set_digest = require_digest(
                      finding_set["finding_set_digest"],
                      name="review finding_set_digest",
                  )
                  require_contract(
                      hashlib.sha256(
                          canonical_bytes(
                              {
                                  key: item
                                  for key, item in finding_set.items()
                                  if key != "finding_set_digest"
                              }
                          )
                      ).hexdigest()
                      == finding_set_digest,
                      "review finding_set_digest does not match its payload",
                  )
                  issued_at = parse_canonical_timestamp(semantic["issued_at"])
                  expires_at = parse_canonical_timestamp(semantic["expires_at"])
                  require_contract(
                      issued_at is not None
                      and expires_at is not None
                      and review_requested_at is not None
                      and review_finished_at is not None
                      and started_at <= review_requested_at
                      and review_requested_at
                      <= issued_at
                      <= review_finished_at
                      <= evaluated_at
                      < expires_at
                      and expires_at - issued_at
                      <= timedelta(
                          seconds=int(manifest["review_attestation_ttl_seconds"])
                      )
                      and expires_at > assembly_time,
                      "review semantic attestation is stale or outside the runtime window",
                  )
                  assert issued_at is not None and expires_at is not None
                  attestation_expiries.append(expires_at)
                  for digest_field in (
                      "report_digest",
                      "manifest_digest",
                      "change_digest",
                      "policy_digest",
                      "request_digest",
                      "attester_public_key",
                      "semantic_digest",
                  ):
                      require_digest(
                          semantic[digest_field],
                          name=f"review semantic.{digest_field}",
                      )
                  require_contract(
                      semantic["schema_version"]
                      == "agt.review-semantic-outcome/v1"
                      and semantic["whole_change"] is True
                      and semantic["verdict"] in {"blocking", "clean"}
                      and semantic["manifest_id"] == manifest["manifest_id"]
                      and semantic["manifest_digest"] == manifest_digest
                      and semantic["run_id"] == manifest["run_id"]
                      and semantic["change_digest"] == manifest["change_digest"]
                      and semantic["policy_digest"] == manifest["policy_digest"]
                      and semantic["review_assignment_id"] == review_id
                      and semantic["context_id"] == planned_review["context_id"]
                      and semantic["workspace_key"] == planned_review["workspace_key"]
                      and semantic["reviewer_model_id"] == expected_model_id
                      and semantic["reviewer_model_family"]
                      == route["provider_family"]
                      and semantic["review_round_number"] == round_number
                      and semantic["request_digest"] == review_request_digest
                      and semantic["report_digest"] == history["output_digest"]
                      and (
                          (semantic["verdict"] == "clean" and not findings_value)
                          or (
                              semantic["verdict"] == "blocking"
                              and bool(findings_value)
                          )
                      )
                      and (
                          str(semantic["attester_id"]),
                          str(semantic["attester_public_key"]),
                      )
                      in trusted_attesters,
                      "review semantic outcome is not bound to the exact trusted subject",
                  )
                  semantic_digest = str(semantic["semantic_digest"])
                  require_contract(
                      hashlib.sha256(
                          canonical_bytes(
                              {
                                  key: item
                                  for key, item in semantic.items()
                                  if key != "semantic_digest"
                              }
                          )
                      ).hexdigest()
                      == semantic_digest,
                      "review semantic digest does not match its signed payload",
                  )
                  signature_payload = {
                      key: item
                      for key, item in semantic.items()
                      if key not in {"attestation_signature", "semantic_digest"}
                  }
                  signature_payload["issued_at"] = issued_at.isoformat()
                  signature_payload["expires_at"] = expires_at.isoformat()
                  require_contract(
                      verify_ed25519(
                          public_key=str(semantic["attester_public_key"]),
                          signature=str(semantic["attestation_signature"]),
                          payload=canonical_bytes(signature_payload),
                      ),
                      "review semantic attestation signature is invalid",
                  )
                  remediation_value = history["remediation"]
                  is_final = index == len(history_value) - 1
                  require_contract(
                      (not is_final and semantic["verdict"] == "blocking")
                      or (is_final and semantic["verdict"] == "clean"),
                      "review history must stop at its first clean whole-change verdict",
                  )
                  if not is_final:
                      remediation = require_exact_fields(
                          remediation_value,
                          remediation_history_fields,
                          name="remediation execution history",
                      )
                      require_contract(
                          remediation["schema_version"]
                          == "agt.remediation-execution-history/v1",
                          "remediation history schema is invalid",
                      )
                      planned_conditional = conditional_rounds[index]
                      assert isinstance(planned_conditional, dict)
                      planned_remediation = planned_conditional[
                          "remediation_assignment"
                      ]
                      assert isinstance(planned_remediation, dict)
                      remediation_id = str(planned_remediation["assignment_id"])
                      remediation_receipt = receipts_by_id.get(remediation_id)
                      require_contract(
                          remediation_receipt is not None
                          and remediation["assignment_id"] == remediation_id
                          and remediation["context_id"]
                          == planned_remediation["context_id"]
                          and remediation["workspace_key"]
                          == planned_remediation["workspace_key"]
                          and remediation["outcome_digest"]
                          == remediation_receipt["outcome_digest"]
                          and remediation["output_digest"]
                          == remediation_receipt["output_digest"],
                          "remediation history is not exactly bound to its execution",
                      )
                      binding = require_exact_fields(
                          remediation["binding"],
                          remediation_binding_fields,
                          name="remediation scope binding",
                      )
                      expected_task_ids = sorted(
                          {str(item["task_id"]) for item in findings_value}
                      )
                      expected_paths = sorted(
                          {str(item["path"]) for item in findings_value}
                      )
                      require_contract(
                          binding["schema_version"]
                          == "agt.remediation-scope-binding/v1"
                          and binding["prior_review_assignment_id"] == review_id
                          and binding["prior_review_outcome_digest"]
                          == history["outcome_digest"]
                          and binding["finding_set"] == finding_set
                          and binding["task_ids"] == expected_task_ids
                          and binding["paths"] == expected_paths,
                          "remediation scope does not exactly match the blocking finding set",
                      )
                      for digest_record, digest_field, label in (
                          (binding, "binding_digest", "remediation binding"),
                          (remediation, "history_digest", "remediation history"),
                      ):
                          actual_digest = require_digest(
                              digest_record[digest_field],
                              name=f"{label}.{digest_field}",
                          )
                          require_contract(
                              hashlib.sha256(
                                  canonical_bytes(
                                      {
                                          key: item
                                          for key, item in digest_record.items()
                                          if key != digest_field
                                      }
                                  )
                              ).hexdigest()
                              == actual_digest,
                              f"{label} digest does not match its payload",
                          )
                      selected_remediations.add(remediation_id)
                  else:
                      require_contract(
                          remediation_value is None,
                          "a clean review cannot authorize remediation",
                      )
                  history_digest = str(history["history_digest"])
                  require_contract(
                      hashlib.sha256(
                          canonical_bytes(
                              {
                                  key: item
                                  for key, item in history.items()
                                  if key != "history_digest"
                              }
                          )
                      ).hexdigest()
                      == history_digest,
                      "review history digest does not match its payload",
                  )
                  selected_reviews.add(review_id)
              final_review_id = str(planned_reviews[len(history_value) - 1]["assignment_id"])
              require_contract(
                  release_valid_until <= min(attestation_expiries),
                  "release validity exceeds an authenticated review attestation",
              )
              return selected_reviews, selected_remediations, final_review_id

          def validate_execution_receipt(
              receipt_value: object,
              *,
              manifest: dict[str, object],
              manifest_digest: str,
              assignment_roles: list[tuple[str, str]],
              assignment_cost_limits: dict[str, Decimal],
          ) -> tuple[dict[str, object], str]:
              receipt = require_exact_fields(
                  receipt_value, receipt_fields, name="execution receipt"
              )
              require_contract(
                  receipt["schema_version"]
                  == "agt.orchestration-execution-receipt/v1"
                  and receipt["manifest_id"] == manifest["manifest_id"]
                  and receipt["manifest_digest"] == manifest_digest
                  and receipt["run_id"] == manifest["run_id"]
                  and receipt["change_id"] == change_id
                  and receipt["change_digest"] == change_digest
                  and receipt["policy_digest"] == manifest["policy_digest"],
                  "execution receipt is not exactly manifest/change/policy bound",
              )
              require_digest(receipt["manifest_digest"], name="receipt.manifest_digest")
              require_digest(receipt["change_digest"], name="receipt.change_digest")
              require_digest(receipt["policy_digest"], name="receipt.policy_digest")
              require_contract(
                  receipt["status"] == "succeeded"
                  and receipt["final"] is True
                  and receipt["cost_complete"] is True
                  and receipt["unknown_cost_assignment_ids"] == []
                  and receipt["reason_codes"] == [],
                  "execution receipt must be final, successful, and cost-complete",
              )
              started_at = parse_canonical_timestamp(receipt["started_at"])
              evaluated_at = parse_canonical_timestamp(receipt["evaluated_at"])
              release_checkpoint_valid_until = parse_canonical_timestamp(
                  receipt["release_checkpoint_valid_until"]
              )
              require_contract(
                  started_at is not None
                  and evaluated_at is not None
                  and evaluated_at >= started_at,
                  "execution receipt timestamps are invalid",
              )
              require_contract(
                  release_checkpoint_valid_until is not None
                  and release_checkpoint_valid_until > evaluated_at
                  and release_checkpoint_valid_until > assembly_time,
                  "execution receipt release checkpoint is missing or expired",
              )
              require_contract(
                  release_checkpoint_valid_until > assembly_time,
                  "execution receipt release checkpoint expired before evidence assembly",
              )
              assignments_value = receipt["assignments"]
              require_contract(
                  isinstance(assignments_value, list)
                  and 1 <= len(assignments_value) <= 320,
                  "execution receipt assignments must be a bounded non-empty array",
              )
              assert isinstance(assignments_value, list)
              manifest_assignment_by_id: dict[str, dict[str, object]] = {}
              manifest_waves = manifest["execution_waves"]
              assert isinstance(manifest_waves, list)
              for wave in manifest_waves:
                  assert isinstance(wave, dict)
                  wave_assignments = wave["assignments"]
                  assert isinstance(wave_assignments, list)
                  for assignment in wave_assignments:
                      assert isinstance(assignment, dict)
                      manifest_assignment_by_id[str(assignment["assignment_id"])] = assignment
              manifest_review = manifest["review_assignment"]
              assert isinstance(manifest_review, dict)
              review_id = str(manifest_review["assignment_id"])
              manifest_assignment_by_id[review_id] = manifest_review
              conditional_rounds = manifest["conditional_review_rounds"]
              assert isinstance(conditional_rounds, list)
              for conditional in conditional_rounds:
                  assert isinstance(conditional, dict)
                  for field_name in ("remediation_assignment", "review_assignment"):
                      conditional_assignment = conditional[field_name]
                      assert isinstance(conditional_assignment, dict)
                      manifest_assignment_by_id[
                          str(conditional_assignment["assignment_id"])
                      ] = conditional_assignment
              manifest_scopes = require_string_list(
                  manifest["allowed_tool_scopes"],
                  name="manifest.allowed_tool_scopes",
                  allowed=tool_scopes,
              )
              receipt_role_capabilities = validate_tool_governance(
                  manifest["tool_governance"],
                  manifest_allowed_scopes=manifest_scopes,
              )
              tool_governance = manifest["tool_governance"]
              assert isinstance(tool_governance, dict)
              privileged_actions = set(tool_governance["privileged_actions"])
              release_checkpoint_count = sum(
                  1
                  for checkpoint in manifest["human_checkpoints"]
                  if isinstance(checkpoint, dict)
                  and checkpoint["phase"] == "before_release"
                  and review_id in checkpoint["assignment_ids"]
              )
              raw_receipts_by_id = {
                  str(item["assignment_id"]): item
                  for item in assignments_value
                  if isinstance(item, dict) and "assignment_id" in item
              }
              require_contract(
                  len(raw_receipts_by_id) == len(assignments_value),
                  "execution receipt assignment ids must be unique",
              )
              selected_reviews, selected_remediations, final_review_id = (
                  validate_review_history(
                      receipt["review_history"],
                      manifest=manifest,
                      manifest_digest=manifest_digest,
                      receipts_by_id=raw_receipts_by_id,
                      started_at=started_at,
                      evaluated_at=evaluated_at,
                      release_valid_until=release_checkpoint_valid_until,
                  )
              )
              implementation_ids = {
                  str(assignment["assignment_id"])
                  for wave in manifest_waves
                  for assignment in wave["assignments"]
              }
              expected_succeeded = (
                  implementation_ids | selected_reviews | selected_remediations
              )
              observed_roles: list[tuple[str, str]] = []
              actual_costs: list[Decimal] = []
              usage_event_ids: list[str] = []
              for assignment_value in assignments_value:
                  assignment = require_exact_fields(
                      assignment_value,
                      assignment_receipt_fields,
                      name="assignment execution receipt",
                  )
                  assignment_id = require_safe_id(
                      assignment["assignment_id"], name="receipt.assignment_id"
                  )
                  role = assignment["role"]
                  require_contract(
                      role in {
                          "implementation",
                          "independent_review",
                          "remediation",
                      },
                      "assignment receipt role is invalid",
                  )
                  should_succeed = assignment_id in expected_succeeded
                  assignment_finished_at = parse_canonical_timestamp(
                      assignment["finished_at"]
                  )
                  require_contract(
                      assignment_finished_at is not None
                      and started_at <= assignment_finished_at <= evaluated_at,
                      "terminal assignment receipt has an invalid finished_at",
                  )
                  if should_succeed:
                      assignment_requested_at = parse_canonical_timestamp(
                          assignment["requested_at"]
                      )
                      require_contract(
                          assignment["state"] == "succeeded"
                          and assignment["host_invoked"] is True
                          and assignment["failure_code"] is None
                          and assignment_requested_at is not None
                          and started_at
                          <= assignment_requested_at
                          <= assignment_finished_at,
                          "selected assignment receipt is not a successful host execution",
                      )
                      require_digest(
                          assignment["request_digest"],
                          name="receipt.assignment.request_digest",
                      )
                      require_integer(
                          assignment["attempt_count"],
                          name="receipt.assignment.attempt_count",
                          minimum=1,
                      )
                  else:
                      require_contract(
                          assignment["state"] == "skipped"
                          and assignment["attempt_count"] == 0
                          and assignment["host_invoked"] is False
                          and assignment["request_digest"] is None
                          and assignment["requested_at"] is None
                          and assignment["checkpoint_grant_digests"] == []
                          and assignment["outcome_digest"] is None
                          and assignment["usage_event_id"] is None
                          and assignment["actual_cost_usd"] is None
                          and assignment["turns"] is None
                          and assignment["tool_calls"] is None
                          and assignment["tool_call_audits"] == []
                          and assignment["output_digest"] is None
                          and assignment["failure_code"] is None,
                          "unselected conditional work must be canonically skipped",
                      )
                  grant_digests = require_string_list(
                      assignment["checkpoint_grant_digests"],
                      name="receipt.assignment.checkpoint_grant_digests",
                  )
                  for grant_digest in grant_digests:
                      require_digest(
                          grant_digest,
                          name="receipt.assignment.checkpoint_grant_digest",
                      )
                  manifest_assignment = manifest_assignment_by_id.get(assignment_id)
                  require_contract(
                      manifest_assignment is not None,
                      "receipt assignment is absent from the manifest",
                  )
                  assert manifest_assignment is not None
                  receipt_prompt = validate_prompt(
                      assignment["prompt"], name="receipt.assignment.prompt"
                  )
                  require_contract(
                      receipt_prompt == manifest_assignment["prompt"],
                      "receipt prompt does not match the manifest assignment prompt",
                  )
                  expected_grant_count = len(manifest_assignment["checkpoint_ids"])
                  if assignment_id == final_review_id:
                      expected_grant_count += release_checkpoint_count
                  require_contract(
                      len(grant_digests)
                      == (expected_grant_count if should_succeed else 0),
                      "receipt checkpoint grants do not cover manifest checkpoints",
                  )
                  if not should_succeed:
                      observed_roles.append((assignment_id, str(role)))
                      continue
                  require_digest(
                      assignment["outcome_digest"],
                      name="receipt.assignment.outcome_digest",
                  )
                  usage_event_ids.append(
                      require_nonempty_string(
                          assignment["usage_event_id"],
                          name="receipt.assignment.usage_event_id",
                      )
                  )
                  actual_cost = require_decimal(
                      assignment["actual_cost_usd"],
                      name="receipt.assignment.actual_cost_usd",
                  )
                  require_contract(
                      assignment_id in assignment_cost_limits
                      and actual_cost <= assignment_cost_limits[assignment_id],
                      "assignment actual cost exceeds its manifest ceiling",
                  )
                  turns = require_integer(
                      assignment["turns"], name="receipt.assignment.turns"
                  )
                  tool_calls = require_integer(
                      assignment["tool_calls"], name="receipt.assignment.tool_calls"
                  )
                  require_contract(
                      turns <= int(manifest_assignment["max_turns"])
                      and tool_calls <= int(manifest_assignment["max_tool_calls"]),
                      "receipt assignment usage exceeds manifest turn/tool ceilings",
                  )
                  audits_value = assignment["tool_call_audits"]
                  require_contract(
                      isinstance(audits_value, list)
                      and len(audits_value) == tool_calls,
                      "screened tool-audit count does not match observed tool calls",
                  )
                  assert isinstance(audits_value, list)
                  action_ids: list[str] = []
                  role_capabilities = receipt_role_capabilities[
                      "implementation" if role == "remediation" else str(role)
                  ]
                  for audit_index, audit_value in enumerate(audits_value):
                      audit = require_exact_fields(
                          audit_value,
                          tool_audit_fields,
                          name=f"receipt tool audit {audit_index}",
                      )
                      action_id = require_safe_id(
                          audit["action_id"], name="receipt tool audit.action_id"
                      )
                      action_ids.append(action_id)
                      tool = require_nonempty_string(
                          audit["tool"], name="receipt tool audit.tool"
                      )
                      action = audit["action"]
                      require_nonempty_string(
                          audit["resource"], name="receipt tool audit.resource"
                      )
                      require_contract(
                          audit["schema_version"] == "agt.tool-call-audit/v1"
                          and audit["manifest_id"] == manifest["manifest_id"]
                          and audit["assignment_id"] == assignment_id
                          and tool in role_capabilities["tools"]
                          and action in role_capabilities["actions"]
                          and audit["decision"] == "screened"
                          and audit["reason_code"] is None
                          and type(audit["privileged"]) is bool
                          and audit["privileged"]
                          is (action in privileged_actions),
                          "receipt tool audit is unbound, unauthorized, or unscreened",
                      )
                      require_digest(
                          audit["request_digest"],
                          name="receipt tool audit.request_digest",
                      )
                      require_digest(
                          audit["result_digest"],
                          name="receipt tool audit.result_digest",
                      )
                      approval_digest = audit["approval_grant_digest"]
                      if action in privileged_actions:
                          require_contract(
                              isinstance(approval_digest, str)
                              and approval_digest in grant_digests,
                              "privileged tool audit lacks its exact approval grant",
                          )
                      else:
                          require_contract(
                              approval_digest is None,
                              "non-privileged tool audit unexpectedly claims approval",
                          )
                      authorized_at = parse_canonical_timestamp(
                          audit["authorized_at"]
                      )
                      completed_at = parse_canonical_timestamp(audit["completed_at"])
                      require_contract(
                          authorized_at is not None
                          and completed_at is not None
                          and started_at <= authorized_at <= completed_at <= evaluated_at,
                          "receipt tool audit timestamps are invalid",
                      )
                      audit_digest = require_digest(
                          audit["audit_digest"], name="receipt tool audit.audit_digest"
                      )
                      unsigned_audit = {
                          key: item
                          for key, item in audit.items()
                          if key != "audit_digest"
                      }
                      require_contract(
                          hashlib.sha256(canonical_bytes(unsigned_audit)).hexdigest()
                          == audit_digest,
                          "receipt tool audit digest does not match its payload",
                      )
                  require_contract(
                      action_ids == sorted(set(action_ids)),
                      "receipt tool audits are not ordered by unique action_id",
                  )
                  require_digest(
                      assignment["output_digest"],
                      name="receipt.assignment.output_digest",
                  )
                  observed_roles.append((assignment_id, str(role)))
                  actual_costs.append(actual_cost)
              require_contract(
                  observed_roles == assignment_roles,
                  "execution receipt assignment set does not exactly match the manifest",
              )
              require_contract(
                  len(usage_event_ids) == len(set(usage_event_ids)),
                  "execution receipt usage_event_ids must be unique",
              )
              total_actual = require_decimal(
                  receipt["total_actual_cost_usd"], name="receipt.total_actual_cost_usd"
              )
              max_total = require_decimal(
                  require_exact_fields(
                      manifest["limits"], limit_fields, name="limits"
                  )["max_total_cost_usd"],
                  name="limits.max_total_cost_usd",
              )
              require_contract(
                  total_actual == sum(actual_costs, Decimal("0"))
                  and total_actual <= max_total,
                  "execution receipt total actual cost is invalid",
              )
              receipt_digest = require_digest(
                  receipt["receipt_digest"], name="receipt.receipt_digest"
              )
              unsigned_receipt = {
                  key: value for key, value in receipt.items() if key != "receipt_digest"
              }
              require_contract(
                  hashlib.sha256(canonical_bytes(unsigned_receipt)).hexdigest()
                  == receipt_digest,
                  "execution receipt digest does not match its canonical payload",
              )
              return receipt, receipt_digest

